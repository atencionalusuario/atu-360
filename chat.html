<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mobile-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="/atu-360/">
<title>ATU 360 — Chat</title>
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="base.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter','Segoe UI',sans-serif; background: #F8FAFC; display: flex; min-height: 100vh; color: #1E293B; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { background: white; padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E2E8F0; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-left h2 { font-size: 0.9rem; font-weight: 600; }
  .topbar-sep { color: #CBD5E1; }
  .topbar-left p { font-size: 0.78rem; color: #94A3B8; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .tb-clock { font-size: 1rem; font-weight: 700; color: #1A3DAA; font-variant-numeric: tabular-nums; }

  .chat-shell { flex: 1; display: flex; overflow: hidden; }

  /* LISTA DE CONVERSACIONES */
  .conv-col { width: 300px; flex-shrink: 0; background: white; border-right: 1px solid #E2E8F0; display: flex; flex-direction: column; }
  .conv-head { padding: 16px 18px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; }
  .conv-head-title { font-size: 0.85rem; font-weight: 700; color: #1E293B; }
  .btn-nuevo-chat { width: 28px; height: 28px; border-radius: 7px; background: #1A3DAA; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .btn-nuevo-chat:hover { opacity: 0.88; }
  .conv-list { flex: 1; overflow-y: auto; }
  .conv-group-label { font-size: 0.62rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; padding: 12px 18px 6px; }
  .conv-item { display: flex; align-items: center; gap: 10px; padding: 11px 18px; cursor: pointer; border-bottom: 1px solid #F8FAFC; position: relative; }
  .conv-item:hover { background: #F8FAFC; }
  .conv-item.active { background: #EEF2FF; }
  .conv-avatar { width: 36px; height: 36px; border-radius: 50%; background: #1A3DAA; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; }
  .conv-avatar.grupal { background: #7C3AED; }
  .conv-info { flex: 1; min-width: 0; }
  .conv-nombre { font-size: 0.82rem; font-weight: 700; color: #1E293B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { font-size: 0.72rem; color: #94A3B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .conv-item.unread .conv-nombre { color: #1A3DAA; }
  .conv-item.unread .conv-preview { color: #374151; font-weight: 600; }
  .conv-dot { width: 8px; height: 8px; border-radius: 50%; background: #1A3DAA; flex-shrink: 0; }
  .conv-empty { padding: 40px 20px; text-align: center; color: #94A3B8; font-size: 0.8rem; }

  /* PANEL DE MENSAJES */
  .thread-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .thread-head { padding: 14px 24px; border-bottom: 1px solid #E2E8F0; background: white; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .thread-head-avatar { width: 34px; height: 34px; border-radius: 50%; background: #1A3DAA; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
  .thread-head-avatar.grupal { background: #7C3AED; }
  .thread-head-nombre { font-size: 0.88rem; font-weight: 700; color: #1E293B; }
  .thread-head-sub { font-size: 0.72rem; color: #94A3B8; margin-top: 1px; }
  .thread-body { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .msg-row { display: flex; }
  .msg-row.mio { justify-content: flex-end; }
  .msg-wrap { position: relative; max-width: 60%; display: flex; flex-direction: column; }
  .msg-row.mio .msg-wrap { align-items: flex-end; }
  .msg-bubble { padding: 9px 14px; border-radius: 12px; font-size: 0.84rem; line-height: 1.5; word-wrap: break-word; }
  .msg-row:not(.mio) .msg-bubble { background: white; border: 1px solid #E2E8F0; color: #1E293B; border-bottom-left-radius: 3px; }
  .msg-row.mio .msg-bubble { background: #1A3DAA; color: white; border-bottom-right-radius: 3px; }
  .msg-autor { font-size: 0.68rem; font-weight: 700; color: #7C3AED; margin-bottom: 2px; }
  .msg-hora { font-size: 0.62rem; margin-top: 4px; opacity: 0.7; }
  .msg-reacts-bar { display: none; gap: 1px; position: absolute; top: -18px; left: 0; background: white; border: 1px solid #E2E8F0; border-radius: 20px; padding: 2px 3px; box-shadow: 0 2px 8px rgba(0,0,0,0.14); z-index: 5; }
  .msg-row.mio .msg-reacts-bar { left: auto; right: 0; }
  .msg-wrap:hover .msg-reacts-bar { display: flex; }
  .msg-reacts-bar button { border: none; background: none; font-size: 0.95rem; line-height: 1; cursor: pointer; padding: 3px 4px; border-radius: 50%; }
  .msg-reacts-bar button:hover { background: #F1F5F9; }
  .msg-reactions { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
  .react-pill { display: inline-flex; align-items: center; gap: 3px; background: white; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 1px 7px; font-size: 0.72rem; cursor: pointer; }
  .react-pill.mine { border-color: #1A3DAA; background: #EEF2FF; }
  .react-pill:hover { border-color: #94A3B8; }
  .thread-foot { position: relative; padding: 14px 24px; border-top: 1px solid #E2E8F0; background: white; display: flex; gap: 10px; flex-shrink: 0; }
  .thread-foot input { flex: 1; padding: 10px 14px; border: 1.5px solid #E2E8F0; border-radius: 20px; font-size: 0.85rem; font-family: inherit; outline: none; background: #F8FAFC; }
  .thread-foot input:focus { border-color: #1A3DAA; background: white; }
  .btn-enviar { width: 40px; height: 40px; border-radius: 50%; background: #1A3DAA; color: white; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-enviar:hover { opacity: 0.88; }
  .btn-enviar:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-emoji { width: 40px; height: 40px; border-radius: 50%; background: #F1F5F9; color: #64748B; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.15rem; }
  .btn-emoji:hover { background: #E2E8F0; }
  .emoji-panel { position: absolute; bottom: 64px; left: 24px; background: white; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 10px; display: none; grid-template-columns: repeat(8, 1fr); gap: 2px; width: 296px; max-height: 200px; overflow-y: auto; z-index: 50; }
  .emoji-panel.show { display: grid; }
  .emoji-panel button { border: none; background: none; font-size: 1.25rem; line-height: 1; cursor: pointer; padding: 6px 0; border-radius: 6px; }
  .emoji-panel button:hover { background: #F1F5F9; }
  .btn-img { width: 40px; height: 40px; border-radius: 50%; background: #F1F5F9; color: #64748B; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .btn-img:hover { background: #E2E8F0; }
  .img-preview-bar { position: absolute; bottom: 100%; left: 24px; margin-bottom: 8px; background: white; border: 1px solid #E2E8F0; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 8px; display: none; }
  .img-preview-bar.show { display: block; }
  .img-preview-bar .wrap { position: relative; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; }
  .img-preview-bar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-preview-bar .del { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.55); color: white; font-size: 0.78rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .img-preview-bar .del:hover { background: #DC2626; }
  .msg-img { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; cursor: zoom-in; }
  .msg-img + .msg-hora { margin-top: 4px; }
  .lightbox-chat { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.85); z-index: 300; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
  .lightbox-chat.show { display: flex; }
  .lightbox-chat img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .readonly-banner { padding: 10px 24px; background: #FFFBEB; color: #B45309; font-size: 0.76rem; font-weight: 600; border-top: 1px solid #FDE68A; flex-shrink: 0; }
  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #94A3B8; font-size: 0.85rem; flex-direction: column; gap: 8px; }

  /* MODAL NUEVO CHAT */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 200; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 60px 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: white; border-radius: 12px; width: 420px; max-width: 96vw; box-shadow: 0 24px 48px rgba(0,0,0,0.15); }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 0.92rem; font-weight: 700; }
  .modal-body { padding: 8px 0; max-height: 60vh; overflow-y: auto; }
  .btn-icon { width: 28px; height: 28px; border: 1px solid #E2E8F0; border-radius: 6px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748B; flex-shrink: 0; }
  .agente-pick { display: flex; align-items: center; gap: 10px; padding: 11px 22px; cursor: pointer; }
  .agente-pick:hover { background: #F8FAFC; }
  .avatar-pick { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
  .avatar-pick.sel { border-color: #1E293B; }
  .nc-tabs { display: flex; gap: 0; border-bottom: 1px solid #F1F5F9; padding: 0 22px; }
  .nc-tab { padding: 10px 4px; margin-right: 20px; font-size: 0.8rem; font-weight: 600; color: #94A3B8; border: none; background: none; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .nc-tab.active { color: #1A3DAA; border-bottom-color: #1A3DAA; }
  .grupo-nombre-field { padding: 16px 22px 4px; }
  .grupo-nombre-field input { width: 100%; padding: 9px 12px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.85rem; font-family: inherit; outline: none; background: #F8FAFC; }
  .grupo-pick { display: flex; align-items: center; gap: 10px; padding: 10px 22px; cursor: pointer; }
  .grupo-pick:hover { background: #F8FAFC; }
  .grupo-pick input { width: 16px; height: 16px; flex-shrink: 0; cursor: pointer; }
  .btn-crear-grupo { margin: 12px 22px 18px; padding: 10px; border: none; border-radius: 8px; background: #1A3DAA; color: white; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; width: calc(100% - 44px); }
  .btn-crear-grupo:hover { opacity: 0.88; }
  .agente-pick .conv-avatar { width: 30px; height: 30px; font-size: 0.65rem; }
  .loading { font-size: 0.82rem; color: #94A3B8; text-align: center; padding: 24px; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: white; padding: 12px 18px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2>Chat</h2>
      <span class="topbar-sep">/</span>
      <p id="topbarSub">Cargando...</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="chat-shell">
    <div class="conv-col">
      <div class="conv-head">
        <div class="conv-head-title">Conversaciones</div>
        <button class="btn-nuevo-chat" id="btnNuevoChat" style="display:none" onclick="abrirModalNuevoChat()" title="Nuevo chat">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="conv-list" id="convList"><div class="loading">Cargando...</div></div>
    </div>

    <div class="thread-col" id="threadCol">
      <div class="empty-state" id="threadEmpty">
        <svg width="44" height="44" fill="none" stroke="#CBD5E1" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <div>Selecciona una conversación</div>
      </div>
    </div>
  </div>
</div>

<!-- Modal nuevo chat 1 a 1 / nuevo grupo -->
<div class="modal-overlay" id="modalNuevoChat">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalNuevoChatTitulo">Iniciar chat con un colaborador</div>
      <button class="btn-icon" onclick="cerrarModalNuevoChat()">✕</button>
    </div>
    <div class="nc-tabs" id="ncTabs" style="display:none">
      <button type="button" class="nc-tab active" onclick="cambiarModoNuevoChat('directo')">Chat directo</button>
      <button type="button" class="nc-tab" onclick="cambiarModoNuevoChat('grupo')">Crear grupo</button>
    </div>
    <div class="modal-body" id="listaAgentesModal"><div class="loading">Cargando...</div></div>
  </div>
</div>

<!-- Modal editar grupo -->
<div class="modal-overlay" id="modalEditarGrupo">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title">Editar grupo</div>
      <button class="btn-icon" onclick="cerrarModalEditarGrupo()">✕</button>
    </div>
    <div class="modal-body" style="padding:18px 22px;display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="font-size:0.78rem;font-weight:600;color:#374151;margin-bottom:6px;display:block">Nombre del grupo</label>
        <input type="text" id="egNombre" placeholder="Ej. Equipo de Turno AM" style="width:100%;padding:9px 12px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:0.85rem;font-family:inherit;outline:none;background:#F8FAFC">
      </div>
      <div>
        <label style="font-size:0.78rem;font-weight:600;color:#374151;margin-bottom:8px;display:block">Ícono del grupo</label>
        <div id="egAvatares" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"></div>
      </div>
    </div>
    <div style="padding:14px 22px;border-top:1px solid #F1F5F9;display:flex;justify-content:flex-end;gap:8px">
      <button class="btn-icon" style="width:auto;padding:8px 16px;font-size:0.8rem;font-weight:600;color:#374151" onclick="cerrarModalEditarGrupo()">Cancelar</button>
      <button class="btn-enviar" style="width:auto;border-radius:8px;padding:8px 18px;font-size:0.8rem;font-weight:700" onclick="guardarGrupo()">Guardar</button>
    </div>
  </div>
</div>

<div class="lightbox-chat" id="lightboxChat" onclick="cerrarLightboxChat()">
  <img id="lightboxChatImg" src="" alt="Imagen ampliada">
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  var BASE = 'https://atencionalusuario.github.io/atu-360/';
  var ROLES_PERMITIDOS = ['supervisor', 'jefe', 'agente', 'agente-inmersion', 'superadmin'];

  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var db   = firebase.firestore();
  var auth = firebase.auth();

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var currentUser = null, miRolG = '', miNombreG = '', miEmailG = '', miProyectoG = '';
  var contactosJefe = []; // supervisores + agentes del proyecto del jefe, para iniciar chats
  var soloLectura = false;
  var chats = [];
  var chatActivoId = null;
  var mensajesActuales = [];
  var unsubMensajes = null;
  var agentesDeEquipo = [];

  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function iniciales(n){ return (n||'?').split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase(); }

  // ── Selector de emojis ───────────────────────────────────────────────────────
  var EMOJIS = ['😀','😂','😅','😊','🙂','😉','😍','😘','😎','🤔','😐','😢','😭','😡','😱','😴',
                '👍','👎','👏','🙏','💪','🤝','👋','✌️','❤️','🔥','🎉','⭐','✅','❌','⚠️','❓',
                '📌','📞','📅','⏰','☕','🍽️','🚻','💬'];
  window.toggleEmojiPanel = function(){
    var panel = document.getElementById('emojiPanel');
    if(panel) panel.classList.toggle('show');
  };
  window.insertarEmoji = function(e){
    var input = document.getElementById('mInput');
    if(input){ input.value += e; input.focus(); }
  };
  document.addEventListener('click', function(ev){
    var panel = document.getElementById('emojiPanel'), btn = document.getElementById('btnEmoji');
    if(!panel || !panel.classList.contains('show')) return;
    if(panel.contains(ev.target) || (btn && btn.contains(ev.target))) return;
    panel.classList.remove('show');
  });

  auth.onAuthStateChanged(function(user){
    if(!user){ window.location.href = BASE + 'login.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(doc){
      if(!doc.exists || !ROLES_PERMITIDOS.includes(doc.data().rol)){
        window.location.href = BASE + 'home.html'; return;
      }
      currentUser = user;
      miRolG      = doc.data().rol || '';
      miNombreG   = doc.data().nombre || user.email.split('@')[0];
      miEmailG    = user.email;
      miProyectoG = doc.data().proyecto || '';
      soloLectura = miRolG === 'superadmin';

      if(miRolG === 'supervisor'){
        document.getElementById('btnNuevoChat').style.display = 'flex';
        asegurarChatGrupal();
        cargarAgentesDeEquipo();
      } else if(miRolG === 'jefe'){
        document.getElementById('btnNuevoChat').style.display = 'flex';
      }
      cargarChats();
    });
  });

  // ── Asegurar / sincronizar el chat grupal del equipo del supervisor ─────────
  function cargarAgentesDeEquipo(cb){
    db.collection('usuarios').where('emailSupervisor','==',miEmailG).where('activo','==',true).get().then(function(snap){
      agentesDeEquipo = [];
      snap.forEach(function(d){
        var x = d.data();
        if(['agente','agente-inmersion'].indexOf(x.rol) < 0) return;
        agentesDeEquipo.push({ uid: d.id, nombre: x.nombre || x.email, rol: x.rol });
      });
      if(cb) cb();
    });
  }

  function asegurarChatGrupal(){
    cargarAgentesDeEquipo(function(){
      var id = 'grupal_' + currentUser.uid;
      var participantes = [currentUser.uid].concat(agentesDeEquipo.map(function(a){ return a.uid; }));
      var participantesInfo = {};
      participantesInfo[currentUser.uid] = { nombre: miNombreG, rol: miRolG };
      agentesDeEquipo.forEach(function(a){ participantesInfo[a.uid] = { nombre: a.nombre, rol: a.rol }; });

      db.collection('chats').doc(id).get().then(function(doc){
        var data = {
          tipo: 'grupal',
          supervisorUid: currentUser.uid, supervisorNombre: miNombreG,
          participantes: participantes, participantesInfo: participantesInfo
        };
        // Solo poner nombre/ícono por defecto la primera vez — no pisar lo que el supervisor ya personalizó.
        if(!doc.exists){
          data.nombre = 'Equipo de ' + miNombreG;
          data.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
        }
        db.collection('chats').doc(id).set(data, { merge: true }).catch(function(e){ console.error('chat grupal:', e); });
      });
    });
  }

  // ── Cargar lista de conversaciones ───────────────────────────────────────────
  function cargarChats(){
    var q = soloLectura
      ? db.collection('chats')
      : db.collection('chats').where('participantes', 'array-contains', currentUser.uid);
    q.onSnapshot(function(snap){
      chats = [];
      snap.forEach(function(d){ chats.push(Object.assign({ id: d.id }, d.data())); });
      chats.sort(function(a,b){
        var ta = a.ultimoMensaje && a.ultimoMensaje.fecha ? a.ultimoMensaje.fecha.seconds : (a.creadoEn ? a.creadoEn.seconds : 0);
        var tb = b.ultimoMensaje && b.ultimoMensaje.fecha ? b.ultimoMensaje.fecha.seconds : (b.creadoEn ? b.creadoEn.seconds : 0);
        return tb - ta;
      });
      renderConvList();
      if(chatActivoId){
        var sigueExistiendo = chats.some(function(c){ return c.id === chatActivoId; });
        if(!sigueExistiendo){ chatActivoId = null; mostrarVacio(); }
      }
    }, function(e){ console.error('chats:', e); showToast('Error al cargar tus conversaciones.'); });
  }

  function nombreDeChat(c){
    if(c.tipo === 'grupal') return c.nombre || 'Chat de equipo';
    var otro = Object.keys(c.participantesInfo || {}).find(function(uid){ return uid !== currentUser.uid; });
    return otro && c.participantesInfo[otro] ? c.participantesInfo[otro].nombre : (c.nombre || 'Chat');
  }

  function subtituloDeChat(c){
    if(c.tipo === 'grupal'){
      var n = (c.participantes||[]).length;
      return n + ' integrante' + (n!==1?'s':'');
    }
    var otro = Object.keys(c.participantesInfo || {}).find(function(uid){ return uid !== currentUser.uid; });
    return otro && c.participantesInfo[otro] ? (c.participantesInfo[otro].rol==='supervisor'?'Supervisor':'Agente') : '';
  }

  var GROUP_AVATARS = [
    { emoji:'👥', color:'#7C3AED' }, { emoji:'💼', color:'#1A3DAA' }, { emoji:'🚀', color:'#DC2626' },
    { emoji:'⭐', color:'#B45309' }, { emoji:'🔥', color:'#EA580C' }, { emoji:'🎯', color:'#0EA5E9' },
    { emoji:'🛡️', color:'#16A34A' }, { emoji:'💡', color:'#CA8A04' }, { emoji:'🌟', color:'#9333EA' },
    { emoji:'📣', color:'#0891B2' }
  ];

  function avatarDeChat(c){
    if(c.tipo !== 'grupal') return null;
    return { emoji: c.avatarEmoji || '👥', color: c.avatarColor || '#7C3AED' };
  }

  function esNoLeido(c){
    if(!c.ultimoMensaje) return false;
    if(c.ultimoMensaje.autorUid === currentUser.uid) return false;
    var leido = c.leidoHasta && c.leidoHasta[currentUser.uid];
    if(!leido) return true;
    var uMs = c.ultimoMensaje.fecha ? c.ultimoMensaje.fecha.toMillis() : 0;
    var lMs = leido.toMillis ? leido.toMillis() : 0;
    return uMs > lMs;
  }

  function renderConvList(){
    var el = document.getElementById('convList');
    if(chats.length === 0){
      el.innerHTML = '<div class="conv-empty">' + (soloLectura ? 'Aún no hay conversaciones en el sistema.' : 'Sin conversaciones todavía.') + '</div>';
      document.getElementById('topbarSub').textContent = 'Sin conversaciones';
      return;
    }
    document.getElementById('topbarSub').textContent = chats.length + ' ' + (chats.length!==1 ? 'conversaciones' : 'conversación');
    var grupales = chats.filter(function(c){ return c.tipo === 'grupal'; });
    var directos  = chats.filter(function(c){ return c.tipo !== 'grupal'; });

    function itemHtml(c){
      var nombre = nombreDeChat(c);
      var av = avatarDeChat(c);
      var preview = c.ultimoMensaje ? (c.ultimoMensaje.autorUid===currentUser.uid?'Tú: ':'') + c.ultimoMensaje.texto : 'Sin mensajes aún';
      var noLeido = !soloLectura && esNoLeido(c);
      return '<div class="conv-item'+(c.id===chatActivoId?' active':'')+(noLeido?' unread':'')+'" onclick="abrirChat(\''+c.id+'\')">'
        + '<div class="conv-avatar'+(av?' grupal':'')+'"'+(av?' style="background:'+av.color+'"':'')+'>'+(av?av.emoji:escHtml(iniciales(nombre)))+'</div>'
        + '<div class="conv-info"><div class="conv-nombre">'+escHtml(nombre)+(soloLectura&&c.tipo!=='grupal'?'':'')+'</div><div class="conv-preview">'+escHtml(preview)+'</div></div>'
        + (noLeido?'<div class="conv-dot"></div>':'')
        + '</div>';
    }

    var html = '';
    if(grupales.length){ html += '<div class="conv-group-label">Equipo</div>' + grupales.map(itemHtml).join(''); }
    if(directos.length){ html += '<div class="conv-group-label">Directos</div>' + directos.map(itemHtml).join(''); }
    el.innerHTML = html;
  }

  // ── Abrir un chat ────────────────────────────────────────────────────────────
  window.abrirChat = function(id){
    chatActivoId = id;
    renderConvList();
    var c = chats.find(function(x){ return x.id === id; });
    if(!c) return;

    if(!soloLectura){
      var patch = {}; patch['leidoHasta.' + currentUser.uid] = firebase.firestore.FieldValue.serverTimestamp();
      db.collection('chats').doc(id).update(patch)
        .then(function(){ if (typeof invalidarCacheBadge === 'function') invalidarCacheBadge('chat', currentUser.uid); })
        .catch(function(){});
    }

    var nombre = nombreDeChat(c);
    var sub = subtituloDeChat(c);
    var av = avatarDeChat(c);
    var puedeEditarGrupo = !soloLectura && c.tipo === 'grupal' && c.supervisorUid === currentUser.uid;
    document.getElementById('threadCol').innerHTML =
        '<div class="thread-head">'
      + '<div class="thread-head-avatar'+(av?' grupal':'')+'"'+(av?' style="background:'+av.color+'"':'')+'>'+(av?av.emoji:escHtml(iniciales(nombre)))+'</div>'
      + '<div style="flex:1;min-width:0"><div class="thread-head-nombre">'+escHtml(nombre)+'</div><div class="thread-head-sub">'+escHtml(sub)+'</div></div>'
      + (puedeEditarGrupo ? '<button class="btn-icon" onclick="abrirModalEditarGrupo(\''+c.id+'\')" title="Editar grupo"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>' : '')
      + '<button class="btn-icon" onclick="cerrarChatActivo()" title="Cerrar conversación"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
      + '</div>'
      + '<div class="thread-body" id="threadBody"><div class="loading">Cargando mensajes...</div></div>'
      + (soloLectura
          ? '<div class="readonly-banner">Estás viendo esta conversación en modo solo lectura.</div>'
          : '<div class="thread-foot">'
            + '<div class="img-preview-bar" id="imgPreviewBar"><div class="wrap"><img id="imgPreviewImg" src="" alt="imagen a enviar"><button type="button" class="del" onclick="quitarImagenPendienteChat()" title="Quitar">&times;</button></div></div>'
            + '<div class="emoji-panel" id="emojiPanel">' + EMOJIS.map(function(e){ return '<button type="button" onclick="insertarEmoji(\''+e+'\')">'+e+'</button>'; }).join('') + '</div>'
            + '<button type="button" class="btn-emoji" id="btnEmoji" onclick="toggleEmojiPanel()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></button>'
            + '<input type="file" id="mImagenInputChat" accept="image/*" style="display:none" onchange="manejarSeleccionImagenChat(this)">'
            + '<button type="button" class="btn-img" id="btnImgChat" onclick="document.getElementById(\'mImagenInputChat\').click()" title="Adjuntar imagen"><svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>'
            + '<input type="text" id="mInput" placeholder="Escribe un mensaje..." onkeydown="if(event.key===\'Enter\')enviarMensaje()">'
            + '<button class="btn-enviar" onclick="enviarMensaje()"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>');

    if(unsubMensajes) unsubMensajes();
    unsubMensajes = db.collection('chats').doc(id).collection('mensajes').orderBy('fecha')
      .onSnapshot(function(snap){
        var msgs = []; snap.forEach(function(d){ msgs.push(Object.assign({id:d.id}, d.data())); });
        mensajesActuales = msgs;
        renderMensajes(msgs, c.tipo === 'grupal');
      }, function(e){ console.error('mensajes:', e); });
  };

  function mostrarVacio(){
    document.getElementById('threadCol').innerHTML = '<div class="empty-state" id="threadEmpty"><svg width="44" height="44" fill="none" stroke="#CBD5E1" stroke-width="1.6" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><div>Selecciona una conversación</div></div>';
  }

  window.cerrarChatActivo = function(){
    if(unsubMensajes){ unsubMensajes(); unsubMensajes = null; }
    chatActivoId = null;
    mensajesActuales = [];
    mostrarVacio();
    renderConvList();
  };

  var QUICK_REACTS = ['👍','❤️','😂','😮','😢','🙏'];

  function reactsBarHtml(msgId){
    if(soloLectura) return '';
    return '<div class="msg-reacts-bar">' + QUICK_REACTS.map(function(e){
      return '<button type="button" onclick="reaccionar(\''+msgId+'\',\''+e+'\')">'+e+'</button>';
    }).join('') + '</div>';
  }

  function reactionPillsHtml(msgId, reacciones){
    if(!reacciones) return '';
    var counts = {};
    Object.keys(reacciones).forEach(function(uid){
      var e = reacciones[uid]; if(!e) return;
      if(!counts[e]) counts[e] = [];
      counts[e].push(uid);
    });
    var emojis = Object.keys(counts);
    if(!emojis.length) return '';
    return '<div class="msg-reactions">' + emojis.map(function(e){
      var mine = counts[e].indexOf(currentUser.uid) >= 0;
      return '<span class="react-pill'+(mine?' mine':'')+'"'+(soloLectura?'':' onclick="reaccionar(\''+msgId+'\',\''+e+'\')"')+'>'+e+' '+counts[e].length+'</span>';
    }).join('') + '</div>';
  }

  function renderMensajes(msgs, mostrarAutor){
    var body = document.getElementById('threadBody');
    if(!body) return;
    if(msgs.length === 0){
      body.innerHTML = '<div class="loading">Aún no hay mensajes. ¡Escribe el primero!</div>';
      return;
    }
    body.innerHTML = msgs.map(function(m){
      var mio = m.autorUid === currentUser.uid;
      var hora = m.fecha ? m.fecha.toDate().toLocaleString('es-SV', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
      return '<div class="msg-row'+(mio?' mio':'')+'"><div class="msg-wrap">'
        + reactsBarHtml(m.id)
        + '<div class="msg-bubble">'
        + (mostrarAutor && !mio ? '<div class="msg-autor">'+escHtml(m.autorNombre)+'</div>' : '')
        + (m.imagen ? '<img class="msg-img" src="'+m.imagen+'" alt="Imagen adjunta" onclick="abrirLightboxChat(this.src)">' : '')
        + (m.texto ? escHtml(m.texto) : '')
        + '<div class="msg-hora">'+hora+'</div>'
        + '</div>'
        + reactionPillsHtml(m.id, m.reacciones)
        + '</div></div>';
    }).join('');
    body.scrollTop = body.scrollHeight;
  }

  // ── Imagen adjunta en el mensaje (se comprime y se guarda como data URL) ────
  var MAX_LADO_IMG_CHAT = 900;   // px, lado mayor
  var CALIDAD_IMG_CHAT  = 0.65;  // jpeg
  var _imagenPendienteChat = null;

  window.manejarSeleccionImagenChat = function(input){
    var file = input.files && input.files[0];
    input.value = '';
    if(!file) return;
    if(!/^image\//.test(file.type)){ showToast('Solo se permiten archivos de imagen.'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > MAX_LADO_IMG_CHAT || h > MAX_LADO_IMG_CHAT){
          var ratio = Math.min(MAX_LADO_IMG_CHAT/w, MAX_LADO_IMG_CHAT/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        _imagenPendienteChat = canvas.toDataURL('image/jpeg', CALIDAD_IMG_CHAT);
        var bar = document.getElementById('imgPreviewBar');
        if(bar){ document.getElementById('imgPreviewImg').src = _imagenPendienteChat; bar.classList.add('show'); }
      };
      img.onerror = function(){ showToast('No se pudo leer la imagen.'); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  window.quitarImagenPendienteChat = function(){
    _imagenPendienteChat = null;
    var bar = document.getElementById('imgPreviewBar');
    if(bar) bar.classList.remove('show');
  };

  window.abrirLightboxChat = function(src){
    document.getElementById('lightboxChatImg').src = src;
    document.getElementById('lightboxChat').classList.add('show');
  };
  window.cerrarLightboxChat = function(){
    document.getElementById('lightboxChat').classList.remove('show');
    document.getElementById('lightboxChatImg').src = '';
  };

  window.reaccionar = function(msgId, emoji){
    if(soloLectura || !chatActivoId) return;
    var msg = mensajesActuales.find(function(m){ return m.id === msgId; });
    var actual = msg && msg.reacciones ? msg.reacciones[currentUser.uid] : null;
    var patch = {};
    patch['reacciones.' + currentUser.uid] = (actual === emoji) ? firebase.firestore.FieldValue.delete() : emoji;
    db.collection('chats').doc(chatActivoId).collection('mensajes').doc(msgId).update(patch)
      .catch(function(e){ console.error(e); showToast('No se pudo reaccionar.'); });
  };

  window.enviarMensaje = function(){
    if(soloLectura || !chatActivoId) return;
    var input = document.getElementById('mInput');
    var texto = (input.value || '').trim();
    var imagen = _imagenPendienteChat;
    if(!texto && !imagen) return;
    input.value = '';
    quitarImagenPendienteChat();
    var data = { autorUid: currentUser.uid, autorNombre: miNombreG, fecha: firebase.firestore.FieldValue.serverTimestamp() };
    if(texto) data.texto = texto;
    if(imagen) data.imagen = imagen;
    var chatRef = db.collection('chats').doc(chatActivoId);
    chatRef.collection('mensajes').add(data).then(function(){
      var patch = {
        ultimoMensaje: { texto: texto || '📷 Imagen', autorUid: currentUser.uid, autorNombre: miNombreG, fecha: firebase.firestore.FieldValue.serverTimestamp() }
      };
      patch['leidoHasta.' + currentUser.uid] = firebase.firestore.FieldValue.serverTimestamp();
      return chatRef.update(patch);
    }).catch(function(e){ console.error(e); showToast('No se pudo enviar el mensaje.'); });
  };

  // ── Nuevo chat 1 a 1 (supervisor → sus agentes; jefe → supervisores y agentes de su proyecto) ──
  var LABEL_ROL_CONTACTO = { supervisor: 'Supervisor', agente: 'Agente', 'agente-inmersion': 'Agente Inmersion' };

  function cargarContactosJefe(cb){
    db.collection('usuarios')
      .where('rol', 'in', ['agente', 'agente-inmersion', 'supervisor'])
      .where('proyecto', '==', miProyectoG)
      .where('activo', '==', true)
      .get().then(function(snap){
        contactosJefe = [];
        snap.forEach(function(d){
          var x = d.data();
          contactosJefe.push({ uid: d.id, nombre: x.nombre || x.email, rol: x.rol });
        });
        contactosJefe.sort(function(a,b){
          if(a.rol !== b.rol) return a.rol === 'supervisor' ? -1 : 1;
          return (a.nombre||'').localeCompare(b.nombre||'','es');
        });
        if(cb) cb();
      }).catch(function(e){ console.error('contactos jefe:', e); if(cb) cb(); });
  }

  var modoNuevoChat = 'directo';
  var miembrosGrupoNuevo = {};

  window.abrirModalNuevoChat = function(){
    modoNuevoChat = 'directo';
    miembrosGrupoNuevo = {};
    var fuente = miRolG === 'jefe' ? cargarContactosJefe : cargarAgentesDeEquipo;
    fuente(function(){
      document.getElementById('ncTabs').style.display = miRolG === 'jefe' ? 'flex' : 'none';
      renderModoNuevoChat();
      document.getElementById('modalNuevoChat').classList.add('show');
    });
  };

  window.cambiarModoNuevoChat = function(modo){
    modoNuevoChat = modo;
    document.querySelectorAll('.nc-tab').forEach(function(b, i){ b.classList.toggle('active', (i===0)===(modo==='directo')); });
    renderModoNuevoChat();
  };

  function listaContactosActual(){
    return miRolG === 'jefe' ? contactosJefe : agentesDeEquipo;
  }

  function renderModoNuevoChat(){
    var lista = listaContactosActual();
    var el = document.getElementById('listaAgentesModal');
    document.getElementById('modalNuevoChatTitulo').textContent = modoNuevoChat === 'grupo' ? 'Crear grupo' : 'Iniciar chat con un colaborador';

    if(lista.length === 0){
      el.innerHTML = '<div class="loading">'+(miRolG==='jefe'?'No hay supervisores o agentes en tu proyecto.':'No tienes agentes asignados.')+'</div>';
      return;
    }
    var supervisores = lista.filter(function(a){ return a.rol === 'supervisor'; });
    var agentes = lista.filter(function(a){ return a.rol !== 'supervisor'; });

    if(modoNuevoChat === 'grupo'){
      function checkHtml(a){
        var marcado = !!miembrosGrupoNuevo[a.uid];
        return '<label class="grupo-pick"><input type="checkbox" '+(marcado?'checked':'')+' onchange="toggleMiembroGrupo(\''+a.uid+'\')">'
          + '<div class="conv-avatar">'+escHtml(iniciales(a.nombre))+'</div>'
          + '<div><div>'+escHtml(a.nombre)+'</div><div class="conv-preview">'+(LABEL_ROL_CONTACTO[a.rol]||a.rol)+'</div></div></label>';
      }
      var html = '<div class="grupo-nombre-field"><input type="text" id="ngNombre" placeholder="Nombre del grupo"></div>';
      if(supervisores.length) html += '<div class="conv-group-label">Supervisores</div>' + supervisores.map(checkHtml).join('');
      if(agentes.length)      html += '<div class="conv-group-label">Agentes</div>' + agentes.map(checkHtml).join('');
      html += '<button type="button" class="btn-crear-grupo" onclick="crearGrupoNuevo()">Crear grupo</button>';
      el.innerHTML = html;
    } else {
      function pickHtml(a){
        return '<div class="agente-pick" onclick="iniciarChatDirecto(\''+a.uid+'\')">'
          + '<div class="conv-avatar">'+escHtml(iniciales(a.nombre))+'</div>'
          + '<div><div>'+escHtml(a.nombre)+'</div><div class="conv-preview">'+(LABEL_ROL_CONTACTO[a.rol]||a.rol)+'</div></div></div>';
      }
      var html2 = '';
      if(miRolG === 'jefe' && supervisores.length) html2 += '<div class="conv-group-label">Supervisores</div>' + supervisores.map(pickHtml).join('');
      if(miRolG === 'jefe' && agentes.length)      html2 += '<div class="conv-group-label">Agentes</div>' + agentes.map(pickHtml).join('');
      if(miRolG !== 'jefe') html2 = lista.map(pickHtml).join('');
      el.innerHTML = html2;
    }
  }

  window.toggleMiembroGrupo = function(uid){
    if(miembrosGrupoNuevo[uid]) delete miembrosGrupoNuevo[uid]; else miembrosGrupoNuevo[uid] = true;
  };

  window.crearGrupoNuevo = function(){
    var nombre = (document.getElementById('ngNombre').value || '').trim();
    var miembros = Object.keys(miembrosGrupoNuevo);
    if(!nombre){ showToast('Escribe un nombre para el grupo.'); return; }
    if(miembros.length === 0){ showToast('Selecciona al menos un integrante.'); return; }

    var lista = listaContactosActual();
    var participantesInfo = {};
    participantesInfo[currentUser.uid] = { nombre: miNombreG, rol: miRolG };
    miembros.forEach(function(uid){
      var c = lista.find(function(x){ return x.uid === uid; });
      if(c) participantesInfo[uid] = { nombre: c.nombre, rol: c.rol };
    });

    db.collection('chats').add({
      tipo: 'grupal', nombre: nombre,
      supervisorUid: currentUser.uid, supervisorNombre: miNombreG,
      participantes: [currentUser.uid].concat(miembros), participantesInfo: participantesInfo,
      creadoEn: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(ref){
      return ref.get().then(function(doc){
        if(!chats.some(function(x){ return x.id === ref.id; })){
          chats.push(Object.assign({ id: ref.id }, doc.data()));
        }
        cerrarModalNuevoChat();
        abrirChat(ref.id);
      });
    }).catch(function(e){ console.error(e); showToast('No se pudo crear el grupo.'); });
  };

  function cerrarModalNuevoChat(){ document.getElementById('modalNuevoChat').classList.remove('show'); }

  // ── Editar grupo (nombre + ícono) ────────────────────────────────────────────
  var grupoEditandoId = null, avatarSeleccionado = null;

  window.abrirModalEditarGrupo = function(chatId){
    var c = chats.find(function(x){ return x.id === chatId; });
    if(!c) return;
    grupoEditandoId = chatId;
    avatarSeleccionado = { emoji: c.avatarEmoji || '👥', color: c.avatarColor || '#7C3AED' };
    document.getElementById('egNombre').value = c.nombre || '';
    renderAvatarPicker();
    document.getElementById('modalEditarGrupo').classList.add('show');
  };

  function renderAvatarPicker(){
    document.getElementById('egAvatares').innerHTML = GROUP_AVATARS.map(function(a, i){
      var sel = avatarSeleccionado && avatarSeleccionado.emoji === a.emoji && avatarSeleccionado.color === a.color;
      return '<button type="button" class="avatar-pick'+(sel?' sel':'')+'" style="background:'+a.color+'" onclick="seleccionarAvatar('+i+')">'+a.emoji+'</button>';
    }).join('');
  }

  window.seleccionarAvatar = function(i){
    avatarSeleccionado = GROUP_AVATARS[i];
    renderAvatarPicker();
  };

  function cerrarModalEditarGrupo(){ document.getElementById('modalEditarGrupo').classList.remove('show'); grupoEditandoId = null; }

  window.guardarGrupo = function(){
    if(!grupoEditandoId) return;
    var nombre = (document.getElementById('egNombre').value || '').trim();
    if(!nombre){ showToast('Escribe un nombre para el grupo.'); return; }
    db.collection('chats').doc(grupoEditandoId).update({
      nombre: nombre, avatarEmoji: avatarSeleccionado.emoji, avatarColor: avatarSeleccionado.color
    }).then(function(){
      showToast('Grupo actualizado.');
      cerrarModalEditarGrupo();
      if(chatActivoId === grupoEditandoId) abrirChat(grupoEditandoId);
    }).catch(function(e){ console.error(e); showToast('No se pudo actualizar el grupo.'); });
  };

  window.iniciarChatDirecto = function(otroUid){
    var lista = miRolG === 'jefe' ? contactosJefe : agentesDeEquipo;
    var otro = lista.find(function(a){ return a.uid === otroUid; });
    if(!otro) return;
    var id = 'directo_' + currentUser.uid + '_' + otroUid;
    var participantesInfo = {};
    participantesInfo[currentUser.uid] = { nombre: miNombreG, rol: miRolG };
    participantesInfo[otroUid] = { nombre: otro.nombre, rol: otro.rol };
    db.collection('chats').doc(id).get().then(function(doc){
      var data = {
        tipo: 'directo', iniciadoPorUid: currentUser.uid, iniciadoPorNombre: miNombreG,
        participantes: [currentUser.uid, otroUid], participantesInfo: participantesInfo
      };
      if(!doc.exists) data.creadoEn = firebase.firestore.FieldValue.serverTimestamp();
      return db.collection('chats').doc(id).set(data, { merge: true });
    }).then(function(){
      cerrarModalNuevoChat();
      abrirChat(id);
    }).catch(function(e){ console.error(e); showToast('No se pudo iniciar el chat.'); });
  };

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3500);
  }
</script>
