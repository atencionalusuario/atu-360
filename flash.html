<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mobile-guard.js"></script>
<link rel="stylesheet" href="sidebar.css">
<base href="/atu-360/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — Flash Informativos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #F8FAFC; display: flex; min-height: 100vh; color: #1E293B; }
  .sidebar { width: 220px; flex-shrink: 0; background: #0F2070; display: flex; flex-direction: column; min-height: 100vh; }
  .sb-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sb-name { font-size: 1.25rem; font-weight: 800; color: white; }
  .sb-name span { color: #29ABE2; }
  .sb-tagline { font-size: 0.62rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 2px; margin-top: 3px; }
  .sb-nav { padding: 20px 12px; flex: 1; }
  .nav-section-label { font-size: 0.58rem; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; padding: 0 10px; margin: 16px 0 6px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; font-size: 0.8rem; color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.15s; margin-bottom: 1px; position: relative; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .nav-item.active { background: rgba(41,171,226,0.15); color: white; font-weight: 600; border-left: 2px solid #29ABE2; }
  .nav-badge { background: #EF4444; color: white; font-size: 0.58rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; margin-left: auto; }
  .sb-bottom { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
  .sb-user { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: #1A3DAA; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: white; font-weight: 700; flex-shrink: 0; border: 1.5px solid rgba(41,171,226,0.4); }
  .sb-user-name { font-size: 0.76rem; font-weight: 600; color: white; }
  .sb-user-role { font-size: 0.62rem; color: rgba(255,255,255,0.4); margin-top: 1px; }
  .btn-logout { width: 100%; padding: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .btn-logout:hover { background: rgba(255,255,255,0.1); color: white; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: auto; }
  .topbar { background: white; padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 10; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-left h2 { font-size: 0.9rem; font-weight: 600; color: #1E293B; }
  .topbar-sep { color: #CBD5E1; }
  .topbar-left p { font-size: 0.78rem; color: #94A3B8; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .tb-clock { font-size: 1rem; font-weight: 700; color: #1A3DAA; font-variant-numeric: tabular-nums; }
  .content { padding: 28px 40px; max-width: 1080px; margin: 0 auto; width: 100%; }
  .post-cat { display: inline-block; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 2px 8px; border-radius: 3px; }
  .post-cat.actualizacion { background: #EEF2FF; color: #1A3DAA; }
  .post-cat.noticia       { background: #F0FDF4; color: #16A34A; }
  .post-cat.cambio        { background: #FFFBEB; color: #B45309; }
  .post-cat.urgente       { background: #FEF2F2; color: #DC2626; }
  .blog-entry { background: white; border-radius: 12px; border: 1px solid #E2E8F0; margin-bottom: 24px; overflow: hidden; transition: border-color 0.15s; }
  .blog-entry.unread { border-left: 3px solid #1A3DAA; }
  .entry-header { padding: 24px 28px 0; display: flex; align-items: center; justify-content: space-between; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: #1A3DAA; }
  .entry-title { padding: 12px 28px 0; font-size: 1.2rem; font-weight: 800; color: #1E293B; line-height: 1.4; }
  .entry-date { padding: 8px 28px 0; font-size: 0.8rem; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 6px; }
  .entry-date svg { flex-shrink: 0; }
  .entry-body { padding: 20px 28px; font-size: 0.88rem; color: #374151; line-height: 1.85; white-space: pre-wrap; border-bottom: 1px solid #F1F5F9; }
  .entry-footer { padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; }
  .leido-status { font-size: 0.75rem; color: #94A3B8; display: flex; align-items: center; gap: 6px; }
  .leido-status.done { color: #16A34A; font-weight: 600; }
  .leido-check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #CBD5E1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .leido-check.done { background: #16A34A; border-color: #16A34A; }
  .btn-marcar { padding: 9px 18px; background: #1A3DAA; color: white; border: none; border-radius: 7px; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; display: flex; align-items: center; gap: 7px; }
  .btn-marcar:hover { opacity: 0.88; }
  .btn-marcar.done { background: #F0FDF4; color: #16A34A; cursor: default; border: 1px solid #BBF7D0; }
  .btn-marcar.done:hover { opacity: 1; }
  .loading { text-align: center; padding: 32px; font-size: 0.8rem; color: #94A3B8; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #E2E8F0; border-top-color: #1A3DAA; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-nuevo { display: none; align-items: center; gap: 6px; padding: 8px 16px; background: #1A3DAA; color: white; border: none; border-radius: 7px; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-nuevo:hover { opacity: 0.88; }
  .btn-nuevo.visible { display: flex; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; border-radius: 14px; width: 100%; max-width: 560px; box-shadow: 0 24px 60px rgba(0,0,0,0.18); overflow: hidden; }
  .modal-head { padding: 22px 28px 18px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { font-size: 1rem; font-weight: 700; color: #1E293B; }
  .modal-close { background: none; border: none; cursor: pointer; color: #94A3B8; padding: 4px; display: flex; align-items: center; }
  .modal-close:hover { color: #1E293B; }
  .modal-body { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; }
  .modal-body label { font-size: 0.75rem; font-weight: 600; color: #64748B; display: block; margin-bottom: 5px; }
  .modal-body input[type="text"], .modal-body select, .modal-body textarea { width: 100%; padding: 10px 13px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.85rem; font-family: inherit; color: #1E293B; background: #F8FAFC; outline: none; transition: border 0.2s; }
  .modal-body input[type="text"]:focus, .modal-body select:focus, .modal-body textarea:focus { border-color: #1A3DAA; background: white; }
  .modal-body textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .modal-foot { padding: 16px 28px; border-top: 1px solid #F1F5F9; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-cancel { padding: 9px 18px; background: #F1F5F9; color: #64748B; border: none; border-radius: 7px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-cancel:hover { background: #E2E8F0; }
  .btn-pub { padding: 9px 18px; background: #1A3DAA; color: white; border: none; border-radius: 7px; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .btn-pub:hover { opacity: 0.88; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: white; padding: 12px 18px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2>Flash Informativos</h2>
      <span class="topbar-sep">/</span>
      <p id="sinLeerLabel">Cargando...</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
      <button class="btn-nuevo" id="btnNuevo" onclick="abrirModal()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva publicación
      </button>
    </div>
  </div>

  <div class="content">
    <div id="borradoresBox"></div>
    <div id="postsList"><div class="loading"><div class="spinner"></div><br>Cargando publicaciones...</div></div>
  </div>
</div>

<!-- Modal nueva publicación -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Nueva publicación</h3>
      <button class="modal-close" onclick="cerrarModal()"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div>
        <label>Título *</label>
        <input type="text" id="mTitulo" placeholder="Escribe el título...">
      </div>
      <div>
        <label>Categoría *</label>
        <select id="mCat">
          <option value="actualizacion">Actualización</option>
          <option value="noticia">Noticia</option>
          <option value="cambio">Cambio</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>
      <div>
        <label>Contenido *</label>
        <div style="display:flex;gap:5px;margin-bottom:6px">
          <button type="button" onclick="fmtFlash('negrita')" title="Negrita" style="width:32px;height:30px;border:1px solid #E2E8F0;border-radius:6px;background:white;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:800;color:#374151">B</button>
          <button type="button" onclick="fmtFlash('cursiva')" title="Cursiva" style="width:32px;height:30px;border:1px solid #E2E8F0;border-radius:6px;background:white;cursor:pointer;font-family:inherit;font-size:0.85rem;font-style:italic;color:#374151">I</button>
          <button type="button" onclick="fmtFlash('tachado')" title="Tachado" style="width:32px;height:30px;border:1px solid #E2E8F0;border-radius:6px;background:white;cursor:pointer;font-family:inherit;font-size:0.85rem;text-decoration:line-through;color:#374151">S</button>
        </div>
        <textarea id="mContenido" placeholder="Escribe el contenido..."></textarea>
        <div style="font-size:0.68rem;color:#94A3B8;margin-top:4px">Formato: <strong>**negrita**</strong>, <em>_cursiva_</em>, <s>~~tachado~~</s></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-cancel" id="btnBorrador" onclick="guardarBorrador()">Guardar borrador</button>
      <button class="btn-pub" id="btnPublicar" onclick="publicar()">Publicar ahora</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var auth = firebase.auth();
  var db   = firebase.firestore();

  var currentUser = null;
  var posts = [];
  var misLecturas = {};
  var lecturasPorPost = {};   // postId -> { uid: true } (todas las lecturas)
  var audiencia = [];         // usuarios activos que deben leer el flash
  var esGestor = false;       // jefe / formacion / superadmin (ven estadísticas)

  var CATS = { actualizacion:'Actualización', noticia:'Noticia', cambio:'Cambio', urgente:'Urgente' };

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var rolUsuario = null;

  // Auth
  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      rolUsuario = doc.exists ? doc.data().rol : null;
      esGestor = ['jefe','formacion','superadmin'].indexOf(rolUsuario) >= 0;
      if (esGestor) {
        document.getElementById('btnNuevo').classList.add('visible');
        cargarBorradores();
        cargarAudiencia();
        cargarLecturasTodas();
      }
    });
    cargarPosts();
    cargarMisLecturas();
  });

  var _editId = null;
  var borradores = [];

  function abrirModal(id) {
    _editId = (typeof id === 'string') ? id : null;
    var p = _editId ? borradores.find(function(x){ return x.id === _editId; }) : null;
    document.getElementById('mTitulo').value    = p ? (p.titulo || '') : '';
    document.getElementById('mCat').value       = p ? (p.categoria || 'actualizacion') : 'actualizacion';
    document.getElementById('mContenido').value = p ? (p.contenido || '') : '';
    document.querySelector('#modalOverlay h3').textContent = _editId ? 'Editar borrador' : 'Nueva publicación';
    document.getElementById('modalOverlay').classList.add('show');
    document.getElementById('mTitulo').focus();
  }

  function cerrarModal() {
    document.getElementById('modalOverlay').classList.remove('show');
    _editId = null;
  }

  // Inserta marcadores de formato alrededor de la selección del textarea
  function fmtFlash(tipo) {
    var ta = document.getElementById('mContenido');
    var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel = v.substring(s, e);
    var w  = tipo === 'negrita' ? '**' : tipo === 'cursiva' ? '_' : '~~';
    var ph = tipo === 'negrita' ? 'negrita' : tipo === 'cursiva' ? 'cursiva' : 'tachado';
    var ins = w + (sel || ph) + w;
    ta.value = v.substring(0, s) + ins + v.substring(e);
    ta.focus();
    var pos = s + ins.length;
    ta.setSelectionRange(pos, pos);
  }

  function guardarBorrador() {
    var titulo    = document.getElementById('mTitulo').value.trim();
    var cat       = document.getElementById('mCat').value;
    var contenido = document.getElementById('mContenido').value.trim();
    if (!titulo && !contenido) { showToast('Escribe al menos un título o contenido.'); return; }
    var btn = document.getElementById('btnBorrador');
    btn.disabled = true; btn.textContent = 'Guardando...';
    var data = {
      titulo: titulo, categoria: cat, contenido: contenido, estado: 'borrador',
      autorUid: currentUser.uid, autorNombre: currentUser.email.split('@')[0],
      fechaActualizacion: firebase.firestore.FieldValue.serverTimestamp()
    };
    var op;
    if (_editId) { op = db.collection('flash_posts').doc(_editId).update(data); }
    else { data.fechaCreacion = firebase.firestore.FieldValue.serverTimestamp(); op = db.collection('flash_posts').add(data); }
    op.then(function() { cerrarModal(); showToast('Borrador guardado.'); })
      .catch(function(e) { console.error(e); showToast('Error al guardar el borrador.'); })
      .finally(function() { btn.disabled = false; btn.textContent = 'Guardar borrador'; });
  }

  function publicar() {
    var titulo    = document.getElementById('mTitulo').value.trim();
    var cat       = document.getElementById('mCat').value;
    var contenido = document.getElementById('mContenido').value.trim();
    if (!titulo || !contenido) { showToast('Completa el título y el contenido.'); return; }
    var btn = document.getElementById('btnPublicar');
    btn.disabled = true; btn.textContent = 'Publicando...';
    var data = {
      titulo: titulo, categoria: cat, contenido: contenido, estado: 'publicado',
      autorUid: currentUser.uid, autorNombre: currentUser.email.split('@')[0],
      fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
      fechaActualizacion: firebase.firestore.FieldValue.serverTimestamp()
    };
    var op = _editId ? db.collection('flash_posts').doc(_editId).update(data)
                     : db.collection('flash_posts').add(data);
    op.then(function() { cerrarModal(); showToast('Publicado correctamente.'); })
      .catch(function(e) { showToast('Error al publicar.'); console.error(e); })
      .finally(function() { btn.disabled = false; btn.textContent = 'Publicar ahora'; });
  }

  // ── Borradores (jefe/superadmin) ────────────────────────────────────────────
  function cargarBorradores() {
    db.collection('flash_posts')
      .where('estado', '==', 'borrador')
      .onSnapshot(function(snap) {
        borradores = [];
        snap.forEach(function(doc) {
          var d = doc.data();
          if (d.autorUid === currentUser.uid) borradores.push(Object.assign({ id: doc.id }, d));
        });
        borradores.sort(function(a,b){ return (b.fechaActualizacion?b.fechaActualizacion.seconds:0)-(a.fechaActualizacion?a.fechaActualizacion.seconds:0); });
        renderBorradores();
      }, function(e){ console.warn('borradores:', e.message); });
  }

  function renderBorradores() {
    var box = document.getElementById('borradoresBox');
    if (!box) return;
    if (!borradores.length) { box.innerHTML = ''; return; }
    var bstyle = 'padding:5px 12px;border-radius:6px;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid';
    var html = '<div style="margin-bottom:28px"><div style="font-size:0.72rem;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Borradores</div>';
    borradores.forEach(function(p) {
      html += '<div class="blog-entry" style="border-left:3px solid #F59E0B;margin-bottom:12px">'
        + '<div style="padding:14px 20px;display:flex;align-items:center;gap:12px">'
        + '<span class="post-cat '+(p.categoria||'')+'">'+escHtml(CATS[p.categoria]||p.categoria||'General')+'</span>'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-weight:700;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(p.titulo||'(Sin título)')+'</div>'
        + '<div style="font-size:0.72rem;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml((p.contenido||'').substring(0,90))+'</div>'
        + '</div>'
        + '<button onclick="abrirModal(\''+p.id+'\')" style="'+bstyle+' #C7D2FE;background:white;color:#1A3DAA">Editar</button>'
        + '<button onclick="publicarBorrador(\''+p.id+'\')" style="'+bstyle+' transparent;background:#1A3DAA;color:white">Publicar</button>'
        + '<button onclick="eliminarBorrador(\''+p.id+'\')" style="'+bstyle+' #FECACA;background:#FEF2F2;color:#DC2626">Eliminar</button>'
        + '</div></div>';
    });
    html += '</div>';
    box.innerHTML = html;
  }

  function publicarBorrador(id) {
    if (!confirm('¿Publicar este borrador ahora?')) return;
    db.collection('flash_posts').doc(id).update({
      estado: 'publicado',
      fechaCreacion: firebase.firestore.FieldValue.serverTimestamp(),
      fechaActualizacion: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){ showToast('Publicado correctamente.'); })
      .catch(function(e){ console.error(e); showToast('No se pudo publicar.'); });
  }

  function eliminarBorrador(id) {
    if (!confirm('¿Eliminar este borrador? Esta acción no se puede deshacer.')) return;
    db.collection('flash_posts').doc(id).delete()
      .then(function(){ showToast('Borrador eliminado.'); })
      .catch(function(e){ console.error(e); showToast('No se pudo eliminar.'); });
  }

  window.eliminarPublicado = function(id) {
    if (!confirm('¿Eliminar esta publicación? Ya no será visible para nadie y esta acción no se puede deshacer.')) return;
    db.collection('flash_lecturas').where('postId', '==', id).get().then(function(snap) {
      var batch = db.batch();
      snap.forEach(function(d){ batch.delete(d.ref); });
      batch.delete(db.collection('flash_posts').doc(id));
      return batch.commit();
    }).then(function(){ showToast('Publicación eliminada.'); })
      .catch(function(e){ console.error(e); showToast('No se pudo eliminar.'); });
  };

  // Formato seguro: escapa todo y luego convierte SOLO los marcadores controlados
  function formatFlash(s) {
    var t = escHtml(s);
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
    t = t.replace(/_([^_\n]+)_/g, '<em>$1</em>');
    return t;
  }

  // ── Estadísticas de lectura (jefe / formación) ──────────────────────────────
  function statsBar(p) {
    if (!esGestor) return '';
    var readers = lecturasPorPost[p.id] || {};
    var total  = audiencia.length;
    var leidos = audiencia.filter(function(u){ return readers[u.id]; }).length;
    var faltan = total - leidos;
    return '<div style="padding:10px 28px;background:#F8FAFC;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between;gap:12px">'
      + '<span style="font-size:0.78rem;color:#475569;font-weight:600">&#x1F4CA; <strong style="color:#1A3DAA">'+leidos+'</strong> de '+total+' han leído</span>'
      + '<button onclick="verNoLeidos(\''+p.id+'\')" style="padding:5px 12px;border:1px solid #C7D2FE;border-radius:6px;background:white;color:#1A3DAA;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit">Ver no leídos ('+faltan+')</button>'
      + '</div>';
  }

  function cargarAudiencia() {
    var consumidores = ['agente','agente-inmersion','supervisor','formacion'];
    db.collection('usuarios').get().then(function(snap) {
      audiencia = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        if (d.activo === false) return;
        if (consumidores.indexOf(d.rol) < 0) return;
        audiencia.push({ id: doc.id, nombre: d.nombre || d.email || '(sin nombre)', supervisor: d.supervisor || d.emailSupervisor || '—' });
      });
      renderPosts();
    }).catch(function(e){ console.warn('audiencia:', e.message); });
  }

  function cargarLecturasTodas() {
    db.collection('flash_lecturas').onSnapshot(function(snap) {
      lecturasPorPost = {};
      snap.forEach(function(doc) {
        var d = doc.data();
        if (!d.postId || !d.uid) return;
        if (!lecturasPorPost[d.postId]) lecturasPorPost[d.postId] = {};
        lecturasPorPost[d.postId][d.uid] = true;
      });
      renderPosts();
    }, function(e){ console.warn('lecturas:', e.message); });
  }

  var _nlLista = [];

  window.verNoLeidos = function(postId) {
    var readers = lecturasPorPost[postId] || {};
    var noLeidos = audiencia.filter(function(u){ return !readers[u.id]; });
    noLeidos.sort(function(a,b){
      var s = (a.supervisor||'').localeCompare(b.supervisor||'','es');
      return s !== 0 ? s : (a.nombre||'').localeCompare(b.nombre||'','es');
    });
    _nlLista = noLeidos;
    var post = posts.find(function(x){ return x.id === postId; });
    var m = document.getElementById('nlModal') || crearModalNoLeidos();
    document.getElementById('nlTitulo').textContent  = 'No han leído: ' + (post ? (post.titulo || '') : '');
    document.getElementById('nlResumen').textContent = noLeidos.length + ' de ' + audiencia.length + ' pendientes';
    var body = document.getElementById('nlBody');
    body.innerHTML = noLeidos.length
      ? noLeidos.map(function(u){
          return '<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid #F1F5F9;font-size:0.8rem">'
            + '<span style="color:#1E293B;font-weight:600">'+escHtml(u.nombre)+'</span>'
            + '<span style="color:#94A3B8">'+escHtml(u.supervisor)+'</span>'
            + '</div>';
        }).join('')
      : '<div style="padding:24px;text-align:center;color:#16A34A;font-size:0.85rem;font-weight:600">&#x2713; Todos han leído esta publicación.</div>';
    m.style.display = 'flex';
  };

  function crearModalNoLeidos() {
    var ov = document.createElement('div');
    ov.id = 'nlModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.4);z-index:9999;display:none;align-items:center;justify-content:center;';
    ov.innerHTML =
      '<div style="background:white;border-radius:12px;width:460px;max-width:92vw;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 48px rgba(0,0,0,0.18)">'
      +'<div style="padding:20px 24px 12px;border-bottom:1px solid #F1F5F9">'
      +'<div id="nlTitulo" style="font-size:0.95rem;font-weight:700;color:#1E293B"></div>'
      +'<div id="nlResumen" style="font-size:0.75rem;color:#94A3B8;margin-top:2px"></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:0.62rem;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px"><span>Persona</span><span>Supervisor</span></div>'
      +'</div>'
      +'<div id="nlBody" style="overflow-y:auto;padding:6px 24px;flex:1"></div>'
      +'<div style="padding:14px 24px;border-top:1px solid #F1F5F9;display:flex;justify-content:flex-end;gap:8px">'
      +'<button id="nlCopiar" style="padding:8px 14px;border:1px solid #E2E8F0;border-radius:7px;background:white;font-size:0.8rem;font-weight:600;color:#374151;cursor:pointer;font-family:inherit">Copiar lista</button>'
      +'<button id="nlCerrar" style="padding:8px 14px;border:none;border-radius:7px;background:#1A3DAA;color:white;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:inherit">Cerrar</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.style.display='none'; });
    document.getElementById('nlCerrar').addEventListener('click', function(){ ov.style.display='none'; });
    document.getElementById('nlCopiar').addEventListener('click', function(){
      if (!_nlLista.length) { showToast('No hay pendientes para copiar.'); return; }
      var txt = _nlLista.map(function(u){ return u.nombre + '\t' + u.supervisor; }).join('\n');
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ showToast('Lista copiada.'); }, function(){ showToast('No se pudo copiar.'); });
      else showToast('Copia no disponible en este navegador.');
    });
    return ov;
  }

  function showToast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }

  // Cargar lecturas previas (no bloquea los posts)
  function cargarMisLecturas() {
    db.collection('flash_lecturas')
      .where('uid', '==', currentUser.uid)
      .get()
      .then(function(snap) {
        snap.forEach(function(doc) { misLecturas[doc.data().postId] = true; });
        renderPosts(); // refrescar badges de leído/no leído
      })
      .catch(function(e) {
        console.warn('flash_lecturas:', e.message);
      });
  }

  // Cargar posts publicados en tiempo real
  function cargarPosts() {
    db.collection('flash_posts')
      .where('estado', '==', 'publicado')
      .onSnapshot(function(snap) {
        posts = [];
        snap.forEach(function(doc) {
          posts.push(Object.assign({ id: doc.id }, doc.data()));
        });
        posts.sort(function(a,b){ return (b.fechaCreacion?b.fechaCreacion.seconds:0)-(a.fechaCreacion?a.fechaCreacion.seconds:0); });
        renderPosts();
      }, function(e){
        console.error('flash_posts error:', e);
        var el = document.getElementById('postsList');
        if (el) el.innerHTML = '<div style="padding:32px;color:#DC2626;font-size:0.85rem;">Error Firestore: ' + e.code + ' — ' + e.message + '</div>';
      });
  }

  function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function renderPosts() {
    var sinLeer = posts.filter(function(p){ return !misLecturas[p.id]; }).length;
    document.getElementById('sinLeerLabel').textContent = sinLeer > 0 ? sinLeer + ' sin leer' : 'Todo al día';
    var badge = document.getElementById('flashBadge');
    if (badge) { badge.textContent = sinLeer; badge.style.display = sinLeer > 0 ? 'inline' : 'none'; }

    if (posts.length === 0) {
      document.getElementById('postsList').innerHTML = '<div class="loading">No hay publicaciones disponibles.</div>';
      return;
    }

    var html = '';
    posts.forEach(function(p) {
      var leido = !!misLecturas[p.id];
      var _d = p.fechaCreacion ? new Date(p.fechaCreacion.seconds*1000) : null;
      var fecha = _d ? _d.toLocaleDateString('es-SV', {day:'2-digit', month:'long', year:'numeric'}) + ' · ' + _d.toLocaleTimeString('es-SV', {hour:'2-digit', minute:'2-digit'}) : '';
      html += '<article class="blog-entry'+(leido?'':' unread')+'" id="entry-'+p.id+'">'
        +'<div class="entry-header">'
        +'<div style="display:flex;align-items:center;gap:8px">'
        +'<span class="post-cat '+(p.categoria||'')+'">'+escHtml(CATS[p.categoria]||p.categoria||'General')+'</span>'
        +(leido?'':'<div class="unread-dot"></div>')
        +'</div>'
        +(esGestor?'<button onclick="eliminarPublicado(\''+p.id+'\')" style="padding:5px 12px;border:1px solid #FECACA;border-radius:6px;background:#FEF2F2;color:#DC2626;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit">Eliminar</button>':'')
        +'</div>'
        +'<div class="entry-title">'+escHtml(p.titulo)+'</div>'
        +'<div class="entry-date"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'+fecha+'</div>'
        +'<div class="entry-body">'+formatFlash(p.contenido)+'</div>'
        + statsBar(p)
        +'<div class="entry-footer">'
        +'<div class="leido-status'+(leido?' done':'')+'">'
        +'<div class="leido-check'+(leido?' done':'')+'">'+
          (leido?'<svg width="10" height="10" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>':'')
        +'</div>'
        +(leido?'Leído':'Pendiente de lectura')
        +'</div>'
        +'<button class="btn-marcar'+(leido?' done':'')+'" '+(leido?'disabled':'')+' onclick="marcarLeido(\''+p.id+'\')">'
        +(leido
          ?'<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Ya leído'
          :'Marcar como leído')
        +'</button>'
        +'</div>'
        +'</article>';
    });
    document.getElementById('postsList').innerHTML = html;
  }

  function marcarLeido(id) {
    if (!currentUser || misLecturas[id]) return;
    db.collection('flash_lecturas').add({
      postId:    id,
      uid:       currentUser.uid,
      email:     currentUser.email,
      nombre:    currentUser.email.split('@')[0],
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      misLecturas[id] = true;
      renderPosts();
    }).catch(function(e){ console.error('Error guardando lectura:', e); });
  }
</script>
<script src="notif.js"></script>
<script src="sidebar.js"></script>
<script>
  initSidebar();
  initNotif(db, auth);
</script>
</body>
