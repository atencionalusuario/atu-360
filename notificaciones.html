<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — Notificaciones</title>
<base href="/atu-360/">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="base.css">
<style>
  .content-wrap { flex: 1; overflow-y: auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 20px; }

  /* CONTROLES */
  .controles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ctrl-select { padding: 8px 10px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; cursor: pointer; }
  .ctrl-select:focus { border-color: #1A3DAA; }
  .ctrl-sep { width: 1px; height: 28px; background: #E2E8F0; margin: 0 4px; }
  .btn-accion { padding: 8px 14px; border-radius: 7px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; border: 1.5px solid #E2E8F0; background: white; color: #374151; }
  .btn-accion:hover { border-color: #CBD5E1; }
  .btn-accion.primary { background: #1A3DAA; color: white; border-color: #1A3DAA; }
  .btn-accion.primary:hover { opacity: 0.88; }
  .btn-accion.ghost { border-color: transparent; color: #64748B; }
  .btn-accion.ghost:hover { background: #F1F5F9; border-color: transparent; }

  /* LISTA */
  .notif-list { display: flex; flex-direction: column; gap: 0; background: white; border: 1px solid #E2E8F0; border-radius: 12px; overflow: hidden; }
  .notif-item { padding: 16px 20px; border-bottom: 1px solid #F1F5F9; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; transition: background 0.12s; }
  .notif-item:last-child { border-bottom: none; }
  .notif-item:hover { background: #F8FAFC; }
  .notif-item.unread { background: #EFF6FF; }
  .notif-item.unread:hover { background: #DBEAFE; }

  .notif-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .notif-icon.admin     { background: #FEF3C7; color: #D97706; }
  .notif-icon.solicitud { background: #EFF6FF; color: #1A3DAA; }
  .notif-icon.aprobada  { background: #F0FDF4; color: #16A34A; }
  .notif-icon.rechazada { background: #FEF2F2; color: #DC2626; }

  .notif-body { flex: 1; min-width: 0; }
  .notif-titulo { font-size: 0.84rem; font-weight: 700; color: #1E293B; margin-bottom: 3px; }
  .notif-msg    { font-size: 0.78rem; color: #64748B; line-height: 1.5; }
  .notif-meta   { font-size: 0.68rem; color: #94A3B8; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .notif-meta span { display: flex; align-items: center; gap: 3px; }

  .notif-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
  .notif-item:hover .notif-actions { opacity: 1; }
  .notif-dot { width: 8px; height: 8px; border-radius: 50%; background: #1A3DAA; flex-shrink: 0; margin-top: 5px; }
  .btn-icon { width: 28px; height: 28px; border: 1px solid #E2E8F0; border-radius: 6px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748B; }
  .btn-icon:hover { background: #F1F5F9; }
  .btn-icon.danger:hover { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }

  .tag-dest { font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; }
  .tag-dest.todos   { background: #F0FDF4; color: #16A34A; }
  .tag-dest.rol     { background: #F5F3FF; color: #7C3AED; }
  .tag-dest.usuario { background: #EFF6FF; color: #1A3DAA; }

  .empty-state { text-align: center; padding: 60px 24px; color: #94A3B8; }
  .empty-state svg { margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 0.85rem; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,32,112,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(3px); }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal { background: white; border-radius: 12px; width: 540px; max-width: 96vw; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .modal-title  { font-size: 0.92rem; font-weight: 700; color: #1E293B; }
  .modal-sub    { font-size: 0.72rem; color: #94A3B8; margin-top: 2px; }
  .modal-body   { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .modal-footer { padding: 14px 24px; border-top: 1px solid #F1F5F9; display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
  .field        { display: flex; flex-direction: column; gap: 5px; }
  label         { font-size: 0.72rem; font-weight: 600; color: #374151; }
  .field-req    { color: #DC2626; }
  input[type="text"], textarea, select {
    padding: 9px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px;
    font-size: 0.82rem; color: #1E293B; background: #F8FAFC; outline: none;
    transition: border 0.2s; font-family: inherit; width: 100%;
  }
  input:focus, textarea:focus, select:focus { border-color: #1A3DAA; box-shadow: 0 0 0 3px rgba(26,61,170,0.07); background: white; }
  textarea { resize: vertical; min-height: 90px; }
  .btn-sec    { padding: 9px 18px; border: 1.5px solid #E2E8F0; border-radius: 7px; background: white; font-size: 0.78rem; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; }
  .btn-pri-sm { padding: 9px 18px; border: none; border-radius: 7px; background: #1A3DAA; color: white; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-pri-sm:hover { opacity: 0.88; }
  .btn-close  { width: 28px; height: 28px; border: none; background: #F1F5F9; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748B; flex-shrink: 0; }
  .btn-close:hover { background: #E2E8F0; }

  .dest-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .preview-dest { padding: 10px 14px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; color: #64748B; min-height: 38px; display: flex; align-items: center; }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <h2 style="font-size:0.9rem;font-weight:600">Notificaciones</h2>
      <span class="topbar-sep">/</span>
      <p class="tb-page-sub" id="totalLabel">—</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div class="content-wrap">
    <!-- CONTROLES -->
    <div class="controles">
      <select class="ctrl-select" id="filtroLeida" onchange="aplicarFiltros()">
        <option value="">Todas</option>
        <option value="no">No leídas</option>
        <option value="si">Leídas</option>
      </select>
      <select class="ctrl-select" id="filtroTipo" onchange="aplicarFiltros()">
        <option value="">Todos los tipos</option>
        <option value="admin">Admin</option>
        <option value="solicitud">Solicitud</option>
        <option value="aprobada">Aprobada</option>
        <option value="rechazada">Rechazada</option>
      </select>
      <div class="ctrl-sep"></div>
      <button class="btn-accion ghost" onclick="marcarTodasLeidas()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Marcar todas leídas
      </button>
      <div style="flex:1"></div>
      <button class="btn-accion primary" id="btnNueva" style="display:none" onclick="abrirModal()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva notificación
      </button>
    </div>

    <!-- LISTA -->
    <div class="notif-list" id="notifList">
      <div class="empty-state">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <p>Cargando notificaciones…</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal nueva notificación -->
<div class="modal-overlay" id="modalNueva">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Nueva notificación</div>
        <div class="modal-sub">Envía un mensaje a uno o varios usuarios</div>
      </div>
      <button class="btn-close" onclick="cerrarModal()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="dest-row">
        <div class="field">
          <label>Tipo de destinatario <span class="field-req">*</span></label>
          <select id="nTipoDest" onchange="actualizarDest()">
            <option value="">— Selecciona —</option>
            <option value="todos">Todos los usuarios</option>
            <option value="rol">Por rol</option>
            <option value="usuario">Usuario específico</option>
          </select>
        </div>
        <div class="field" id="destSecField" style="display:none">
          <label id="destSecLabel">Rol</label>
          <select id="nDestSec" onchange="actualizarDest()">
            <option value="">— Selecciona —</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Destinatario</label>
        <div class="preview-dest" id="destPreview">Selecciona tipo de destinatario</div>
      </div>
      <div class="field">
        <label>Tipo de notificación</label>
        <select id="nTipo">
          <option value="admin">Admin / Aviso</option>
          <option value="solicitud">Solicitud</option>
          <option value="aprobada">Aprobada</option>
          <option value="rechazada">Rechazada</option>
        </select>
      </div>
      <div class="field">
        <label>Título <span class="field-req">*</span></label>
        <input type="text" id="nTitulo" placeholder="Ej: Actualización de horarios">
      </div>
      <div class="field">
        <label>Mensaje <span class="field-req">*</span></label>
        <textarea id="nMensaje" placeholder="Escribe el mensaje aquí…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-sec" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-pri-sm" id="btnEnviar" onclick="enviarNotificacion()">Enviar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  var BASE = 'https://atencionalusuario.github.io/atu-360/';

  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var db   = firebase.firestore();
  var auth = firebase.auth();

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var ROLES_ADMIN = ['jefe','admin','superadmin','wfm'];
  var LABELS_ROL  = { agente:'Agente', 'agente-inmersion':'Agente Inmersión', supervisor:'Supervisor', formacion:'Formación', admin:'Admin', wfm:'WFM', jefe:'Jefe', superadmin:'Superadmin' };

  var currentUser   = null;
  var currentPerfil = null;
  var notifs        = [];
  var usuarios      = [];
  var unsubNotif    = null;

  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = BASE + 'login.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      if (!doc.exists) { window.location.href = BASE + 'home.html'; return; }
      currentUser   = user;
      currentPerfil = doc.data();
      if (ROLES_ADMIN.includes(currentPerfil.rol)) {
        document.getElementById('btnNueva').style.display = 'flex';
        cargarUsuariosLista();
      }
      suscribirNotificaciones();
    });
  });

  // ── Cargar usuarios para el selector ─────────────────────────────────────────
  function cargarUsuariosLista() {
    db.collection('usuarios').orderBy('nombre','asc').get().then(function(snap) {
      usuarios = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        if (d.rol !== 'superadmin') usuarios.push(Object.assign({ id: doc.id }, d));
      });
    });
  }

  // ── Suscripción notificaciones ────────────────────────────────────────────────
  function suscribirNotificaciones() {
    var rol     = currentPerfil.rol || 'agente';
    var targets = [currentUser.uid, 'todos', rol];
    if (unsubNotif) unsubNotif();
    unsubNotif = db.collection('notificaciones')
      .where('uid', 'in', targets)
      .onSnapshot(function(snap) {
        notifs = [];
        snap.forEach(function(d) { notifs.push(Object.assign({ id: d.id }, d.data())); });
        notifs.sort(function(a,b){
          return (b.timestamp ? b.timestamp.seconds : 0) - (a.timestamp ? a.timestamp.seconds : 0);
        });
        renderLista();
      }, function(err) { console.warn('notif error:', err.message); });
  }

  // ── Render ────────────────────────────────────────────────────────────────────
  var SVG_ADMIN = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
  var SVG_SOL   = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  var SVG_OK    = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  var SVG_X     = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  var SVG_TRASH = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>';
  var SVG_CHECK = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

  function iconSvg(tipo, subTipo) {
    var t = tipo === 'admin' ? tipo : (subTipo || tipo || 'solicitud');
    if (t === 'admin')     return SVG_ADMIN;
    if (t === 'aprobada')  return SVG_OK;
    if (t === 'rechazada') return SVG_X;
    return SVG_SOL;
  }
  function iconCls(tipo, subTipo) {
    var t = tipo === 'admin' ? tipo : (subTipo || tipo || 'solicitud');
    return t;
  }

  function fmtFechaHora(ts) {
    if (!ts) return '—';
    var d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleString('es-SV', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function destTag(uid) {
    if (!uid || uid === 'todos') return '<span class="tag-dest todos">Todos</span>';
    if (LABELS_ROL[uid]) return '<span class="tag-dest rol">'+LABELS_ROL[uid]+'</span>';
    return '<span class="tag-dest usuario">Personal</span>';
  }

  function renderLista() {
    var leida  = document.getElementById('filtroLeida').value;
    var tipo   = document.getElementById('filtroTipo').value;

    var lista = notifs.filter(function(n) {
      var esLeida = (n.leidaPor||[]).includes(currentUser.uid);
      if (leida === 'no' && esLeida)  return false;
      if (leida === 'si' && !esLeida) return false;
      var t = n.tipo === 'admin' ? 'admin' : (n.subTipo || n.tipo || 'solicitud');
      if (tipo && t !== tipo) return false;
      return true;
    });

    var noLeidas = notifs.filter(function(n){ return !(n.leidaPor||[]).includes(currentUser.uid); }).length;
    document.getElementById('totalLabel').textContent =
      lista.length + ' notificacion' + (lista.length !== 1 ? 'es' : '') +
      (noLeidas ? ' · ' + noLeidas + ' sin leer' : '');

    var el = document.getElementById('notifList');
    if (lista.length === 0) {
      el.innerHTML = '<div class="empty-state"><svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><p>No hay notificaciones</p></div>';
      return;
    }

    var esAdmin = ROLES_ADMIN.includes(currentPerfil.rol);
    var html = '';
    lista.forEach(function(n) {
      var leida = (n.leidaPor||[]).includes(currentUser.uid);
      html += '<div class="notif-item'+(leida?'':' unread')+'" onclick="marcarLeida(\''+n.id+'\')">'
        +'<div class="notif-icon '+iconCls(n.tipo,n.subTipo)+'">'+iconSvg(n.tipo,n.subTipo)+'</div>'
        +'<div class="notif-body">'
        +'<div class="notif-titulo">'+escHtml(n.titulo)+'</div>'
        +'<div class="notif-msg">'+escHtml(n.mensaje)+'</div>'
        +'<div class="notif-meta">'
        +'<span>'+fmtFechaHora(n.timestamp)+'</span>'
        +(n.remitenteNombre?'<span>De: '+escHtml(n.remitenteNombre)+'</span>':'')
        +'<span>'+destTag(n.uid)+'</span>'
        +'</div></div>'
        +'<div class="notif-actions">'
        +(!leida?'<button class="btn-icon" title="Marcar leída" onclick="event.stopPropagation();marcarLeida(\''+n.id+'\')">'+SVG_CHECK+'</button>':'')
        +(esAdmin?'<button class="btn-icon danger" title="Eliminar" onclick="event.stopPropagation();eliminarNotif(\''+n.id+'\')">'+SVG_TRASH+'</button>':'')
        +'</div>'
        +(leida?'':'<div class="notif-dot"></div>')
        +'</div>';
    });
    el.innerHTML = html;
  }

  function aplicarFiltros() { renderLista(); }

  // ── Acciones ──────────────────────────────────────────────────────────────────
  function marcarLeida(id) {
    db.collection('notificaciones').doc(id).update({
      leidaPor: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
  }

  function marcarTodasLeidas() {
    var batch = db.batch();
    var pendientes = notifs.filter(function(n){ return !(n.leidaPor||[]).includes(currentUser.uid); });
    if (!pendientes.length) { showToast('No hay notificaciones sin leer.'); return; }
    pendientes.forEach(function(n) {
      batch.update(db.collection('notificaciones').doc(n.id), {
        leidaPor: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
      });
    });
    batch.commit().then(function(){ showToast('Todas marcadas como leídas.'); });
  }

  function eliminarNotif(id) {
    db.collection('notificaciones').doc(id).delete()
      .then(function(){ showToast('Notificación eliminada.'); })
      .catch(function(e){ showToast('Error: '+e.message); });
  }

  // ── Modal nueva ───────────────────────────────────────────────────────────────
  function abrirModal() {
    document.getElementById('nTipoDest').value = '';
    document.getElementById('nDestSec').value  = '';
    document.getElementById('nTipo').value     = 'admin';
    document.getElementById('nTitulo').value   = '';
    document.getElementById('nMensaje').value  = '';
    document.getElementById('destSecField').style.display = 'none';
    document.getElementById('destPreview').textContent    = 'Selecciona tipo de destinatario';
    document.getElementById('modalNueva').classList.add('show');
    setTimeout(function(){ document.getElementById('nTitulo').focus(); }, 150);
  }

  function cerrarModal() { document.getElementById('modalNueva').classList.remove('show'); }

  function actualizarDest() {
    var tipo = document.getElementById('nTipoDest').value;
    var secField = document.getElementById('destSecField');
    var secSel   = document.getElementById('nDestSec');
    var preview  = document.getElementById('destPreview');

    secField.style.display = 'none';
    secSel.innerHTML = '<option value="">— Selecciona —</option>';

    if (tipo === 'todos') {
      preview.textContent = 'Todos los usuarios';
    } else if (tipo === 'rol') {
      document.getElementById('destSecLabel').textContent = 'Rol';
      secField.style.display = 'flex';
      ['agente','agente-inmersion','supervisor','formacion','admin','wfm','jefe'].forEach(function(r){
        var o = document.createElement('option'); o.value = r; o.textContent = LABELS_ROL[r]||r; secSel.appendChild(o);
      });
      preview.textContent = 'Selecciona un rol';
    } else if (tipo === 'usuario') {
      document.getElementById('destSecLabel').textContent = 'Usuario';
      secField.style.display = 'flex';
      usuarios.forEach(function(u){
        var o = document.createElement('option'); o.value = u.id; o.textContent = u.nombre+' ('+u.email+')'; secSel.appendChild(o);
      });
      preview.textContent = 'Selecciona un usuario';
    } else {
      preview.textContent = 'Selecciona tipo de destinatario';
    }
  }

  document.getElementById('nDestSec').addEventListener('change', function() {
    var tipo = document.getElementById('nTipoDest').value;
    var val  = this.value;
    var preview = document.getElementById('destPreview');
    if (!val) { preview.textContent = 'Selecciona un '+(tipo === 'rol' ? 'rol' : 'usuario'); return; }
    if (tipo === 'rol')     preview.textContent = 'Rol: ' + (LABELS_ROL[val]||val);
    if (tipo === 'usuario') {
      var u = usuarios.find(function(x){ return x.id === val; });
      preview.textContent = u ? u.nombre+' ('+u.email+')' : val;
    }
  });

  function enviarNotificacion() {
    var tipoDest = document.getElementById('nTipoDest').value;
    var destSec  = document.getElementById('nDestSec').value;
    var titulo   = document.getElementById('nTitulo').value.trim();
    var mensaje  = document.getElementById('nMensaje').value.trim();
    var tipo     = document.getElementById('nTipo').value;

    if (!tipoDest)           { showToast('Selecciona el destinatario.'); return; }
    if (tipoDest !== 'todos' && !destSec) { showToast('Selecciona '+(tipoDest==='rol'?'un rol':'un usuario')+'.'); return; }
    if (!titulo)             { document.getElementById('nTitulo').style.borderColor='#DC2626'; showToast('Escribe un título.'); return; }
    if (!mensaje)            { document.getElementById('nMensaje').style.borderColor='#DC2626'; showToast('Escribe un mensaje.'); return; }

    var uid = tipoDest === 'todos' ? 'todos' : destSec;
    var btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando…';

    db.collection('notificaciones').add({
      uid:             uid,
      titulo:          titulo,
      mensaje:         mensaje,
      tipo:            tipo,
      subTipo:         tipo !== 'admin' ? tipo : '',
      remitenteNombre: currentPerfil.nombre || currentUser.email,
      leidaPor:        [],
      timestamp:       firebase.firestore.FieldValue.serverTimestamp()
    }).then(function() {
      cerrarModal();
      showToast('Notificación enviada.');
      btn.disabled = false; btn.textContent = 'Enviar';
    }).catch(function(e) {
      showToast('Error: '+e.message);
      btn.disabled = false; btn.textContent = 'Enviar';
    });
  }

  // ── Toast ─────────────────────────────────────────────────────────────────────
  var _toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
</script>
<script src="notif.js"></script>
<script src="sidebar.js"></script>
<script>
  initSidebar();
  initNotif(db, auth);
</script>
</body>
