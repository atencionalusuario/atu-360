<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mobile-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — Logs de usuarios</title>
<base href="/atu-360/">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="base.css">
<style>
  .content-wrap { flex: 1; overflow-y: auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 16px; }

  .lg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .lg-title { font-size: 0.95rem; font-weight: 700; color: #0F2070; }
  .lg-sub   { font-size: 0.78rem; color: #64748B; margin-top: 2px; }
  .btn-refresh {
    padding: 8px 16px; background: white; color: #374151; border: 1.5px solid #E2E8F0; border-radius: 8px;
    font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .btn-refresh:hover { border-color: #CBD5E1; }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-refresh svg.spin { animation: lgspin 0.8s linear infinite; }
  @keyframes lgspin { to { transform: rotate(360deg); } }

  .lg-filtros {
    background: white; border-radius: 12px; border: 1.5px solid #E2E8F0; padding: 16px 20px;
    display: flex; gap: 16px; flex-wrap: wrap;
  }
  .lg-field { display: flex; flex-direction: column; gap: 5px; }
  .lg-field label { font-size: 0.72rem; font-weight: 600; color: #64748B; }
  .lg-field select, .lg-field input {
    padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.8rem;
    font-family: inherit; color: #1E293B; background: #F8FAFC; outline: none; min-width: 160px;
  }
  .lg-field input[type="text"] { min-width: 220px; }
  .lg-field select:focus, .lg-field input:focus { border-color: #1A3DAA; background: white; }

  .lg-card { background: white; border-radius: 12px; border: 1.5px solid #E2E8F0; overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .lg-tbl-wrap { overflow: auto; flex: 1; min-height: 0; }
  table.lg-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  table.lg-table th {
    text-align: left; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8;
    font-weight: 700; padding: 11px 16px; border-bottom: 1.5px solid #E2E8F0; background: #F8FAFC;
    position: sticky; top: 0; z-index: 1;
  }
  table.lg-table td { padding: 11px 16px; border-bottom: 1px solid #F1F5F9; vertical-align: top; color: #374151; }
  table.lg-table tr:last-child td { border-bottom: none; }
  .lg-fecha { white-space: nowrap; color: #64748B; font-variant-numeric: tabular-nums; }
  .lg-usuario { font-weight: 600; color: #1E293B; white-space: nowrap; }
  .lg-detalle { color: #475569; }

  .lg-chip {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.68rem; font-weight: 700;
    white-space: nowrap;
  }
  .lg-chip.inicio-sesion   { background: #F0FDF4; color: #16A34A; }
  .lg-chip.cierre-sesion   { background: #F1F5F9; color: #64748B; }
  .lg-chip.inicio-turno    { background: #EEF2FF; color: #1A3DAA; }
  .lg-chip.fin-turno       { background: #FEF2F2; color: #DC2626; }
  .lg-chip.cambio-auxiliar { background: #FFFBEB; color: #B45309; }

  .lg-footer { padding: 12px 20px; font-size: 0.75rem; color: #94A3B8; border-top: 1px solid #F1F5F9; flex-shrink: 0; }
  .lg-empty { text-align: center; padding: 40px 20px; color: #94A3B8; font-size: 0.82rem; }
  .lg-loading { text-align: center; padding: 40px 20px; color: #94A3B8; font-size: 0.82rem; }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2 style="font-size:0.9rem;font-weight:600">Logs de usuarios</h2>
      <span class="topbar-sep">/</span>
      <p class="tb-page-sub">Historial de inicios/cierres de sesión, turnos y auxiliares</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div class="content-wrap">

    <div class="lg-head">
      <div>
        <div class="lg-title">LOGS DE USUARIOS</div>
        <div class="lg-sub">Historial de inicios/cierres de sesión y acciones importantes realizadas en la herramienta.</div>
      </div>
      <button class="btn-refresh" id="btnActualizar" onclick="cargarLogs()">
        <svg id="iconRefresh" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Actualizar
      </button>
    </div>

    <div class="lg-filtros">
      <div class="lg-field">
        <label>Usuario</label>
        <select id="lgUsuario" onchange="renderLogs()"><option value="">Todos</option></select>
      </div>
      <div class="lg-field">
        <label>Desde</label>
        <input type="date" id="lgDesde" onchange="renderLogs()">
      </div>
      <div class="lg-field">
        <label>Hasta</label>
        <input type="date" id="lgHasta" onchange="renderLogs()">
      </div>
      <div class="lg-field" style="flex:1">
        <label>Buscar</label>
        <input type="text" id="lgBuscar" placeholder="Buscar por texto..." oninput="renderLogs()">
      </div>
    </div>

    <div class="lg-card">
      <div class="lg-tbl-wrap">
        <table class="lg-table">
          <thead>
            <tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>
          </thead>
          <tbody id="lgTbody"><tr><td colspan="4"><div class="lg-loading">Cargando...</div></td></tr></tbody>
        </table>
      </div>
      <div class="lg-footer" id="lgFooter"></div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  var BASE = 'https://atencionalusuario.github.io/atu-360/';
  var ROLES_PERMITIDOS = ['superadmin'];

  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var db   = firebase.firestore();
  var auth = firebase.auth();

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var ACCIONES_LABEL = {
    'inicio-sesion':   'Inicio de sesión',
    'cierre-sesion':   'Cierre de sesión',
    'inicio-turno':    'Inicio de turno',
    'fin-turno':       'Fin de turno',
    'cambio-auxiliar': 'Cambio de auxiliar'
  };

  var logs = [];
  var LIMITE_LOGS = 500;

  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = BASE + 'login.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      if (!doc.exists || !ROLES_PERMITIDOS.includes(doc.data().rol)) {
        window.location.href = BASE + 'home.html'; return;
      }
      cargarLogs();
    });
  });

  function escHtml(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function cargarLogs() {
    var btn = document.getElementById('btnActualizar');
    var icon = document.getElementById('iconRefresh');
    btn.disabled = true; icon.classList.add('spin');
    db.collection('logs').orderBy('timestamp','desc').limit(LIMITE_LOGS).get()
      .then(function(snap) {
        logs = [];
        snap.forEach(function(d) { logs.push(Object.assign({ id: d.id }, d.data())); });
        poblarSelectUsuario();
        renderLogs();
      })
      .catch(function(e) {
        console.error(e);
        document.getElementById('lgTbody').innerHTML = '<tr><td colspan="4"><div class="lg-empty">Error al cargar los logs.</div></td></tr>';
      })
      .finally(function() {
        btn.disabled = false; icon.classList.remove('spin');
      });
  }

  function poblarSelectUsuario() {
    var sel = document.getElementById('lgUsuario');
    var prev = sel.value;
    var emails = [];
    logs.forEach(function(l) { if (l.email && emails.indexOf(l.email) < 0) emails.push(l.email); });
    emails.sort();
    sel.innerHTML = '<option value="">Todos</option>' + emails.map(function(e) {
      return '<option value="'+escHtml(e)+'">'+escHtml(e)+'</option>';
    }).join('');
    if (emails.indexOf(prev) >= 0) sel.value = prev;
  }

  function renderLogs() {
    var usuario = document.getElementById('lgUsuario').value;
    var desde   = document.getElementById('lgDesde').value;
    var hasta   = document.getElementById('lgHasta').value;
    var busq    = document.getElementById('lgBuscar').value.trim().toLowerCase();

    var filtrados = logs.filter(function(l) {
      if (usuario && l.email !== usuario) return false;
      if (l.timestamp) {
        var f = l.timestamp.toDate();
        var fISO = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
        if (desde && fISO < desde) return false;
        if (hasta && fISO > hasta) return false;
      }
      if (busq) {
        var hay = (l.email||'')+' '+(l.detalle||'')+' '+(ACCIONES_LABEL[l.accion]||l.accion||'');
        if (hay.toLowerCase().indexOf(busq) < 0) return false;
      }
      return true;
    });

    var tbody = document.getElementById('lgTbody');
    if (filtrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4"><div class="lg-empty">No hay registros que coincidan con el filtro.</div></td></tr>';
    } else {
      tbody.innerHTML = filtrados.map(function(l) {
        var fecha = l.timestamp ? l.timestamp.toDate().toLocaleString('es-SV') : '—';
        var chipCls = ACCIONES_LABEL[l.accion] ? l.accion : 'cierre-sesion';
        var label = ACCIONES_LABEL[l.accion] || l.accion || '—';
        return '<tr>'
          + '<td class="lg-fecha">'+escHtml(fecha)+'</td>'
          + '<td class="lg-usuario">'+escHtml(l.email||'—')+'</td>'
          + '<td><span class="lg-chip '+chipCls+'">'+escHtml(label)+'</span></td>'
          + '<td class="lg-detalle">'+escHtml(l.detalle||'')+'</td>'
          + '</tr>';
      }).join('');
    }
    document.getElementById('lgFooter').textContent = 'Mostrando '+filtrados.length+' de '+logs.length+' registro(s) que coinciden con el filtro.'
      + (logs.length >= LIMITE_LOGS ? ' (límite de '+LIMITE_LOGS+' más recientes)' : '');
  }
</script>
<script src="notif.js"></script>
<script src="sidebar.js"></script>
<script>
  initSidebar();
  initNotif(db, auth);
</script>
</body>
</html>
