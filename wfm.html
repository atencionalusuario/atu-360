<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — WFM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F8FAFC; display: flex; min-height: 100vh; color: #1E293B; }

  /* SIDEBAR */
  .sidebar { width: 220px; flex-shrink: 0; background: #0F2070; display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh; }
  .sb-brand { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .sb-name { font-size: 1.25rem; font-weight: 800; color: white; }
  .sb-name span { color: #29ABE2; }
  .sb-tagline { font-size: 0.62rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 2px; margin-top: 3px; }
  .sb-nav { padding: 20px 12px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; font-size: 0.8rem; color: rgba(255,255,255,0.55); cursor: pointer; transition: all 0.15s; margin-bottom: 1px; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .nav-item.active { background: rgba(41,171,226,0.15); color: white; font-weight: 600; border-left: 2px solid #29ABE2; }
  .sb-bottom { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.08); }
  .sb-user-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .sb-avatar { width: 32px; height: 32px; border-radius: 50%; background: #29ABE2; display: flex; align-items: center; justify-content: center; font-size: 0.72rem; color: white; font-weight: 700; flex-shrink: 0; }
  .sb-user-name { font-size: 0.76rem; font-weight: 600; color: white; }
  .sb-user-role { font-size: 0.62rem; color: #29ABE2; font-weight: 600; margin-top: 1px; }
  .btn-logout { width: 100%; padding: 8px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-logout:hover { background: rgba(255,255,255,0.1); color: white; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .topbar { background: white; padding: 0 28px; height: 56px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E2E8F0; position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 8px; }
  .topbar-left h2 { font-size: 0.9rem; font-weight: 600; }
  .topbar-sep { color: #CBD5E1; }
  .topbar-left p { font-size: 0.78rem; color: #94A3B8; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .tb-clock { font-size: 1rem; font-weight: 700; color: #1A3DAA; font-variant-numeric: tabular-nums; }

  /* CONTROLES */
  .controles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .ctrl-input { padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; width: 200px; }
  .ctrl-input:focus { border-color: #1A3DAA; }
  .ctrl-select { padding: 8px 10px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; cursor: pointer; }
  .ctrl-select:focus { border-color: #1A3DAA; }
  .btn-dir { width: 30px; height: 30px; border: 1.5px solid #E2E8F0; border-radius: 6px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #64748B; transition: all 0.15s; }
  .btn-dir:hover { border-color: #1A3DAA; color: #1A3DAA; }

  /* STATS */
  .stats-row { display: flex; gap: 10px; flex-shrink: 0; }
  .stat-chip { background: white; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  .stat-chip-val { font-size: 1.3rem; font-weight: 800; color: #1A3DAA; line-height: 1; }
  .stat-chip-label { font-size: 0.68rem; color: #94A3B8; font-weight: 500; }
  .stat-chip.activos .stat-chip-val  { color: #16A34A; }
  .stat-chip.inactivos .stat-chip-val { color: #DC2626; }

  /* PANEL DETALLE */
  .dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .dp-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
  .dp-label { font-size: 0.65rem; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
  .dp-val { font-size: 0.8rem; color: #1E293B; font-weight: 500; }
  .dp-section-title { font-size: 0.62rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #F1F5F9; }
  .btn-sec { padding: 8px 14px; border: 1.5px solid #E2E8F0; border-radius: 7px; background: white; font-size: 0.78rem; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-sec:hover { border-color: #CBD5E1; }
  .btn-pri { padding: 8px 14px; border: none; border-radius: 7px; background: #1A3DAA; color: white; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-pri:hover { opacity: 0.88; }

  /* SOLICITUDES CALENDARIO */
  .sol-cal-wrap { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; align-content: start; }
  .sol-cal-hdr  { text-align: center; font-size: 0.62rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; padding: 4px 0; }
  .sol-cal-cell { background: white; border: 1.5px solid #F1F5F9; border-radius: 7px; padding: 6px 7px; min-height: 76px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 3px; }
  .sol-cal-cell:hover { border-color: #29ABE2; }
  .sol-cal-cell.sel  { border-color: #1A3DAA; background: #EEF2FF; }
  .sol-cal-cell.hoy  { outline: 2px solid #1A3DAA; outline-offset: 1px; }
  .sol-cal-cell.vacio{ background: transparent; border-color: transparent; cursor: default; min-height: 76px; }
  .sol-cal-cell.vacio:hover { border-color: transparent; }
  .sol-cal-num  { font-size: 0.72rem; font-weight: 700; color: #374151; }
  .sol-cal-total{ font-size: 0.65rem; font-weight: 800; color: white; background: #1A3DAA; padding: 1px 6px; border-radius: 10px; display: inline-block; align-self: flex-start; }
  .sol-cal-dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
  .sol-cal-dot  { height: 5px; border-radius: 2px; flex-shrink: 0; }
  /* Panel detalle dia */
  .sol-det-entry { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; background: #F8FAFC; border-radius: 7px; border-left: 3px solid #E2E8F0; }
  .sol-det-nombre { font-size: 0.8rem; font-weight: 700; color: #1E293B; }
  .sol-det-meta   { font-size: 0.68rem; color: #64748B; }

  /* TIEMPO REAL */
  .rt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; overflow-y: auto; flex: 1; align-content: start; }
  .ac-card { background: white; border: 1.5px solid #E2E8F0; border-radius: 10px; padding: 12px; }
  .ac-card.offline { opacity: 0.55; }
  .ac-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ac-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ac-indicator.on  { background: #16A34A; box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
  .ac-indicator.off { background: #CBD5E1; }
  .ac-av { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; color: white; font-weight: 700; flex-shrink: 0; }
  .ac-av.online  { background: #1A3DAA; }
  .ac-av.offline { background: #94A3B8; }
  .ac-nombre   { font-size: 0.78rem; font-weight: 700; color: #1E293B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-proyecto { font-size: 0.65rem; color: #94A3B8; }
  .ac-estado-badge { font-size: 0.68rem; font-weight: 600; padding: 4px 8px; border-radius: 5px; text-align: center; }
  .ac-sin-marcaje { font-size: 0.72rem; color: #94A3B8; padding: 4px 0; }
  .ac-rt-timer { font-size: 0.68rem; font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; margin-top: 2px; }

  /* TURNO */
  .turno-agent-item { background: white; border: 1.5px solid #E2E8F0; border-radius: 9px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 9px; }
  .turno-agent-item:hover { border-color: #29ABE2; }
  .turno-agent-item.active { border-color: #1A3DAA; background: #EEF2FF; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .cal-dia { border-radius: 5px; padding: 4px 2px; text-align: center; font-size: 0.65rem; }
  .cal-dia.laboral  { background: #EEF2FF; color: #1A3DAA; }
  .cal-dia.descanso { background: #F1F5F9; color: #94A3B8; }
  .cal-dia.hoy      { outline: 2px solid #1A3DAA; outline-offset: 1px; }
  .cal-dia.vacio    { background: transparent; }
  .dia-num { display: block; font-weight: 700; font-size: 0.72rem; }
  .dia-tag { display: block; font-size: 0.52rem; text-transform: uppercase; margin-top: 1px; opacity: 0.7; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #1E293B; color: white; padding: 12px 18px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.15); opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-brand">
    <div class="sb-name">ATU <span>360</span></div>
    <div class="sb-tagline">WFM</div>
  </div>
  <div class="sb-nav">
    <div class="nav-item active" id="navSolicitudes" onclick="wfmSwitch('solicitudes')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Solicitudes
    </div>
    <div class="nav-item" id="navTiempoReal" onclick="wfmSwitch('tiemporeal')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Tiempo Real
    </div>
    <div class="nav-item" id="navTurno" onclick="wfmSwitch('turno')">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Gestión de Turnos
    </div>
    <div class="nav-item" id="navTransporte" onclick="window.location.href='https://atencionalusuario.github.io/atu-360/transporte.html'">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      Transporte
    </div>
  </div>
  <div class="sb-bottom">
    <div class="sb-user-wrap">
      <div class="sb-avatar" id="sbAvatar">WF</div>
      <div>
        <div class="sb-user-name" id="sbName">WFM</div>
        <div class="sb-user-role">WFM</div>
      </div>
    </div>
    <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="topbarTitle">Solicitudes</h2>
      <span class="topbar-sep" id="topbarSep">/</span>
      <p id="totalLabel">Aprobación final</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
    </div>
  </div>

  <!-- VISTA SOLICITUDES -->
  <div id="vistaSolicitudes" style="display:flex;flex:1;overflow:hidden;padding:20px 24px;flex-direction:column;gap:12px">
    <!-- STATS -->
    <div class="stats-row" id="wfmSolStats" style="flex-shrink:0"></div>
    <!-- CONTROLES -->
    <div class="controles" style="flex-shrink:0">
      <button class="btn-dir" onclick="wfmSolCambiarMes(-1)" style="width:28px;height:28px">&#8249;</button>
      <span id="wfmSolMesLabel" style="font-size:0.85rem;font-weight:700;color:#1E293B;min-width:148px;text-align:center"></span>
      <button class="btn-dir" onclick="wfmSolCambiarMes(1)"  style="width:28px;height:28px">&#8250;</button>
      <button class="btn-dir" onclick="wfmSolIrHoy()" style="width:auto;padding:0 10px;font-size:0.72rem">Hoy</button>
      <div style="width:1px;height:24px;background:#E2E8F0;margin:0 4px"></div>
      <select class="ctrl-select" id="wfmSolFiltProy" onchange="wfmSolRenderCal()">
        <option value="">Todos los proyectos</option>
        <option value="doctorsv">DoctorSV</option>
        <option value="educacion">Educación</option>
        <option value="marn">MARN</option>
        <option value="global">Global</option>
      </select>
      <select class="ctrl-select" id="wfmSolFiltTipo" onchange="wfmSolRenderCal()">
        <option value="">Todos los tipos</option>
        <option value="vacaciones">Vacaciones</option>
        <option value="permiso">Permiso</option>
        <option value="capacitacion">Capacitación</option>
        <option value="ajuste">Ajuste de marcaje</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <!-- CUERPO: CALENDARIO + DETALLE -->
    <div style="display:flex;flex:1;overflow:hidden;gap:14px">
      <!-- CALENDARIO -->
      <div style="flex:1;display:flex;flex-direction:column;gap:4px;overflow:hidden">
        <div class="sol-cal-wrap" style="flex-shrink:0">
          <div class="sol-cal-hdr">Dom</div><div class="sol-cal-hdr">Lun</div><div class="sol-cal-hdr">Mar</div>
          <div class="sol-cal-hdr">Mié</div><div class="sol-cal-hdr">Jue</div><div class="sol-cal-hdr">Vie</div>
          <div class="sol-cal-hdr">Sáb</div>
        </div>
        <div class="sol-cal-wrap" id="wfmSolCal" style="flex:1;overflow-y:auto;align-content:start"></div>
      </div>
      <!-- PANEL DETALLE DÍA -->
      <div id="wfmSolDetalle" style="width:260px;flex-shrink:0;background:white;border-radius:10px;border:1px solid #E2E8F0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94A3B8;font-size:0.82rem;text-align:center">Selecciona un día para ver las solicitudes activas.</div>
      </div>
    </div>
  </div>

  <!-- VISTA TIEMPO REAL -->
  <div id="vistaTiempoReal" style="display:none;flex:1;overflow:hidden;padding:20px 24px;flex-direction:column;gap:12px">
    <div class="stats-row" id="wfmRTStats"></div>
    <div class="controles">
      <input class="ctrl-input" id="wfmRTBusq" placeholder="Buscar agente..." oninput="wfmRenderRT()">
      <select class="ctrl-select" id="wfmRTFiltProy" onchange="wfmRenderRT()">
        <option value="">Todos los proyectos</option>
        <option value="doctorsv">DoctorSV</option>
        <option value="educacion">Educación</option>
        <option value="marn">MARN</option>
        <option value="global">Global</option>
      </select>
      <select class="ctrl-select" id="wfmRTFiltEst" onchange="wfmRenderRT()">
        <option value="">Todos los estados</option>
      </select>
      <span id="wfmRTCount" style="font-size:0.75rem;color:#94A3B8;margin-left:4px"></span>
    </div>
    <div class="rt-grid" id="wfmRTGrid">
      <div style="font-size:0.8rem;color:#94A3B8;grid-column:1/-1">Cargando...</div>
    </div>
  </div>

  <!-- VISTA TURNO -->
  <div id="vistaTurno" style="display:none;flex:1;overflow:hidden;padding:20px 24px;flex-direction:column;gap:12px">
    <div style="display:flex;flex:1;overflow:hidden;background:white;border-radius:10px;border:1px solid #E2E8F0">
      <div style="width:280px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;padding:12px;border-right:1px solid #F1F5F9;gap:8px">
        <input class="ctrl-input" id="wfmTurnoBusq" placeholder="Buscar agente..." oninput="wfmRenderTurnoLista()" style="width:100%">
        <div id="wfmTurnoLista" style="overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px">
          <div style="font-size:0.8rem;color:#94A3B8">Cargando...</div>
        </div>
      </div>
      <div id="wfmTurnoDetalle" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94A3B8;font-size:0.82rem">Selecciona un agente para ver su turno.</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var auth = firebase.auth();
  var db   = firebase.firestore();
  var BASE = 'https://atencionalusuario.github.io/atu-360/';

  var currentUser = null;

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var LABELS_PROY = { doctorsv:'DoctorSV', educacion:'Educación', marn:'MARN', global:'Global' };

  function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function wfmInic(n){ return (n||'?').split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase(); }
  function wfmPad(n){ return String(n).padStart(2,'0'); }
  function dpField(label,val){ return '<div class="dp-field"><div class="dp-label">'+label+'</div><div class="dp-val">'+val+'</div></div>'; }
  function showToast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000); }

  // ===== AUTH =====
  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = BASE+'login.html'; return; }
    currentUser = user;
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      if (!doc.exists || !['wfm'].includes(doc.data().rol)) {
        auth.signOut(); window.location.href = BASE+'login.html'; return;
      }
      var d = doc.data();
      var nombre = d.nombre || user.email.split('@')[0];
      document.getElementById('sbName').textContent   = nombre;
      document.getElementById('sbAvatar').textContent = wfmInic(nombre);
      wfmIniciarSolicitudes();
    });
  });

  document.getElementById('btnLogout').addEventListener('click', function() {
    auth.signOut().then(function() { window.location.href = BASE+'login.html'; });
  });

  // ===== SWITCH DE VISTAS =====
  var WFM_VISTAS  = ['vistaSolicitudes','vistaTiempoReal','vistaTurno'];
  var WFM_CLAVES  = ['solicitudes','tiemporeal','turno'];
  var WFM_NAVIDS  = ['navSolicitudes','navTiempoReal','navTurno'];
  var WFM_TITULOS = { solicitudes:'Solicitudes', tiemporeal:'Tiempo Real', turno:'Gestión de Turnos' };
  var WFM_SUBS    = { solicitudes:'Aprobación final', tiemporeal:'Todos los agentes', turno:'Turnos asignados' };

  function wfmSwitch(vista) {
    WFM_VISTAS.forEach(function(id,i){ var el=document.getElementById(id); if(el) el.style.display=(WFM_CLAVES[i]===vista)?'flex':'none'; });
    WFM_NAVIDS.forEach(function(id,i){ var el=document.getElementById(id); if(el) el.classList.toggle('active',WFM_CLAVES[i]===vista); });
    var tEl=document.getElementById('topbarTitle'); if(tEl) tEl.textContent=WFM_TITULOS[vista]||'WFM';
    var sEl=document.getElementById('totalLabel');  if(sEl) sEl.textContent=WFM_SUBS[vista]||'';
    if (vista==='tiemporeal' && !wfmRTCargado)   wfmIniciarRT();
    if (vista==='turno'      && !wfmTurnoCargado) wfmIniciarTurno();
  }

  // ===== SOLICITUDES — CALENDARIO =====
  var wfmSolDatos    = [];   // solicitudes aprobadas enriquecidas con proyecto del agente
  var wfmSolUsuarios = {};   // uid → { proyecto }
  var wfmSolMes      = (function(){ var h=new Date(); return new Date(h.getFullYear(),h.getMonth(),1); })();
  var wfmSolDiaSel   = null;
  var WFM_SOL_MESES  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var SOL_TIPOS      = { vacaciones:'Vacaciones', permiso:'Permiso', capacitacion:'Capacitación', ajuste:'Ajuste de marcaje', otro:'Otro' };
  var SOL_TIPO_COLOR = { vacaciones:'#1A3DAA', permiso:'#16A34A', capacitacion:'#7C3AED', ajuste:'#D97706', otro:'#64748B' };
  var SOL_PROY_COLOR = { doctorsv:'#1A3DAA', educacion:'#15803D', marn:'#B45309', global:'#475569' };

  function wfmIniciarSolicitudes() {
    // Carga usuarios primero para obtener proyecto de cada agente
    db.collection('usuarios').get().then(function(snap) {
      snap.forEach(function(d){ wfmSolUsuarios[d.id] = d.data(); });
      // Luego carga todas las solicitudes aprobadas
      db.collection('solicitudes').where('estado','==','aprobada').get()
        .then(function(snap2) {
          wfmSolDatos = [];
          snap2.forEach(function(d) {
            var s = Object.assign({ id: d.id }, d.data());
            // Enriquecer con proyecto del agente
            var u = wfmSolUsuarios[s.agenteUid] || {};
            s.proyecto = u.proyecto || '';
            wfmSolDatos.push(s);
          });
          wfmSolRenderStats();
          wfmSolRenderCal();
        });
    });
  }

  function wfmSolFechaStr(ts) {
    // Convierte Timestamp o string YYYY-MM-DD a Date
    if (!ts) return null;
    if (ts.seconds) return new Date(ts.seconds * 1000);
    if (typeof ts === 'string') { var p = ts.split('-'); return new Date(p[0], p[1]-1, p[2]); }
    return null;
  }

  function wfmSolActivosEnDia(fechaKey) {
    // Retorna solicitudes cuyo rango [fechaInicio, fechaFin] incluye este día
    var fProy = (document.getElementById('wfmSolFiltProy')||{}).value||'';
    var fTipo = (document.getElementById('wfmSolFiltTipo')||{}).value||'';
    return wfmSolDatos.filter(function(s) {
      if (fProy && s.proyecto !== fProy) return false;
      if (fTipo && s.tipo !== fTipo) return false;
      var ini = wfmSolFechaStr(s.fechaInicio);
      var fin = wfmSolFechaStr(s.fechaFin || s.fechaInicio);
      if (!ini) return false;
      // Normalizar a solo fecha (sin hora)
      var d = new Date(fechaKey + 'T00:00:00');
      ini.setHours(0,0,0,0); fin.setHours(0,0,0,0);
      return d >= ini && d <= fin;
    });
  }

  function wfmSolRenderStats() {
    var el = document.getElementById('wfmSolStats'); if (!el) return;
    var año = wfmSolMes.getFullYear(), mes = wfmSolMes.getMonth();
    var fProy = (document.getElementById('wfmSolFiltProy')||{}).value||'';
    var fTipo = (document.getElementById('wfmSolFiltTipo')||{}).value||'';
    // Solicitudes con al menos un día en el mes visible
    var enMes = wfmSolDatos.filter(function(s) {
      if (fProy && s.proyecto !== fProy) return false;
      if (fTipo && s.tipo !== fTipo) return false;
      var ini = wfmSolFechaStr(s.fechaInicio);
      var fin = wfmSolFechaStr(s.fechaFin || s.fechaInicio);
      if (!ini) return false;
      var mesIni = new Date(año, mes, 1);
      var mesFin = new Date(año, mes+1, 0);
      ini.setHours(0,0,0,0); fin.setHours(0,0,0,0);
      return ini <= mesFin && fin >= mesIni;
    });
    // Conteo por tipo
    var porTipo = {};
    enMes.forEach(function(s){ porTipo[s.tipo] = (porTipo[s.tipo]||0) + 1; });
    var tiposHtml = Object.keys(porTipo).map(function(t) {
      var c = SOL_TIPO_COLOR[t]||'#64748B';
      return '<div class="stat-chip" style="border-left:3px solid '+c+'">'
        +'<div class="stat-chip-val" style="color:'+c+';font-size:1rem">'+porTipo[t]+'</div>'
        +'<div class="stat-chip-label">'+(SOL_TIPOS[t]||t)+'</div></div>';
    }).join('');
    el.innerHTML = '<div class="stat-chip"><div class="stat-chip-val">'+enMes.length+'</div><div class="stat-chip-label">Aprobadas este mes</div></div>' + tiposHtml;
  }

  function wfmSolRenderCal() {
    var mesEl = document.getElementById('wfmSolMesLabel');
    var año   = wfmSolMes.getFullYear(), mes = wfmSolMes.getMonth();
    if (mesEl) mesEl.textContent = WFM_SOL_MESES[mes] + ' ' + año;
    wfmSolRenderStats();

    var primerDia  = new Date(año, mes, 1).getDay();
    var totalDias  = new Date(año, mes+1, 0).getDate();
    var hoy        = new Date();
    var cal        = document.getElementById('wfmSolCal'); if (!cal) return;
    var html = '';

    // Celdas vacías al inicio
    for (var i = 0; i < primerDia; i++) html += '<div class="sol-cal-cell vacio"></div>';

    for (var d = 1; d <= totalDias; d++) {
      var key    = año + '-' + wfmPad(mes+1) + '-' + wfmPad(d);
      var activos = wfmSolActivosEnDia(key);
      var esHoy  = año===hoy.getFullYear() && mes===hoy.getMonth() && d===hoy.getDate();
      var esSel  = wfmSolDiaSel === key;
      var clases = 'sol-cal-cell' + (esHoy?' hoy':'') + (esSel?' sel':'');

      // Puntos por tipo (canal)
      var porTipo = {};
      activos.forEach(function(s){ porTipo[s.tipo] = (porTipo[s.tipo]||0)+1; });
      var dotsHtml = Object.keys(porTipo).map(function(t){
        var c = SOL_TIPO_COLOR[t]||'#94A3B8';
        var w = Math.min(porTipo[t] * 8, 32);
        return '<div class="sol-cal-dot" style="width:'+w+'px;background:'+c+'"></div>';
      }).join('');

      // Puntos por proyecto
      var porProy = {};
      activos.forEach(function(s){ if(s.proyecto) porProy[s.proyecto] = (porProy[s.proyecto]||0)+1; });
      var proyHtml = Object.keys(porProy).map(function(p){
        var c = SOL_PROY_COLOR[p]||'#94A3B8';
        return '<div class="sol-cal-dot" style="width:8px;background:'+c+';opacity:0.5"></div>';
      }).join('');

      html += '<div class="'+clases+'" onclick="wfmSolVerDia(\''+key+'\')">'
        + '<div class="sol-cal-num">'+d+'</div>'
        + (activos.length ? '<div class="sol-cal-total">'+activos.length+'</div>' : '')
        + (dotsHtml ? '<div class="sol-cal-dots">'+dotsHtml+'</div>' : '')
        + (proyHtml ? '<div class="sol-cal-dots">'+proyHtml+'</div>' : '')
        + '</div>';
    }
    cal.innerHTML = html;
  }

  function wfmSolVerDia(key) {
    wfmSolDiaSel = key;
    wfmSolRenderCal();
    var activos = wfmSolActivosEnDia(key);
    var det = document.getElementById('wfmSolDetalle'); if (!det) return;
    var partes = key.split('-');
    var fechaLabel = parseInt(partes[2]) + ' de ' + WFM_SOL_MESES[parseInt(partes[1])-1] + ' ' + partes[0];
    if (activos.length === 0) {
      det.innerHTML = '<div style="font-size:0.75rem;font-weight:700;color:#0F2070;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;border-bottom:2px solid #F1F5F9;margin-bottom:8px">'+fechaLabel+'</div>'
        + '<div style="font-size:0.8rem;color:#94A3B8;padding:20px 0;text-align:center">Sin solicitudes aprobadas.</div>';
      return;
    }
    var html = '<div style="font-size:0.75rem;font-weight:700;color:#0F2070;text-transform:uppercase;letter-spacing:.5px;padding-bottom:8px;border-bottom:2px solid #F1F5F9;margin-bottom:8px">'
      + fechaLabel + ' <span style="color:#1A3DAA;font-size:0.72rem">('+activos.length+')</span></div>';
    activos.forEach(function(s) {
      var c  = SOL_TIPO_COLOR[s.tipo]||'#94A3B8';
      var cp = SOL_PROY_COLOR[s.proyecto]||'#94A3B8';
      var ini = s.fechaInicio || '—', fin = s.fechaFin || s.fechaInicio || '—';
      html += '<div class="sol-det-entry" style="border-left-color:'+c+'">'
        + '<div class="sol-det-nombre">'+escHtml(s.agente||s.nombre||'Agente')+'</div>'
        + '<div class="sol-det-meta" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
        + '<span style="color:'+c+';font-weight:700">'+(SOL_TIPOS[s.tipo]||s.tipo)+'</span>'
        + (s.proyecto ? '<span style="color:'+cp+';font-weight:600">'+escHtml(LABELS_PROY[s.proyecto]||s.proyecto)+'</span>' : '')
        + '</div>'
        + '<div class="sol-det-meta">'+escHtml(ini)+' — '+escHtml(fin)+'</div>'
        + '</div>';
    });
    det.innerHTML = html;
  }

  function wfmSolCambiarMes(dir) {
    wfmSolMes.setMonth(wfmSolMes.getMonth() + dir);
    wfmSolDiaSel = null;
    wfmSolRenderCal();
    document.getElementById('wfmSolDetalle').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94A3B8;font-size:0.82rem;text-align:center">Selecciona un día para ver las solicitudes activas.</div>';
  }
  function wfmSolIrHoy() {
    var h = new Date(); wfmSolMes = new Date(h.getFullYear(), h.getMonth(), 1);
    wfmSolDiaSel = null; wfmSolRenderCal();
    document.getElementById('wfmSolDetalle').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94A3B8;font-size:0.82rem;text-align:center">Selecciona un día para ver las solicitudes activas.</div>';
  }

  // ===== TIEMPO REAL =====
  var wfmRTCargado = false;
  var wfmRTAgentes = [];
  var wfmRTTimers  = {};

  var RT_ESTADOS = {
    'Inbound':              { bg:'#EEF2FF', text:'#1A3DAA' },
    'Outbound':             { bg:'#F0F9FF', text:'#0284C7' },
    'Pausa administrativa': { bg:'#F5F3FF', text:'#7C3AED' },
    'Break':                { bg:'#FFF7ED', text:'#C2410C' },
    'Baño':                 { bg:'#F0FDF4', text:'#15803D' },
    'Comida':               { bg:'#FEF9C3', text:'#92400E' },
    'Capacitación':         { bg:'#F0FDF4', text:'#065F46' },
    'Feedback':             { bg:'#FDF4FF', text:'#86198F' },
    'Jornada finalizada':   { bg:'#F1F5F9', text:'#64748B' },
    'Fuera':                { bg:'#F1F5F9', text:'#94A3B8' }
  };

  function wfmIniciarRT() {
    wfmRTCargado = true;
    db.collection('usuarios').where('rol','in',['agente','agente-inmersion','supervisor'])
      .onSnapshot(function(snap){
        wfmRTAgentes=[];
        snap.forEach(function(d){ wfmRTAgentes.push(Object.assign({id:d.id},d.data())); });
        wfmRenderRT();
      }, function(e){ console.error('rt',e); });
  }

  function wfmRenderRT() {
    var busq  = (document.getElementById('wfmRTBusq')||{}).value||'';
    var fProy = (document.getElementById('wfmRTFiltProy')||{}).value||'';
    var fEst  = (document.getElementById('wfmRTFiltEst')||{}).value||'';

    var lista = wfmRTAgentes.filter(function(a){
      if(busq && !(a.nombre||'').toLowerCase().includes(busq.toLowerCase()) && !(a.email||'').toLowerCase().includes(busq.toLowerCase())) return false;
      if(fProy && a.proyecto!==fProy) return false;
      if(fEst  && (a.estadoActual||'Fuera')!==fEst) return false;
      return true;
    });
    lista.sort(function(a,b){ if(a.enLinea&&!b.enLinea)return -1; if(!a.enLinea&&b.enLinea)return 1; return (a.nombre||'').localeCompare(b.nombre||'','es'); });

    var enLinea=wfmRTAgentes.filter(function(a){return !!a.enLinea;}).length, total=wfmRTAgentes.length;
    var sEl=document.getElementById('wfmRTStats');
    if(sEl) sEl.innerHTML=
      '<div class="stat-chip activos"><div class="stat-chip-val">'+enLinea+'</div><div class="stat-chip-label">En línea</div></div>'
      +'<div class="stat-chip inactivos"><div class="stat-chip-val">'+(total-enLinea)+'</div><div class="stat-chip-label">Fuera</div></div>'
      +'<div class="stat-chip"><div class="stat-chip-val">'+total+'</div><div class="stat-chip-label">Total agentes</div></div>';

    Object.keys(wfmRTTimers).forEach(function(k){ clearInterval(wfmRTTimers[k]); });
    wfmRTTimers={};

    var countEl=document.getElementById('wfmRTCount');
    if(countEl) countEl.textContent=lista.length+' de '+total+' agentes';

    var grid=document.getElementById('wfmRTGrid'); if(!grid) return;
    if(lista.length===0){ grid.innerHTML='<div style="font-size:0.8rem;color:#94A3B8;grid-column:1/-1">Sin agentes para los filtros seleccionados.</div>'; return; }

    var html='';
    lista.forEach(function(a){
      var online=!!a.enLinea, estado=a.estadoActual||'Fuera', cfg=RT_ESTADOS[estado]||RT_ESTADOS['Fuera'];
      var pLabel=LABELS_PROY[a.proyecto]||'';
      html+='<div class="ac-card'+(online?'':' offline')+'">'
        +'<div class="ac-card-top">'
        +'<div class="ac-indicator '+(online?'on':'off')+'"></div>'
        +'<div class="ac-av '+(online?'online':'offline')+'">'+wfmInic(a.nombre||a.email||'?')+'</div>'
        +'<div style="min-width:0"><div class="ac-nombre">'+(a.nombre||a.email||'?')+'</div>'+(pLabel?'<div class="ac-proyecto">'+pLabel+'</div>':'')+'</div>'
        +'</div>'
        +(online
          ?'<div class="ac-estado-badge" style="background:'+cfg.bg+';color:'+cfg.text+'">'+estado+'</div>'
           +'<div class="ac-rt-timer" style="color:'+cfg.text+'" id="wrt-'+a.id+'">00:00:00</div>'
          :'<div class="ac-sin-marcaje">Sin entrada hoy</div>')
        +'</div>';
    });
    grid.innerHTML=html;

    lista.filter(function(a){return !!a.enLinea&&!!a.estadoDesde;}).forEach(function(a){
      wfmRTTimers[a.id]=setInterval(function(){
        var el=document.getElementById('wrt-'+a.id); if(!el){clearInterval(wfmRTTimers[a.id]);return;}
        var desde=a.estadoDesde.toDate?a.estadoDesde.toDate():new Date(a.estadoDesde);
        var seg=Math.floor((new Date()-desde)/1000);
        el.textContent=wfmPad(Math.floor(seg/3600))+':'+wfmPad(Math.floor((seg%3600)/60))+':'+wfmPad(seg%60);
      },1000);
    });

    var filtEl=document.getElementById('wfmRTFiltEst');
    if(filtEl){
      var estados={}, prevVal=filtEl.value;
      wfmRTAgentes.forEach(function(a){var e=a.estadoActual||'Fuera'; estados[e]=(estados[e]||0)+1;});
      filtEl.innerHTML='<option value="">Todos los estados</option>';
      Object.keys(estados).forEach(function(e){ filtEl.innerHTML+='<option value="'+e+'">'+e+' ('+estados[e]+')</option>'; });
      filtEl.value=prevVal;
    }
  }

  // ===== TURNO =====
  var wfmTurnoCargado = false;
  var wfmTurnoAgentes = [];
  var wfmTurnoSel     = null;
  var wfmTurnoDias    = {};
  var wfmTurnoMesVista= (function(){ var h=new Date(); return new Date(h.getFullYear(),h.getMonth(),1); })();
  var WFM_MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  function wfmIniciarTurno() {
    wfmTurnoCargado=true;
    db.collection('usuarios').where('rol','in',['agente','agente-inmersion','supervisor']).get()
      .then(function(snap){
        wfmTurnoAgentes=[];
        snap.forEach(function(doc){ wfmTurnoAgentes.push(Object.assign({id:doc.id},doc.data())); });
        wfmTurnoAgentes.sort(function(a,b){return (a.nombre||'').localeCompare(b.nombre||'','es');});
        wfmRenderTurnoLista();
      });
  }

  function wfmRenderTurnoLista() {
    var busq=((document.getElementById('wfmTurnoBusq')||{}).value||'').toLowerCase();
    var lista=wfmTurnoAgentes.filter(function(a){ return !busq||(a.nombre||'').toLowerCase().includes(busq)||(a.email||'').toLowerCase().includes(busq); });
    var html='';
    lista.forEach(function(a){
      html+='<div class="turno-agent-item'+(wfmTurnoSel===a.id?' active':'')+'" onclick="wfmVerTurno(\''+a.id+'\')">'
        +'<div class="ac-av online" style="width:28px;height:28px;font-size:0.62rem">'+wfmInic(a.nombre||a.email||'?')+'</div>'
        +'<div style="min-width:0"><div style="font-size:0.78rem;font-weight:600;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(a.nombre||a.email||'?')+'</div>'
        +'<div style="font-size:0.65rem;color:#94A3B8">'+(LABELS_PROY[a.proyecto]||a.proyecto||'—')+'</div></div>'
        +'</div>';
    });
    var el=document.getElementById('wfmTurnoLista');
    if(el) el.innerHTML=html||'<div style="font-size:0.8rem;color:#94A3B8">Sin resultados.</div>';
  }

  function wfmVerTurno(uid) {
    wfmTurnoSel=uid; wfmRenderTurnoLista();
    var a=wfmTurnoAgentes.find(function(x){return x.id===uid;}); if(!a) return;
    var det=document.getElementById('wfmTurnoDetalle'); if(!det) return;
    det.innerHTML='<div style="font-size:0.8rem;color:#94A3B8">Cargando turno...</div>';
    db.collection('turnos').doc(uid).get().then(function(doc){
      var d=doc.exists?doc.data():null;
      wfmTurnoDias=d?(d.dias||{}):wfmTurnoGenerarEjemplo();
      var nombre=d?(d.nombre||'Turno asignado'):'Sin turno asignado';
      var horario=d?(d.horario||'—'):'—';
      det.innerHTML=
        '<div style="font-size:0.78rem;font-weight:700;color:#0F2070;text-transform:uppercase;letter-spacing:.5px;padding-bottom:10px;border-bottom:2px solid #F1F5F9">'+escHtml(a.nombre||'Agente')+'</div>'
        +'<div class="dp-grid">'+dpField('Turno',escHtml(nombre))+dpField('Horario',escHtml(horario))+'</div>'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'
        +'<div id="wfmTurnoCalMes" style="font-size:0.82rem;font-weight:700;color:#1E293B"></div>'
        +'<div style="display:flex;gap:4px">'
        +'<button onclick="wfmTurnoCambiarMes(-1)" class="btn-dir" style="width:26px;height:26px">&#8249;</button>'
        +'<button onclick="wfmTurnoIrHoy()" class="btn-dir" style="width:auto;padding:0 8px;font-size:0.68rem">Hoy</button>'
        +'<button onclick="wfmTurnoCambiarMes(1)" class="btn-dir" style="width:26px;height:26px">&#8250;</button>'
        +'</div></div>'
        +'<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:0.62rem;color:#94A3B8;text-align:center;margin-bottom:3px">'
        +['D','L','M','X','J','V','S'].map(function(d){return '<div>'+d+'</div>';}).join('')
        +'</div>'
        +'<div class="cal-grid" id="wfmTurnoCal"></div>'
        +'<div style="display:flex;gap:12px;margin-top:10px;font-size:0.72rem;color:#64748B">'
        +'<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#EEF2FF;border:1px solid #C7D2FE"></div>Laboral</div>'
        +'<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#F1F5F9;border:1px solid #E2E8F0"></div>Descanso</div>'
        +'</div>';
      wfmTurnoRenderCal();
    });
  }

  function wfmTurnoGenerarEjemplo() {
    var dias={}, hoy=new Date(), d=new Date(hoy.getFullYear(),0,1), fin=new Date(hoy.getFullYear(),11,31);
    while(d<=fin){ var dow=d.getDay(); var key=d.getFullYear()+'-'+wfmPad(d.getMonth()+1)+'-'+wfmPad(d.getDate()); dias[key]=(dow>=1&&dow<=5)?'laboral':'descanso'; d.setDate(d.getDate()+1); }
    return dias;
  }

  function wfmTurnoRenderCal() {
    var hoy=new Date(), año=wfmTurnoMesVista.getFullYear(), mes=wfmTurnoMesVista.getMonth();
    var primerDia=new Date(año,mes,1).getDay(), totalDias=new Date(año,mes+1,0).getDate();
    var calMesEl=document.getElementById('wfmTurnoCalMes');
    if(calMesEl) calMesEl.textContent=WFM_MESES[mes]+' '+año;
    var html='';
    for(var i=0;i<primerDia;i++) html+='<div class="cal-dia vacio"></div>';
    for(var d=1;d<=totalDias;d++){
      var fecha=año+'-'+wfmPad(mes+1)+'-'+wfmPad(d);
      var tipo=wfmTurnoDias[fecha]||'descanso';
      var esHoy=año===hoy.getFullYear()&&mes===hoy.getMonth()&&d===hoy.getDate();
      html+='<div class="cal-dia '+tipo+(esHoy?' hoy':'')+'"><span class="dia-num">'+d+'</span><span class="dia-tag">'+(tipo==='laboral'?'L':'D')+'</span></div>';
    }
    var calEl=document.getElementById('wfmTurnoCal'); if(calEl) calEl.innerHTML=html;
  }

  function wfmTurnoCambiarMes(dir){ wfmTurnoMesVista.setMonth(wfmTurnoMesVista.getMonth()+dir); wfmTurnoRenderCal(); }
  function wfmTurnoIrHoy(){ var h=new Date(); wfmTurnoMesVista=new Date(h.getFullYear(),h.getMonth(),1); wfmTurnoRenderCal(); }
</script>
<script src="notif.js"></script>
<script>
  auth.onAuthStateChanged(function(user) {
    if (user) initNotif(db, auth);
  });
</script>
