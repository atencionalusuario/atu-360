<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — Usuarios</title>
<base href="/atu-360/">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="base.css">
<style>
  .sidebar { position: sticky; top: 0; height: 100vh; overflow-y: auto; }

  /* LAYOUT */
  .body-wrap   { display: flex; flex: 1; overflow: hidden; }
  .table-area  { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 20px 24px; gap: 14px; min-width: 0; }

  /* STATS */
  .stats-row       { display: flex; gap: 10px; flex-shrink: 0; align-items: center; justify-content: space-between; }
  .stat-chip       { background: white; border: 1px solid #E2E8F0; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; cursor: default; }
  .stat-chip.clickable { cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
  .stat-chip.clickable:hover { border-color: #CBD5E1; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .stat-chip.selected { border-color: #1A3DAA; box-shadow: 0 0 0 2px rgba(26,61,170,0.12); }
  .stat-chip-val   { font-size: 1.3rem; font-weight: 800; color: #1A3DAA; line-height: 1; }
  .stat-chip-label { font-size: 0.68rem; color: #94A3B8; font-weight: 500; }
  .stat-chip.activos   .stat-chip-val { color: #16A34A; }
  .stat-chip.inactivos .stat-chip-val { color: #DC2626; }

  /* CONTROLES */
  .controles   { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .ctrl-input  { padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; width: 200px; }
  .ctrl-input:focus  { border-color: #1A3DAA; }
  .ctrl-select { padding: 8px 10px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; cursor: pointer; }
  .ctrl-select:focus { border-color: #1A3DAA; }
  .ctrl-sep    { width: 1px; height: 28px; background: #E2E8F0; margin: 0 4px; }
  .sort-group  { display: flex; align-items: center; gap: 6px; }
  .sort-label  { font-size: 0.72rem; font-weight: 600; color: #64748B; white-space: nowrap; }
  .btn-dir     { width: 30px; height: 30px; border: 1.5px solid #E2E8F0; border-radius: 6px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #64748B; }
  .btn-dir.asc::after  { content: '↑'; }
  .btn-dir.desc::after { content: '↓'; }
  .btn-accion  { padding: 8px 14px; border-radius: 7px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; border: 1.5px solid #E2E8F0; background: white; color: #374151; }
  .btn-accion.primary  { background: #1A3DAA; color: white; border-color: #1A3DAA; }
  .btn-accion.primary:hover { opacity: 0.88; }
  .tb-search { position: relative; display: flex; align-items: center; flex: 1; margin-left: 16px; }
  .tb-search svg { position: absolute; left: 12px; color: #94A3B8; pointer-events: none; display: block; flex-shrink: 0; }
  .tb-search input { padding: 8px 14px 8px 42px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; width: 100%; transition: border-color 0.2s; }
  .tb-search input:focus { border-color: #1A3DAA; }
  .tb-search input::placeholder { color: #94A3B8; }

  /* TABLA */
  .tabla-wrap  { flex: 1; overflow: auto; background: white; border-radius: 10px; border: 1px solid #E2E8F0; }
  table        { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  thead        { position: sticky; top: 0; z-index: 2; }
  thead tr     { background: #F8FAFC; }
  th           { padding: 10px 14px; text-align: left; font-size: 0.65rem; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
  th.sortable  { cursor: pointer; user-select: none; }
  th.sortable:hover   { color: #1A3DAA; }
  th.sort-asc::after  { content: ' ↑'; color: #1A3DAA; }
  th.sort-desc::after { content: ' ↓'; color: #1A3DAA; }
  th.sort-sec-asc::after  { content: ' ↑'; color: #94A3B8; font-size: 0.6rem; }
  th.sort-sec-desc::after { content: ' ↓'; color: #94A3B8; font-size: 0.6rem; }
  .filter-row th  { padding: 6px 8px; background: #F1F5F9; }
  .cf-select      { width: 100%; padding: 5px 8px; border: 1.5px solid #E2E8F0; border-radius: 5px; font-size: 0.72rem; font-family: inherit; color: #1E293B; background: white; outline: none; }
  .cf-select:focus { border-color: #1A3DAA; }
  tbody tr        { border-bottom: 1px solid #F1F5F9; transition: background 0.1s; cursor: pointer; }
  tbody tr:last-child  { border-bottom: none; }
  tbody tr:hover       { background: #F8FAFC; }
  tbody tr.selected    { background: #EEF2FF; }
  tbody tr.inactivo td { opacity: 0.5; }
  td              { padding: 10px 14px; color: #374151; vertical-align: middle; }
  .td-user        { display: flex; align-items: center; gap: 9px; }
  .td-avatar      { width: 28px; height: 28px; border-radius: 50%; background: #1A3DAA; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; color: white; font-weight: 700; flex-shrink: 0; }
  .td-nombre      { font-weight: 600; color: #1E293B; white-space: nowrap; }
  .td-email       { font-size: 0.7rem; color: #94A3B8; }
  .tag            { font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; white-space: nowrap; }
  .tag.agente     { background: #EEF2FF; color: #1A3DAA; }
  .tag.supervisor { background: #F0FDF4; color: #16A34A; }
  .tag.formacion  { background: #F5F3FF; color: #7C3AED; }
  .tag.admin      { background: #FFF7ED; color: #C2410C; }
  .tag.wfm, .tag.jefe { background: #F0F9FF; color: #0284C7; }
  .tag.doctorsv   { background: #EEF2FF; color: #3730A3; }
  .tag.educacion  { background: #F0FDF4; color: #15803D; }
  .tag.marn       { background: #FFFBEB; color: #B45309; }
  .tag.global     { background: #F1F5F9; color: #475569; }
  .tag.activo     { background: #F0FDF4; color: #16A34A; }
  .tag.inactivo   { background: #FEF2F2; color: #DC2626; }
  .tag.si         { background: #F0F9FF; color: #0284C7; }
  .tag.no         { background: #F1F5F9; color: #94A3B8; }
  .td-mono        { font-variant-numeric: tabular-nums; font-size: 0.75rem; }
  .no-resultados  { text-align: center; padding: 48px; color: #94A3B8; font-size: 0.82rem; }

  /* PANEL DETALLE */
  .detail-panel      { width: 0; flex-shrink: 0; overflow: hidden; transition: width 0.25s ease; background: white; border-left: 1px solid #E2E8F0; display: flex; flex-direction: column; }
  .detail-panel.open { width: 380px; }
  .dp-header         { padding: 18px 20px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-shrink: 0; }
  .dp-header-info    { display: flex; align-items: center; gap: 10px; }
  .dp-avatar         { width: 40px; height: 40px; border-radius: 50%; background: #1A3DAA; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; color: white; font-weight: 700; flex-shrink: 0; }
  .dp-nombre         { font-size: 0.88rem; font-weight: 700; color: #1E293B; }
  .dp-sub            { font-size: 0.68rem; color: #94A3B8; margin-top: 3px; display: flex; gap: 4px; flex-wrap: wrap; }
  .btn-close         { width: 28px; height: 28px; border: none; background: #F1F5F9; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #64748B; flex-shrink: 0; }
  .btn-close:hover   { background: #E2E8F0; }
  .dp-body           { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  .dp-section-title  { font-size: 0.62rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #F1F5F9; }
  .dp-field          { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
  .dp-label          { font-size: 0.65rem; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
  .dp-val            { font-size: 0.8rem; color: #1E293B; font-weight: 500; }
  .dp-grid           { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .dp-footer         { padding: 14px 20px; border-top: 1px solid #F1F5F9; display: flex; gap: 8px; flex-shrink: 0; }
  .btn-sec           { padding: 8px 14px; border: 1.5px solid #E2E8F0; border-radius: 7px; background: white; font-size: 0.78rem; font-weight: 600; color: #374151; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-sec:hover     { border-color: #CBD5E1; }
  .btn-pri-sm        { padding: 8px 14px; border: none; border-radius: 7px; background: #1A3DAA; color: white; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-pri-sm:hover  { opacity: 0.88; }
  .btn-danger        { padding: 8px 14px; border: 1px solid #FECACA; border-radius: 7px; background: #FEF2F2; color: #DC2626; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit; flex: 1; }
  .btn-danger:hover  { background: #FEE2E2; }

  /* MODAL FORMULARIO */
  .modal-overlay    { position: fixed; inset: 0; background: rgba(15,32,112,0.35); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(3px); }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal            { background: white; border-radius: 12px; width: 620px; max-width: 96vw; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
  .modal-header     { padding: 20px 24px; border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .modal-title      { font-size: 0.92rem; font-weight: 700; color: #1E293B; }
  .modal-sub        { font-size: 0.72rem; color: #94A3B8; margin-top: 2px; }
  .modal-body       { padding: 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
  .modal-footer     { padding: 14px 24px; border-top: 1px solid #F1F5F9; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .modal-footer-left  { font-size: 0.72rem; color: #94A3B8; }
  .modal-footer-right { display: flex; gap: 8px; }
  .form-section-title { font-size: 0.65rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; padding-bottom: 7px; border-bottom: 1px solid #F1F5F9; }
  .form-grid        { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field            { display: flex; flex-direction: column; gap: 5px; }
  .field-full       { grid-column: 1 / -1; }
  label             { font-size: 0.72rem; font-weight: 600; color: #374151; }
  .field-req        { color: #DC2626; }
  input[type="text"], input[type="email"], input[type="date"], input[type="number"], select {
    padding: 9px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px;
    font-size: 0.82rem; color: #1E293B; background: #F8FAFC; outline: none;
    transition: border 0.2s; font-family: inherit; width: 100%;
  }
  input:focus, select:focus { border-color: #1A3DAA; box-shadow: 0 0 0 3px rgba(26,61,170,0.07); background: white; }
  input[readonly]   { background: #F1F5F9; color: #94A3B8; cursor: not-allowed; }

  /* MODAL CONFIRMACIÓN */
  .confirm-modal  { background: white; border-radius: 12px; padding: 28px; width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
  .confirm-title  { font-size: 0.92rem; font-weight: 700; color: #1E293B; margin-bottom: 8px; }
  .confirm-sub    { font-size: 0.8rem; color: #64748B; line-height: 1.6; margin-bottom: 20px; }
  .confirm-btns   { display: flex; gap: 8px; justify-content: flex-end; }

  /* MODAL CSV */
  .csv-modal      { background: white; border-radius: 12px; width: 720px; max-width: 96vw; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,0.15); }
  .preview-table  { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
  .preview-table th { background: #F8FAFC; padding: 7px 10px; text-align: left; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
  .preview-table td { padding: 7px 10px; border-bottom: 1px solid #F8FAFC; color: #374151; }
  .preview-table tr.error-row td { background: #FEF2F2; }
  .badge-ok  { background: #F0FDF4; color: #16A34A; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; }
  .badge-err { background: #FEF2F2; color: #DC2626; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <h2 style="font-size:0.9rem;font-weight:600">Usuarios</h2>
      <span class="topbar-sep">/</span>
      <p class="tb-page-sub" id="totalLabel">—</p>
    </div>
    <div class="topbar-right">
      <div class="tb-clock" id="clock">--:--:--</div>
      <button class="btn-accion" onclick="descargarPlantilla()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Plantilla CSV
      </button>
      <button class="btn-accion" onclick="document.getElementById('csvInput').click()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Carga masiva
      </button>
      <button class="btn-accion primary" id="btnNuevo">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuevo usuario
      </button>
      <input type="file" id="csvInput" accept=".csv" style="display:none">
    </div>
  </div>

  <!-- CUERPO -->
  <div class="body-wrap">
    <div class="table-area">

      <!-- STATS -->
      <div class="stats-row">
        <div style="display:flex;gap:10px;">
          <div class="stat-chip">
            <div class="stat-chip-val" id="statTotal">—</div>
            <div class="stat-chip-label">Total usuarios</div>
          </div>
          <div class="stat-chip activos clickable selected" id="chipActivos" onclick="filtrarEstado('activo')">
            <div class="stat-chip-val" id="statActivos">—</div>
            <div class="stat-chip-label">Activos</div>
          </div>
          <div class="stat-chip inactivos clickable" id="chipInactivos" onclick="filtrarEstado('inactivo')">
            <div class="stat-chip-val" id="statInactivos">—</div>
            <div class="stat-chip-label">Inactivos</div>
          </div>
        </div>
        <div class="tb-search">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Buscar usuario..." oninput="document.getElementById('busqueda').value=this.value;aplicarFiltros()">
        </div>
      </div>

      <!-- inputs ocultos para mantener compatibilidad con aplicarFiltros() -->
      <input type="hidden" id="busqueda" value="">
      <select id="filtroProyecto" style="display:none"><option value=""></option></select>
      <select id="filtroRol" style="display:none"><option value=""></option></select>
      <select id="filtroEstado" style="display:none"><option value="activo">Activos</option></select>
      <select id="sort1" style="display:none"><option value="nombre">Nombre</option></select>
      <select id="sort2" style="display:none"><option value=""></option></select>
      <button id="btnDir1" class="btn-dir asc" style="display:none"></button>
      <button id="btnDir2" class="btn-dir asc" style="display:none"></button>

      <!-- TABLA -->
      <div class="tabla-wrap">
        <table id="tablaUsuarios">
          <thead>
            <tr>
              <th class="sortable" data-col="nombre"       onclick="sortByCol('nombre')">Usuario</th>
              <th class="sortable" data-col="cargo"        onclick="sortByCol('cargo')">Cargo</th>
              <th class="sortable" data-col="proyecto"     onclick="sortByCol('proyecto')">Proyecto</th>
              <th class="sortable" data-col="rol"          onclick="sortByCol('rol')">Rol</th>
              <th>Canal</th>
              <th class="sortable" data-col="supervisor"   onclick="sortByCol('supervisor')">Supervisor</th>
              <th class="sortable" data-col="fechaIngreso" onclick="sortByCol('fechaIngreso')">Ingreso</th>
              <th class="sortable" data-col="antiguedad"   onclick="sortByCol('antiguedad')">Antigüedad</th>
              <th>Vehículo</th>
              <th class="sortable" data-col="estado"       onclick="sortByCol('estado')">Estado</th>
            </tr>
            <tr class="filter-row">
              <th><select class="cf-select" id="cfNombre"     onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfCargo"      onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfProyecto"   onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfRol"        onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfCanal"      onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfSupervisor" onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th></th><th></th>
              <th><select class="cf-select" id="cfVehiculo"   onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
              <th><select class="cf-select" id="cfEstado"     onchange="aplicarFiltros()"><option value="">Todos</option></select></th>
            </tr>
          </thead>
          <tbody id="tbodyUsuarios"></tbody>
        </table>
      </div>
    </div>

    <!-- PANEL DETALLE -->
    <div class="detail-panel" id="detailPanel">
      <div class="dp-header">
        <div class="dp-header-info">
          <div class="dp-avatar" id="dpAvatar">--</div>
          <div>
            <div class="dp-nombre" id="dpNombre">—</div>
            <div class="dp-sub"    id="dpSub"></div>
          </div>
        </div>
        <button class="btn-close" onclick="cerrarPanel()">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="dp-body"   id="dpBody"></div>
      <div class="dp-footer" id="dpFooter"></div>
    </div>
  </div>
</div>

<!-- Modal formulario -->
<div class="modal-overlay" id="modalForm">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="formTitle">Nuevo usuario</div>
        <div class="modal-sub"   id="formSub">Completa los campos requeridos</div>
      </div>
      <button class="btn-close" onclick="cerrarModalForm()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="formBody"></div>
    <div class="modal-footer">
      <span class="modal-footer-left" id="formFooterLeft"></span>
      <div class="modal-footer-right">
        <button class="btn-sec"   style="flex:unset;padding:9px 18px" onclick="cerrarModalForm()">Cancelar</button>
        <button class="btn-pri-sm" style="flex:unset;padding:9px 18px" id="btnGuardar" onclick="guardarUsuario()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal confirmación -->
<div class="modal-overlay" id="modalConfirm">
  <div class="confirm-modal">
    <div class="confirm-title" id="confirmTitle">Confirmar</div>
    <div class="confirm-sub"   id="confirmSub"></div>
    <div class="confirm-btns">
      <button class="btn-sec"    style="flex:unset;padding:9px 18px" onclick="cerrarConfirm()">Cancelar</button>
      <button class="btn-danger" style="flex:unset;padding:9px 18px" id="confirmBtn">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal CSV -->
<div class="modal-overlay" id="modalCsv">
  <div class="csv-modal">
    <div class="modal-header">
      <div>
        <div class="modal-title">Carga masiva de usuarios</div>
        <div class="modal-sub" id="csvResumen"></div>
      </div>
      <button class="btn-close" onclick="cerrarModalCsv()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:0 24px 16px;overflow-y:auto;flex:1;max-height:420px" id="csvPreview"></div>

      <span class="modal-footer-left"></span>
      <div class="modal-footer-right">
        <button class="btn-sec"    style="flex:unset;padding:9px 18px" onclick="cerrarModalCsv()">Cancelar</button>
        <button class="btn-pri-sm" style="flex:unset;padding:9px 18px" id="btnConfirmarCsv" onclick="confirmarCarga()">Crear usuarios</button>
      </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  var BASE = 'https://atencionalusuario.github.io/atu-360/';

  var FB_CONFIG = {
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  };
  firebase.initializeApp(FB_CONFIG);
  var secondaryApp  = firebase.initializeApp(FB_CONFIG, 'secondary');
  var auth          = firebase.auth();
  var db            = firebase.firestore();
  var authSecondary = secondaryApp.auth();
  var currentUser   = null;

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var ROLES_PERMITIDOS = ['jefe','wfm','admin','superadmin'];

  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = BASE + 'login.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      if (!doc.exists || !ROLES_PERMITIDOS.includes(doc.data().rol)) {
        auth.signOut(); window.location.href = BASE + 'login.html'; return;
      }
      currentUser = user;
      cargarUsuarios();
    });
  });

  // ── Variables ────────────────────────────────────────────────────────────────
  var usuarios          = [];
  var usuarioSeleccionado = null;
  var modoForm          = null;
  var dir1 = 'asc', dir2 = 'asc';

  var LABELS_ROL  = { agente:'Agente', 'agente-inmersion':'Agente Inmersión', supervisor:'Supervisor', formacion:'Formación', admin:'Admin', wfm:'WFM', jefe:'Jefe', superadmin:'Superadmin' };
  var LABELS_PROY = { doctorsv:'DoctorSV', educacion:'Educación', marn:'MARN', global:'Global' };

  // ── Carga ────────────────────────────────────────────────────────────────────
  function cargarUsuarios() {
    db.collection('usuarios').orderBy('nombre','asc').onSnapshot(function(snap) {
      usuarios = [];
      snap.forEach(function(doc) {
        var d = doc.data();
        if (d.rol === 'superadmin') return;
        usuarios.push(Object.assign({ id: doc.id }, d));
      });
      poblarFiltrosColumna();
      aplicarFiltros();
      if (usuarioSeleccionado) {
        var u = usuarios.find(function(x){ return x.id === usuarioSeleccionado; });
        if (u) abrirPanel(u);
      }
    }, function(err){ console.error(err); showToast('Error al cargar usuarios.'); });
  }

  // ── Filtros columna ──────────────────────────────────────────────────────────
  function poblarDropdownColumna(id, valores, labelFn) {
    var sel = document.getElementById(id); if (!sel) return;
    var actual = sel.value;
    sel.innerHTML = '<option value="">Todos</option>';
    valores.sort(function(a,b){ return (a+'').localeCompare(b+'','es'); }).forEach(function(v){
      var opt = document.createElement('option');
      opt.value = v; opt.textContent = labelFn ? labelFn(v) : v;
      sel.appendChild(opt);
    });
    if (actual) sel.value = actual;
  }

  function poblarFiltrosColumna() {
    var uniq = function(arr){ var s={}; arr.forEach(function(v){ if(v) s[v]=1; }); return Object.keys(s); };
    poblarDropdownColumna('cfNombre',     uniq(usuarios.map(function(u){ return u.nombre; })));
    poblarDropdownColumna('cfCargo',      uniq(usuarios.map(function(u){ return u.cargo||''; })));
    poblarDropdownColumna('cfProyecto',   uniq(usuarios.map(function(u){ return u.proyecto; })), function(v){ return LABELS_PROY[v]||v; });
    poblarDropdownColumna('cfRol',        uniq(usuarios.map(function(u){ return u.rol; })),      function(v){ return LABELS_ROL[v]||v; });
    poblarDropdownColumna('cfCanal',      uniq(usuarios.map(function(u){ return u.canal||''; })));
    poblarDropdownColumna('cfSupervisor', uniq(usuarios.map(function(u){ return u.supervisor||''; })));
    poblarDropdownColumna('cfVehiculo',   ['si','no'], function(v){ return v==='si'?'Sí':'No'; });
    poblarDropdownColumna('cfEstado',     ['activo','inactivo'], function(v){ return v==='activo'?'Activo':'Inactivo'; });
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function iniciales(n){ return n.split(' ').map(function(w){return w[0];}).join('').substring(0,2).toUpperCase(); }
  function diasDesde(f){ if(!f) return 0; return Math.floor((new Date()-new Date(f))/(1000*60*60*24)); }
  function fmtAntiguedad(d){
    if(d<30) return d+' días';
    if(d<365) return Math.floor(d/30)+' meses';
    var a=Math.floor(d/365), m=Math.floor((d%365)/30);
    return a+'a '+(m>0?m+'m':'');
  }
  function fmtFecha(f){ if(!f) return '—'; var p=f.split('-'); return p[2]+'/'+p[1]+'/'+p[0].substring(2); }

  // ── Ordenar ──────────────────────────────────────────────────────────────────
  function toggleDir(n){
    if(n===1){ dir1=dir1==='asc'?'desc':'asc'; document.getElementById('btnDir1').className='btn-dir '+dir1; }
    else     { dir2=dir2==='asc'?'desc':'asc'; document.getElementById('btnDir2').className='btn-dir '+dir2; }
    aplicarFiltros();
  }
  function sortByCol(col){
    var s1=document.getElementById('sort1'), s2=document.getElementById('sort2');
    if(s1.value===col){ toggleDir(1); return; }
    if(s2.value===col){ toggleDir(2); return; }
    s1.value=col; aplicarFiltros();
  }

  // ── Filtrar / renderizar ──────────────────────────────────────────────────────
  function filtrarEstado(val) {
    document.getElementById('filtroEstado').value = val;
    document.getElementById('chipActivos').classList.toggle('selected', val === 'activo');
    document.getElementById('chipInactivos').classList.toggle('selected', val === 'inactivo');
    aplicarFiltros();
  }

  function aplicarFiltros(){
    var busq = document.getElementById('busqueda').value.toLowerCase();
    var proy = document.getElementById('filtroProyecto').value;
    var rol  = document.getElementById('filtroRol').value;
    var est  = document.getElementById('filtroEstado').value;
    var c1   = document.getElementById('sort1').value;
    var c2   = document.getElementById('sort2').value;
    var cf   = {};
    ['cfNombre','cfCargo','cfProyecto','cfRol','cfCanal','cfSupervisor','cfVehiculo','cfEstado'].forEach(function(id){
      cf[id] = (document.getElementById(id)||{value:''}).value;
    });

    var lista = usuarios.filter(function(u){
      if(busq && !u.nombre.toLowerCase().includes(busq) && !u.email.toLowerCase().includes(busq) && !(u.cargo||'').toLowerCase().includes(busq)) return false;
      if(proy && u.proyecto!==proy) return false;
      if(rol  && u.rol!==rol)       return false;
      if(est  && (est==='activo'?!u.activo:u.activo)) return false;
      if(cf.cfNombre     && u.nombre!==cf.cfNombre) return false;
      if(cf.cfCargo      && (u.cargo||'')!==cf.cfCargo) return false;
      if(cf.cfProyecto   && u.proyecto!==cf.cfProyecto) return false;
      if(cf.cfRol        && u.rol!==cf.cfRol) return false;
      if(cf.cfCanal      && (u.canal||'')!==cf.cfCanal) return false;
      if(cf.cfSupervisor && (u.supervisor||'')!==cf.cfSupervisor) return false;
      if(cf.cfVehiculo   && (cf.cfVehiculo==='si'?!u.vehiculo:u.vehiculo)) return false;
      if(cf.cfEstado     && (cf.cfEstado==='activo'?!u.activo:u.activo)) return false;
      return true;
    });

    lista.forEach(function(u){ u.diasIngreso=diasDesde(u.fechaIngreso); });
    function getVal(u,campo){
      if(campo==='estado') return u.activo?1:0;
      if(campo==='antiguedad') return u.diasIngreso;
      return u[campo]||'';
    }
    lista.sort(function(a,b){
      var va=getVal(a,c1),vb=getVal(b,c1);
      var cmp=typeof va==='number'?va-vb:(va+'').localeCompare(vb+'','es');
      if(dir1==='desc') cmp=-cmp;
      if(cmp!==0||!c2) return cmp;
      var va2=getVal(a,c2),vb2=getVal(b,c2);
      var cmp2=typeof va2==='number'?va2-vb2:(va2+'').localeCompare(vb2+'','es');
      return dir2==='desc'?-cmp2:cmp2;
    });

    document.querySelectorAll('th[data-col]').forEach(function(th){
      th.className='sortable';
      if(th.dataset.col===c1) th.className+=(dir1==='asc'?' sort-asc':' sort-desc');
      else if(c2&&th.dataset.col===c2) th.className+=(dir2==='asc'?' sort-sec-asc':' sort-sec-desc');
    });
    renderTabla(lista);
  }

  function renderTabla(lista){
    var total=usuarios.length, activos=usuarios.filter(function(u){return u.activo;}).length;
    document.getElementById('statTotal').textContent    = total;
    document.getElementById('statActivos').textContent  = activos;
    document.getElementById('statInactivos').textContent= total-activos;
    document.getElementById('totalLabel').textContent   = lista.length+' de '+total+' usuarios';

    if(lista.length===0){
      document.getElementById('tbodyUsuarios').innerHTML='<tr><td colspan="10" class="no-resultados">Sin resultados para los filtros aplicados</td></tr>';
      return;
    }
    var html='';
    lista.forEach(function(u){
      var dias=diasDesde(u.fechaIngreso);
      html+='<tr class="'+(u.activo?'':'inactivo')+(usuarioSeleccionado===u.id?' selected':'')+'" onclick="seleccionarUsuario(\''+u.id+'\')">'
        +'<td><div class="td-user"><div class="td-avatar">'+iniciales(u.nombre)+'</div>'
        +'<div><div class="td-nombre">'+u.nombre+'</div><div class="td-email">'+u.email+'</div></div></div></td>'
        +'<td>'+(u.cargo||'—')+'</td>'
        +'<td><span class="tag '+u.proyecto+'">'+( LABELS_PROY[u.proyecto]||u.proyecto)+'</span></td>'
        +'<td><span class="tag '+u.rol+'">'+( LABELS_ROL[u.rol]||u.rol)+'</span></td>'
        +'<td>'+(u.canal||'—')+'</td>'
        +'<td>'+(u.supervisor||'—')+'</td>'
        +'<td class="td-mono">'+fmtFecha(u.fechaIngreso)+'</td>'
        +'<td class="td-mono">'+fmtAntiguedad(dias)+'</td>'
        +'<td><span class="tag '+(u.vehiculo?'si':'no')+'">'+(u.vehiculo?'Sí':'No')+'</span></td>'
        +'<td><span class="tag '+(u.activo?'activo':'inactivo')+'">'+(u.activo?'Activo':'Inactivo')+'</span></td>'
        +'</tr>';
    });
    document.getElementById('tbodyUsuarios').innerHTML=html;
  }

  // ── Panel detalle ─────────────────────────────────────────────────────────────
  function seleccionarUsuario(id){
    usuarioSeleccionado=id;
    var u=usuarios.find(function(x){return x.id===id;}); if(!u) return;
    aplicarFiltros(); abrirPanel(u);
  }

  function dpField(label,val){
    return '<div class="dp-field"><div class="dp-label">'+label+'</div><div class="dp-val">'+val+'</div></div>';
  }

  function abrirPanel(u){
    var dias=diasDesde(u.fechaIngreso);
    document.getElementById('dpAvatar').textContent=iniciales(u.nombre);
    document.getElementById('dpNombre').textContent=u.nombre;
    document.getElementById('dpSub').innerHTML=
      '<span class="tag '+u.rol+'">'+(LABELS_ROL[u.rol]||u.rol)+'</span>'
      +'<span class="tag '+u.proyecto+'">'+(LABELS_PROY[u.proyecto]||u.proyecto)+'</span>'
      +(u.activo?'':'<span class="tag inactivo">Inactivo</span>');

    document.getElementById('dpBody').innerHTML=
      '<div><div class="dp-section-title">Personal</div><div class="dp-grid">'
      +dpField('Documento',u.documento||'—')+dpField('Teléfono',u.telefono||'—')
      +dpField('Correo',u.email)+dpField('Cargo',u.cargo||'—')
      +'</div></div>'
      +'<div><div class="dp-section-title">Operativo</div><div class="dp-grid">'
      +dpField('Canal',u.canal||'—')+dpField('Supervisor',u.supervisor||'—')
      +dpField('Fecha ingreso',fmtFecha(u.fechaIngreso))+dpField('Antigüedad',fmtAntiguedad(dias))
      +'</div></div>'
      +(u.vehiculo?'<div><div class="dp-section-title">Vehículo</div><div class="dp-grid">'
        +dpField('Tipo',u.tipoVehiculo||'—')+dpField('Placa',u.placa||'—')
        +dpField('Marca',u.marca||'—')+dpField('Modelo',u.modelo||'—')
        +'</div></div>':'');

    document.getElementById('dpFooter').innerHTML=
      '<button class="btn-sec" onclick="abrirModalForm(\''+u.id+'\')">Editar</button>'
      +(u.activo
        ?'<button class="btn-danger" onclick="pedirConfirm(\''+u.id+'\',false)">Desactivar</button>'
        :'<button class="btn-pri-sm" onclick="cambiarEstado(\''+u.id+'\',true)">Activar</button>')
      +'<button class="btn-danger" onclick="pedirEliminar(\''+u.id+'\')" style="margin-left:auto">Eliminar</button>';

    document.getElementById('detailPanel').classList.add('open');
  }

  function cerrarPanel(){
    document.getElementById('detailPanel').classList.remove('open');
    usuarioSeleccionado=null; aplicarFiltros();
  }

  // ── Modal formulario ──────────────────────────────────────────────────────────
  document.getElementById('btnNuevo').addEventListener('click', function(){ abrirModalForm(null); });

  function opt(val,cur){ return '<option value="'+val+'"'+(cur===val?' selected':'')+'>'+val+'</option>'; }

  function supervisores(){ return usuarios.filter(function(u){ return u.rol==='supervisor'||u.rol==='jefe'; }); }
  function supNombre(){ var id=g('fSupervisor'); var s=usuarios.find(function(u){return u.id===id;}); return s?s.nombre||'':''; }
  function supEmail() { var id=g('fSupervisor'); var s=usuarios.find(function(u){return u.id===id;}); return s?s.email||'':''; }
  function g(id){ var el=document.getElementById(id); return el?el.value.trim():''; }

  function abrirModalForm(id){
    modoForm=id?'editar':'nuevo';
    var u=id?usuarios.find(function(x){return x.id===id;}):null;
    document.getElementById('formTitle').textContent=u?'Editar usuario':'Nuevo usuario';
    document.getElementById('formSub').textContent  =u?u.email:'Completa los campos requeridos';
    document.getElementById('formFooterLeft').innerHTML=(!u)?'Contraseña inicial: <strong>ATU360*</strong>':'';
    document.getElementById('btnGuardar').textContent=u?'Guardar cambios':'Crear usuario';
    var veh=u&&u.vehiculo;
    document.getElementById('formBody').innerHTML=
      '<div><div class="form-section-title">Información personal</div><div class="form-grid">'
      +'<div class="field"><label>Nombre completo <span class="field-req">*</span></label><input type="text" id="fNombre" value="'+(u?u.nombre:'')+'" placeholder="Nombre completo"></div>'
      +'<div class="field"><label>Documento <span class="field-req">*</span></label><input type="text" id="fDocumento" value="'+(u?u.documento||'':'')+'" placeholder="00000000-0"></div>'
      +'<div class="field"><label>Correo <span class="field-req">*</span></label><input type="email" id="fEmail" value="'+(u?u.email:'')+'" placeholder="usuario@proyecto.com"'+(u?' readonly':'')+' ></div>'
      +'<div class="field"><label>Teléfono</label><input type="text" id="fTelefono" value="'+(u?u.telefono||'':'')+'" placeholder="0000-0000"></div>'
      +'</div></div>'
      +'<div><div class="form-section-title">Información operativa</div><div class="form-grid">'
      +'<div class="field"><label>Cargo <span class="field-req">*</span></label><input type="text" id="fCargo" value="'+(u?u.cargo||'':'')+'" placeholder="Agente de atención"></div>'
      +'<div class="field"><label>Canal</label><select id="fCanal"><option value="">— Selecciona —</option>'
      +opt('Telefónico',u&&u.canal)+opt('Chat',u&&u.canal)+opt('Email',u&&u.canal)+opt('Presencial',u&&u.canal)+opt('Otro',u&&u.canal)
      +'</select></div>'
      +'<div class="field"><label>Proyecto <span class="field-req">*</span></label><select id="fProyecto"><option value="">— Selecciona —</option>'
      +'<option value="doctorsv"'+(u&&u.proyecto==='doctorsv'?' selected':'')+'>DoctorSV</option>'
      +'<option value="educacion"'+(u&&u.proyecto==='educacion'?' selected':'')+'>Educación</option>'
      +'<option value="marn"'+(u&&u.proyecto==='marn'?' selected':'')+'>MARN</option>'
      +'<option value="global"'+(u&&u.proyecto==='global'?' selected':'')+'>Global</option>'
      +'</select></div>'
      +'<div class="field"><label>Rol <span class="field-req">*</span></label><select id="fRol"><option value="">— Selecciona —</option>'
      +'<option value="agente"'+(u&&u.rol==='agente'?' selected':'')+'>Agente</option>'
      +'<option value="agente-inmersion"'+(u&&u.rol==='agente-inmersion'?' selected':'')+'>Agente Inmersión</option>'
      +'<option value="supervisor"'+(u&&u.rol==='supervisor'?' selected':'')+'>Supervisor</option>'
      +'<option value="formacion"'+(u&&u.rol==='formacion'?' selected':'')+'>Formación</option>'
      +'<option value="admin"'+(u&&u.rol==='admin'?' selected':'')+'>Admin</option>'
      +'<option value="jefe"'+(u&&u.rol==='jefe'?' selected':'')+'>Jefe</option>'
      +'<option value="wfm"'+(u&&u.rol==='wfm'?' selected':'')+'>WFM</option>'
      +'</select></div>'
      +'<div class="field"><label>Supervisor</label><select id="fSupervisor"><option value="">— Sin supervisor —</option>'
      +supervisores().map(function(s){ return '<option value="'+s.id+'"'+(u&&u.emailSupervisor===s.email?' selected':'')+'>'+s.nombre+' ('+s.email+')</option>'; }).join('')
      +'</select></div>'
      +'<div class="field"><label>Fecha de ingreso <span class="field-req">*</span></label><input type="date" id="fFecha" value="'+(u?u.fechaIngreso||'':'')+'"></div>'
      +'<div class="field"><label>Horas con goce</label><input type="number" id="fHCG" value="'+(u?u.horasConGoce:40)+'" min="0"></div>'
      +'<div class="field"><label>Horas sin goce</label><input type="number" id="fHSG" value="'+(u?u.horasSinGoce:480)+'" min="0"></div>'
      +'</div></div>'
      +'<div><div class="form-section-title">Vehículo</div><div class="form-grid">'
      +'<div class="field field-full"><div class="toggle-wrap" onclick="toggleVeh()">'
      +'<div class="toggle'+(veh?' on':'')+'" id="togVeh"><div class="toggle-thumb"></div></div>'
      +'<span class="toggle-label" id="togVehLabel">'+(veh?'Tiene vehículo':'Sin vehículo')+'</span>'
      +'</div></div>'
      +'<div id="camposVeh" style="display:'+(veh?'contents':'none')+'">'
      +'<div class="field"><label>Tipo</label><select id="fTipoVeh"><option value="">— Selecciona —</option>'
      +['Automóvil','Motocicleta','Camioneta'].map(function(t){ return '<option value="'+t+'"'+(u&&u.tipoVehiculo===t?' selected':'')+'>'+t+'</option>'; }).join('')

  function toggleVeh(){
    var tog=document.getElementById('togVeh');
    tog._on=!tog._on; tog.className='toggle'+(tog._on?' on':'');
    document.getElementById('togVehLabel').textContent=tog._on?'Tiene vehículo':'Sin vehículo';
    document.getElementById('camposVeh').style.display=tog._on?'contents':'none';
  }

  function guardarUsuario(){
    var nombre=g('fNombre'),email=g('fEmail'),docNum=g('fDocumento');
    var proyecto=g('fProyecto'),rol=g('fRol'),fecha=g('fFecha'),cargo=g('fCargo');
    var req=[{id:'fNombre',v:nombre},{id:'fDocumento',v:docNum},{id:'fEmail',v:email},
             {id:'fCargo',v:cargo},{id:'fProyecto',v:proyecto},{id:'fRol',v:rol},{id:'fFecha',v:fecha}];
    var primero=null;
    req.forEach(function(r){
      var el=document.getElementById(r.id); if(!el) return;
      if(!r.v){ el.style.borderColor='#DC2626'; if(!primero) primero=el; }
      else { el.style.borderColor=''; }
    });
    if(primero){ primero.scrollIntoView({behavior:'smooth',block:'center'}); showToast('Completa los campos marcados en rojo.'); return; }

    var togEl=document.getElementById('togVeh'), veh=togEl?togEl._on:false;
    var datos={
      nombre:nombre, email:email, documento:docNum, telefono:g('fTelefono'),
      cargo:cargo, canal:g('fCanal'), proyecto:proyecto, rol:rol,
      supervisor:supNombre(), emailSupervisor:supEmail(), fechaIngreso:fecha,
      horasConGoce:parseInt(g('fHCG'))||40, horasSinGoce:parseInt(g('fHSG'))||480,
      vehiculo:veh, tipoVehiculo:veh?g('fTipoVeh'):'', marca:veh?g('fMarca'):'',
      modelo:veh?g('fModelo'):'', placa:veh?g('fPlaca'):''
    };
    var btnG=document.getElementById('btnGuardar');
    btnG.disabled=true; btnG.textContent='Guardando...';

    if(modoForm==='nuevo'){
      db.collection('usuarios').where('documento','==',docNum).get()
        .then(function(snap){
          if(!snap.empty){
            btnG.disabled=false; btnG.textContent='Crear usuario';
            var el=document.getElementById('fDocumento'); if(el) el.style.borderColor='#DC2626';
            showToast('Ya existe un usuario con ese número de documento.'); return;
          }
          crearUsuarioAuth(email,datos,btnG);
        })
        .catch(function(){ crearUsuarioAuth(email,datos,btnG); });
      return;
    }
    datos.fechaActualizacion=firebase.firestore.FieldValue.serverTimestamp();
    db.collection('usuarios').doc(usuarioSeleccionado).update(datos)
      .then(function(){ cerrarModalForm(); showToast('Cambios guardados.'); })
      .catch(function(e){ btnG.disabled=false; btnG.textContent='Guardar cambios'; showToast('Error: '+e.message); console.error(e); });
  }

  function crearUsuarioAuth(email,datos,btnG){
    authSecondary.createUserWithEmailAndPassword(email,'ATU360*')
      .then(function(cred){
        var uid=cred.user.uid; authSecondary.signOut();
        datos.activo=true; datos.primerAcceso=true;
        datos.fechaCreacion=firebase.firestore.FieldValue.serverTimestamp();
        datos.creadoPor=currentUser.uid;
        return db.collection('usuarios').doc(uid).set(datos).then(function(){return uid;});
      })
      .then(function(uid){
        usuarioSeleccionado=uid; cerrarModalForm();
        showToast('Usuario creado. Contraseña inicial: ATU360*');
      })
      .catch(function(err){
        btnG.disabled=false; btnG.textContent='Crear usuario';
        if(err.code==='auth/email-already-in-use') showToast('Ese correo ya tiene una cuenta.');
        else { showToast('Error: '+err.message); console.error(err); }
      });
  }

  function cerrarModalForm(){ document.getElementById('modalForm').classList.remove('show'); }

  // ── Activar / Desactivar / Eliminar ───────────────────────────────────────────
  function pedirConfirm(id,activar){
    var u=usuarios.find(function(x){return x.id===id;});
    document.getElementById('confirmTitle').textContent=activar?'Activar usuario':'Desactivar usuario';
    document.getElementById('confirmSub').textContent=activar
      ?'¿Reactivar a '+u.nombre+'?'
      :'¿Desactivar a '+u.nombre+'? No podrá iniciar sesión hasta ser reactivado.';
    document.getElementById('confirmBtn').onclick=function(){ cambiarEstado(id,activar); cerrarConfirm(); };
    document.getElementById('modalConfirm').classList.add('show');
  }
  function cambiarEstado(id,activo){
    db.collection('usuarios').doc(id).update({activo:activo})
      .then(function(){ showToast(activo?'Usuario activado.':'Usuario desactivado.'); })
      .catch(function(err){ showToast('Error al actualizar.'); console.error(err); });
  }
  function cerrarConfirm(){ document.getElementById('modalConfirm').classList.remove('show'); }

  function pedirEliminar(id){
    var u=usuarios.find(function(x){return x.id===id;});
    document.getElementById('confirmTitle').textContent='Eliminar usuario';
    document.getElementById('confirmSub').textContent='¿Eliminar permanentemente a '+u.nombre+'? Esta acción no se puede deshacer.';
    document.getElementById('confirmBtn').onclick=function(){ eliminarUsuario(id); cerrarConfirm(); };
    document.getElementById('modalConfirm').classList.add('show');
  }
  function eliminarUsuario(id){
    db.collection('usuarios').doc(id).delete()
      .then(function(){ cerrarPanel(); showToast('Usuario eliminado del sistema.'); })
      .catch(function(err){ showToast('Error al eliminar: '+err.message); console.error(err); });
  }

  // ── CSV ───────────────────────────────────────────────────────────────────────
  var COLS_CSV     = ['nombre','documento','email','telefono','cargo','canal','proyecto','rol','supervisor','emailSupervisor','fechaIngreso','vehiculo','tipoVehiculo','marca','modelo','placa'];
  var PROYECTOS_OK = ['doctorsv','educacion','marn','global'];
  var ROLES_OK     = ['agente','agente-inmersion','supervisor','formacion','admin','wfm','jefe','superadmin'];
  var pendientesCSV = [];

  function descargarPlantilla(){
    var csv=COLS_CSV.join(',')+'\n'
      +['María Alvarado','04567890-1','maria@doctorsv.com','7890-1234','Agente de atención','Telefónico','doctorsv','agente','Juan Pérez','juan@doctorsv.com','2025-01-15','false','','','',''].join(',');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download='plantilla_usuarios_ATU360.csv'; a.click();
  }

  document.getElementById('csvInput').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(ev){ procesarCSV(ev.target.result); };
    r.readAsText(f,'UTF-8'); this.value='';
  });

  function normalizarFecha(f){
    if(!f) return '';
    var m=f.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    if(f.match(/^\d{4}-\d{2}-\d{2}$/)) return f;
    return '';
  }
  function detectarSeparador(linea){
    return ((linea.match(/;/g)||[]).length > (linea.match(/,/g)||[]).length) ? ';' : ',';
  }

  function procesarCSV(texto){
    var lineas=texto.trim().split('\n'); if(lineas.length<2){showToast('Archivo vacío.');return;}
    var sep=detectarSeparador(lineas[0]);
    var headers=lineas[0].split(sep).map(function(h){return h.trim().toLowerCase();});
    pendientesCSV=[]; var ok=0,err=0;
    var html='<table class="preview-table"><thead><tr><th>#</th><th>Nombre</th><th>Email</th><th>Proyecto</th><th>Rol</th><th>Estado</th></tr></thead><tbody>';
    lineas.slice(1).forEach(function(linea,i){
      if(!linea.trim()) return;
      var cols=linea.split(sep).map(function(c){return c.trim();}),fila={};
      headers.forEach(function(h,j){fila[h]=cols[j]||'';});
      var fecha=normalizarFecha(fila.fechaingreso||'');
      var errs=[];
      if(!fila.nombre) errs.push('Nombre');
      if(!fila.email||!fila.email.includes('@')) errs.push('Email');
      if(!fila.documento) errs.push('Documento');
      if(!PROYECTOS_OK.includes(fila.proyecto)) errs.push('Proyecto');
      if(!ROLES_OK.includes(fila.rol)) errs.push('Rol');
      if(!fecha) errs.push('Fecha');
      if(errs.length){ err++;
        html+='<tr class="error-row"><td>'+(i+1)+'</td><td>'+fila.nombre+'</td><td>'+fila.email+'</td><td>'+fila.proyecto+'</td><td>'+fila.rol+'</td><td><span class="badge-err">'+errs.join(', ')+'</span></td></tr>';
      } else { ok++;
        pendientesCSV.push({nombre:fila.nombre,documento:fila.documento,email:fila.email,telefono:fila.telefono||'',cargo:fila.cargo||'',canal:fila.canal||'',proyecto:fila.proyecto,rol:fila.rol,supervisor:fila.supervisor||'',emailSupervisor:fila.emailsupervisor||'',fechaIngreso:fecha,vehiculo:fila.vehiculo==='true',tipoVehiculo:fila.tipovehiculo||'',marca:fila.marca||'',modelo:fila.modelo||'',placa:fila.placa||'',horasConGoce:40,horasSinGoce:480,activo:true});
        html+='<tr><td>'+(i+1)+'</td><td>'+fila.nombre+'</td><td>'+fila.email+'</td><td>'+fila.proyecto+'</td><td>'+fila.rol+'</td><td><span class="badge-ok">Válido</span></td></tr>';
      }
    });
    html+='</tbody></table>';
    document.getElementById('csvPreview').innerHTML=html;
    document.getElementById('csvResumen').innerHTML='<strong>'+ok+' válidos</strong>'+(err?' · <span style="color:#DC2626">'+err+' con errores</span> (ignorados)':'');
    document.getElementById('btnConfirmarCsv').disabled=ok===0;
    document.getElementById('modalCsv').classList.add('show');
  }

  function confirmarCarga(){
    if(!pendientesCSV.length) return;
    var btn=document.getElementById('btnConfirmarCsv');
    btn.disabled=true; btn.textContent='Creando...';
    var creados=0,errores=0;
    function siguiente(i){
      if(i>=pendientesCSV.length){
        cerrarModalCsv();
        showToast(creados+' usuarios creados'+(errores?', '+errores+' errores.':'. Contraseña: ATU360*'));
        btn.disabled=false; btn.textContent='Crear usuarios'; return;
      }
      var u=pendientesCSV[i];
      authSecondary.createUserWithEmailAndPassword(u.email,'ATU360*')
        .then(function(cred){
          var uid=cred.user.uid; authSecondary.signOut();
          var datos=Object.assign({},u); delete datos.id;
          datos.activo=true; datos.primerAcceso=true;
          datos.fechaCreacion=firebase.firestore.FieldValue.serverTimestamp();
          datos.creadoPor=currentUser.uid;
          return db.collection('usuarios').doc(uid).set(datos);
        })
        .then(function(){ creados++; siguiente(i+1); })
        .catch(function(err){ errores++; console.error('Error con '+u.email+':',err.message); siguiente(i+1); });
    }
    siguiente(0);
  }
  function cerrarModalCsv(){ document.getElementById('modalCsv').classList.remove('show'); pendientesCSV=[]; }

  // ── Toast ─────────────────────────────────────────────────────────────────────
  function showToast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},3000);
  }
</script>

  initSidebar();
  initNotif(db, auth);
