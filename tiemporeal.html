<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="mobile-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATU 360 — Tiempo Real</title>
<base href="/atu-360/">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="base.css">
<style>
  .body-wrap  { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 20px 24px; gap: 14px; }

  /* STATS */
  .stats-row     { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  .stats-row + .stats-row { margin-top: -4px; }
  .stat-chip     { background: white; border: 1.5px solid #1A3DAA; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex: 1 1 0; min-width: 160px; cursor: pointer; transition: box-shadow 0.15s; }
  .stat-chip:hover { box-shadow: 0 2px 8px rgba(26,61,170,0.12); }
  .stat-chip.selected { box-shadow: 0 0 0 2px rgba(26,61,170,0.25); }
  .stat-chip-val { font-size: 1.3rem; font-weight: 800; color: #1A3DAA; line-height: 1; }
  .stat-chip-label { font-size: 0.68rem; color: #94A3B8; font-weight: 500; }
  .stat-chip.activos   .stat-chip-val { color: #16A34A; }
  .stat-chip.inactivos .stat-chip-val { color: #DC2626; }

  /* RESUMEN DE AUXILIARES */
  .rt-aux-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; flex-shrink: 0; }
  .rt-aux-card  { background: white; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; }
  .rt-aux-label { font-size: 0.65rem; font-weight: 700; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; }
  .rt-aux-val   { font-size: 1.5rem; font-weight: 800; line-height: 1.2; }
  .rt-aux-sub   { font-size: 0.68rem; color: #94A3B8; }

  /* CONTROLES */
  .controles  { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .ctrl-input { padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; width: 200px; }
  .ctrl-input:focus  { border-color: #1A3DAA; }
  .ctrl-select { padding: 8px 10px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.78rem; font-family: inherit; color: #1E293B; background: white; outline: none; cursor: pointer; }
  .ctrl-select:focus { border-color: #1A3DAA; }
  .count-label { font-size: 0.75rem; color: #94A3B8; font-weight: 500; margin-left: 4px; }

  /* GRILLA */
  .scroll-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

  .rt-group     { background: white; border: 1px solid #E2E8F0; border-radius: 10px; overflow: hidden; }
  .rt-group-hdr { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #F1F5F9; }
  .rt-grid      { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; padding: 14px 16px; }

  .ac-card      { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; transition: border-color 0.15s; }
  .ac-card:hover { border-color: #CBD5E1; }
  .ac-card.offline { opacity: 0.55; }
  .ac-card-top  { display: flex; align-items: center; gap: 8px; }
  .ac-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ac-indicator.on  { background: #16A34A; box-shadow: 0 0 0 3px rgba(22,163,74,0.2); }
  .ac-indicator.off { background: #CBD5E1; }
  .ac-av        { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; color: white; flex-shrink: 0; }
  .ac-av.online  { background: #1A3DAA; }
  .ac-av.offline { background: #94A3B8; }
  .ac-nombre    { font-size: 0.78rem; font-weight: 700; color: #1E293B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ac-proyecto  { font-size: 0.65rem; color: #94A3B8; }
  .ac-estado-badge { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; text-align: center; }
  .ac-rt-timer  { font-size: 0.72rem; font-variant-numeric: tabular-nums; text-align: center; font-weight: 600; }
  .ac-sin-marcaje { font-size: 0.7rem; color: #94A3B8; text-align: center; }

  .empty-state { text-align: center; padding: 60px 24px; color: #94A3B8; font-size: 0.82rem; }

  /* TABS */
  .tr-tabs-bar { display: flex; gap: 0; border-bottom: 1px solid #E2E8F0; flex-shrink: 0; }
  .tr-tab-btn { padding: 10px 16px; font-size: 0.82rem; font-weight: 600; color: #94A3B8; border: none; background: none; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tr-tab-btn.active { color: #1A3DAA; border-bottom-color: #1A3DAA; }

  /* HISTORIAL */
  .hist-filtros { background: white; border-radius: 10px; border: 1px solid #E2E8F0; padding: 14px 18px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; flex-shrink: 0; }
  .hist-field { display: flex; flex-direction: column; gap: 5px; }
  .hist-field label { font-size: 0.72rem; font-weight: 600; color: #64748B; }
  .hist-field input { padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 7px; font-size: 0.8rem; font-family: inherit; color: #1E293B; background: #F8FAFC; outline: none; }
  .hist-field input:focus { border-color: #1A3DAA; background: white; }
  .hist-tbl-wrap { flex: 1; overflow: auto; border: 1px solid #E2E8F0; border-radius: 10px; background: white; }
  table.hist-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  table.hist-table th { text-align: left; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.5px; color: #94A3B8; font-weight: 700; padding: 10px 14px; border-bottom: 1.5px solid #E2E8F0; background: #F8FAFC; position: sticky; top: 0; white-space: nowrap; }
  table.hist-table td { padding: 10px 14px; border-bottom: 1px solid #F1F5F9; color: #374151; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.hist-table tr.hist-total td { font-weight: 700; color: #1E293B; background: #F8FAFC; border-top: 1.5px solid #E2E8F0; border-bottom: none; }
  .hist-nombre { font-weight: 600; color: #1E293B; }

  /* Auto-refresh indicator */
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #16A34A; display: inline-block; margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main">
  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-left">
      <h2 style="font-size:0.9rem;font-weight:600">Tiempo Real</h2>
      <span class="topbar-sep">/</span>
      <p class="tb-page-sub" id="totalLabel">—</p>
    </div>
    <div class="topbar-right">
      <span style="font-size:0.72rem;color:#64748B;display:flex;align-items:center">
        <span class="live-dot"></span>En vivo
      </span>
      <div class="tb-clock" id="clock">--:--:--</div>
    </div>
  </div>

  <!-- CUERPO -->
  <div class="body-wrap">

    <!-- TABS -->
    <div class="tr-tabs-bar">
      <button class="tr-tab-btn active" id="trTabVivo" onclick="cambiarVistaTR('vivo')">Tiempo real</button>
      <button class="tr-tab-btn" id="trTabHist" onclick="cambiarVistaTR('historial')">Historial diario</button>
    </div>

    <div id="vistaTR_vivo" style="flex:1;display:flex;flex-direction:column;gap:14px;overflow:hidden">

    <!-- STATS -->
    <div style="display:flex;flex-direction:column;gap:10px;flex-shrink:0" id="rtStats">
      <div class="stats-row" id="rtStatsSup" style="display:none"></div>
      <div class="stats-row" id="rtStatsAgentes">
        <div class="stat-chip"><div class="stat-chip-val">—</div><div class="stat-chip-label">Total agentes</div></div>
        <div class="stat-chip activos"><div class="stat-chip-val">—</div><div class="stat-chip-label">En línea</div></div>
        <div class="stat-chip inactivos"><div class="stat-chip-val">—</div><div class="stat-chip-label">Fuera</div></div>
      </div>
    </div>

    <!-- RESUMEN DE AUXILIARES -->
    <div class="rt-aux-grid" id="rtAuxGrid"></div>

    <!-- CONTROLES -->
    <div class="controles">
      <input class="ctrl-input" id="rtBusq" placeholder="Buscar agente..." oninput="renderRT()">
      <select class="ctrl-select" id="rtFiltProy" onchange="renderRT()">
        <option value="">Todos los proyectos</option>
        <option value="doctorsv">DoctorSV</option>
        <option value="educacion">Educación</option>
        <option value="marn">MARN</option>
        <option value="global">Global</option>
      </select>
      <select class="ctrl-select" id="rtFiltEst" onchange="renderRT()">
        <option value="">Todos los estados</option>
      </select>
      <span class="count-label" id="rtCount"></span>
    </div>

    <!-- GRUPOS -->
    <div class="scroll-area" id="rtGrid">
      <div class="empty-state">Cargando…</div>
    </div>

    </div>

    <!-- HISTORIAL DIARIO -->
    <div id="vistaTR_historial" style="display:none;flex:1;flex-direction:column;gap:14px;overflow:hidden">
      <div class="hist-filtros">
        <div class="hist-field">
          <label>Desde</label>
          <input type="date" id="histDesde" onchange="cargarHistorial()">
        </div>
        <div class="hist-field">
          <label>Hasta</label>
          <input type="date" id="histHasta" onchange="cargarHistorial()">
        </div>
        <span class="count-label" id="histInfo"></span>
      </div>
      <div class="hist-tbl-wrap">
        <table class="hist-table">
          <thead>
            <tr>
              <th>Agente</th><th>Primer login</th><th>Último logout</th><th>Login</th>
              <th>Baño</th><th>Break</th><th>Comida</th><th>Capacitación</th><th>Personal</th><th>Retroalimentación</th>
            </tr>
          </thead>
          <tbody id="histTbody"><tr><td colspan="10"><div class="empty-state">Cargando…</div></td></tr></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  var BASE = 'https://atencionalusuario.github.io/atu-360/';

  firebase.initializeApp({
    apiKey:            "AIzaSyD7QOy_Iv9-AxWmReQOfNCwLaFkEyZakM8",
    authDomain:        "atu-360.firebaseapp.com",
    projectId:         "atu-360",
    storageBucket:     "atu-360.firebasestorage.app",
    messagingSenderId: "820106715923",
    appId:             "1:820106715923:web:9c58af48af1dce06ac30e6"
  });
  var db   = firebase.firestore();
  var auth = firebase.auth();

  setInterval(function(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV'); }, 1000);
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-SV');

  var ROLES_PERMITIDOS = ['jefe','wfm','admin','superadmin','supervisor'];
  var LABELS_PROY = { doctorsv:'DoctorSV', educacion:'Educación', marn:'MARN', global:'Global' };

  var RT_ESTADOS = {
    'Inbound':              { bg:'#EEF2FF', text:'#1A3DAA' },
    'Outbound':             { bg:'#F0F9FF', text:'#0284C7' },
    'Pausa administrativa': { bg:'#F5F3FF', text:'#7C3AED' },
    'Break':                { bg:'#FFF7ED', text:'#C2410C' },
    'Baño':                 { bg:'#F0FDF4', text:'#15803D' },
    'Comida':               { bg:'#FEF9C3', text:'#92400E' },
    'Capacitación':         { bg:'#F0FDF4', text:'#065F46' },
    'Feedback':             { bg:'#FDF4FF', text:'#86198F' },
    'Jornada finalizada':   { bg:'#F1F5F9', text:'#64748B' },
    'Fuera':                { bg:'#F1F5F9', text:'#94A3B8' }
  };

  var agentes  = [];
  var timers   = {};
  var miRol    = '';
  var miEmail  = '';
  var filtroLinea = '';   // '' = todos | 'online' | 'offline'

  window.setFiltroLinea = function(v){
    filtroLinea = (filtroLinea === v) ? '' : v;   // clic en el activo lo deselecciona
    renderRT();
  };

  window.handleStatClick = function(key, fv){
    if (fv) setFiltroLinea(fv);
    mostrarListaRT(key);
  };

  // ── Modal: listado de personas por tarjeta ──────────────────────────────────────
  function crearModalListado() {
    var ov = document.createElement('div');
    ov.id = 'lstModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.4);z-index:9999;display:none;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto;';
    ov.innerHTML =
      '<div style="background:white;border-radius:12px;width:420px;max-width:92vw;box-shadow:0 24px 48px rgba(0,0,0,0.18);max-height:76vh;display:flex;flex-direction:column;">'
      +'<div style="padding:18px 20px;border-bottom:1px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">'
      +'<div id="lstTitulo" style="font-size:0.92rem;font-weight:700;color:#1E293B"></div>'
      +'<button id="lstClose" style="border:none;background:none;cursor:pointer;font-size:1.1rem;color:#94A3B8;line-height:1">✕</button>'
      +'</div>'
      +'<div id="lstBody" style="padding:6px 20px;overflow-y:auto"></div>'
      +'</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov) ov.style.display = 'none'; });
    document.getElementById('lstClose').addEventListener('click', function(){ ov.style.display = 'none'; });
    return ov;
  }

  window.mostrarListaRT = function(key) {
    var data = (window._rtListas || {})[key];
    if (!data) return;
    var m = document.getElementById('lstModal') || crearModalListado();
    document.getElementById('lstTitulo').textContent = data.titulo + ' (' + data.items.length + ')';
    var body = document.getElementById('lstBody');
    if (data.items.length === 0) {
      body.innerHTML = '<div style="padding:24px 4px;text-align:center;color:#94A3B8;font-size:0.82rem">Sin registros.</div>';
    } else {
      var lista = data.items.slice().sort(function(a,b){ return (a.nombre||'').localeCompare(b.nombre||'','es'); });
      body.innerHTML = lista.map(function(a){
        var estado = a.enLinea ? (a.estadoActual || 'En línea') : 'Fuera';
        var pLabel = LABELS_PROY[a.proyecto] || '';
        return '<div style="display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #F1F5F9">'
          + '<div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:'+(a.enLinea?'#16A34A':'#CBD5E1')+'"></div>'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:0.82rem;font-weight:600;color:#1E293B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escHtml(a.nombre||a.email||'?')+'</div>'
          + '<div style="font-size:0.68rem;color:#94A3B8">'+escHtml(estado)+(pLabel?' · '+pLabel:'')+'</div>'
          + '</div></div>';
      }).join('');
    }
    m.style.display = 'flex';
  };

  auth.onAuthStateChanged(function(user) {
    if (!user) { window.location.href = BASE + 'login.html'; return; }
    db.collection('usuarios').doc(user.uid).get().then(function(doc) {
      if (!doc.exists || !ROLES_PERMITIDOS.includes(doc.data().rol)) {
        window.location.href = BASE + 'home.html'; return;
      }
      var rol      = doc.data().rol;
      var email    = user.email;
      var proyecto = doc.data().proyecto || '';
      iniciarTiempoReal(rol, email, proyecto);
    });
  });

  var ROLES_PROYECTO_RESTRINGIDO_RT = ['jefe','admin','wfm'];

  function iniciarTiempoReal(rol, email, proyecto) {
    miRol = rol; miEmail = email;
    var query;
    if (rol === 'supervisor') {
      query = db.collection('usuarios')
        .where('emailSupervisor', '==', email);
    } else if (ROLES_PROYECTO_RESTRINGIDO_RT.includes(rol)) {
      // jefe/admin/wfm: solo su propio proyecto
      query = db.collection('usuarios')
        .where('rol', 'in', ['agente', 'agente-inmersion', 'supervisor'])
        .where('proyecto', '==', proyecto);
    } else {
      // superadmin: toda la organización
      query = db.collection('usuarios')
        .where('rol', 'in', ['agente', 'agente-inmersion', 'supervisor']);
    }
    query.onSnapshot(function(snap) {
      agentes = [];
      snap.forEach(function(d) {
        var data = d.data();
        if (data.activo === false) return;   // excluir usuarios desactivados
        agentes.push(Object.assign({ id: d.id }, data));
      });
      renderRT();
    }, function(e) { console.error('rt', e); showToast('Error al cargar datos.'); });
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function iniciales(n) { return (n||'?').split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase(); }
  function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ── Tabs: Tiempo real / Historial diario ────────────────────────────────────────
  window.cambiarVistaTR = function(v){
    document.getElementById('trTabVivo').classList.toggle('active', v === 'vivo');
    document.getElementById('trTabHist').classList.toggle('active', v === 'historial');
    document.getElementById('vistaTR_vivo').style.display     = v === 'vivo' ? 'flex' : 'none';
    document.getElementById('vistaTR_historial').style.display = v === 'historial' ? 'flex' : 'none';
    if (v === 'historial') {
      if (!document.getElementById('histDesde').value) {
        var hoy = new Date();
        var iso = hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
        document.getElementById('histDesde').value = iso;
        document.getElementById('histHasta').value = iso;
      }
      cargarHistorial();
    }
  };

  // ── Historial diario: login/logout y tiempo por auxiliar, por agente ────────────
  window.cargarHistorial = function(){
    var desde = document.getElementById('histDesde').value;
    var hasta = document.getElementById('histHasta').value;
    if (!desde || !hasta) return;
    document.getElementById('histTbody').innerHTML = '<tr><td colspan="10"><div class="empty-state">Cargando…</div></td></tr>';

    var desdeTs = firebase.firestore.Timestamp.fromDate(new Date(desde+'T00:00:00'));
    var hastaTs = firebase.firestore.Timestamp.fromDate(new Date(hasta+'T23:59:59'));
    var roster  = agentes.filter(function(a){ return a.rol !== 'supervisor'; });
    var emailsSet = {}; roster.forEach(function(a){ emailsSet[a.email] = true; });

    Promise.all([
      db.collection('marcajes').where('timestamp','>=',desdeTs).where('timestamp','<=',hastaTs).get(),
      db.collection('auxiliares').where('timestamp','>=',desdeTs).where('timestamp','<=',hastaTs).get()
    ]).then(function(res){
      var porAgente = {};
      roster.forEach(function(a){
        porAgente[a.email] = { nombre: a.nombre||a.email, primer: null, ultimo: null, entradasPorFecha: {}, salidasPorFecha: {}, aux: {} };
      });
      res[0].forEach(function(d){
        var m = d.data(); var p = porAgente[m.email]; if (!p) return;
        var ts = m.timestamp ? m.timestamp.toDate() : null; if (!ts) return;
        if (m.tipo === 'entrada') {
          if (!p.primer || ts < p.primer) p.primer = ts;
          if (!p.entradasPorFecha[m.fecha]) p.entradasPorFecha[m.fecha] = ts;
        } else if (m.tipo === 'salida') {
          if (!p.ultimo || ts > p.ultimo) p.ultimo = ts;
          p.salidasPorFecha[m.fecha] = ts;
        }
      });
      res[1].forEach(function(d){
        var x = d.data(); var p = porAgente[x.email]; if (!p) return;
        p.aux[x.auxiliar] = (p.aux[x.auxiliar]||0) + (x.duracion_seg||0);
      });

      var filas = roster.map(function(a){
        var p = porAgente[a.email];
        var loginSeg = 0;
        Object.keys(p.entradasPorFecha).forEach(function(fecha){
          var e = p.entradasPorFecha[fecha], s = p.salidasPorFecha[fecha];
          if (e && s) loginSeg += Math.floor((s - e) / 1000);
        });
        return {
          nombre: p.nombre, primer: p.primer, ultimo: p.ultimo, loginSeg: loginSeg,
          banio: p.aux['Baño']||0, brk: p.aux['Break']||0, comida: p.aux['Comida']||0,
          capacitacion: p.aux['Capacitación']||0, personal: p.aux['Pausa administrativa']||0, feedback: p.aux['Feedback']||0
        };
      });
      filas.sort(function(a,b){ return a.nombre.localeCompare(b.nombre,'es'); });
      renderHistorial(filas);
    }).catch(function(e){
      console.error(e);
      document.getElementById('histTbody').innerHTML = '<tr><td colspan="10"><div class="empty-state">Error al cargar el historial.</div></td></tr>';
    });
  };

  function fmtHora(d){ return d ? d.toLocaleTimeString('es-SV',{hour:'2-digit',minute:'2-digit'}) : '—'; }
  function fmtHM(seg){ var h=Math.floor(seg/3600), m=Math.floor((seg%3600)/60); return pad(h)+':'+pad(m); }

  function renderHistorial(filas){
    document.getElementById('histInfo').textContent = filas.length + ' agente(s)';
    if (filas.length === 0) {
      document.getElementById('histTbody').innerHTML = '<tr><td colspan="10"><div class="empty-state">Sin agentes para mostrar.</div></td></tr>';
      return;
    }
    var html = filas.map(function(f){
      return '<tr><td class="hist-nombre">'+escHtml(f.nombre)+'</td>'
        + '<td>'+fmtHora(f.primer)+'</td><td>'+fmtHora(f.ultimo)+'</td><td>'+fmtHM(f.loginSeg)+'</td>'
        + '<td>'+fmtHM(f.banio)+'</td><td>'+fmtHM(f.brk)+'</td><td>'+fmtHM(f.comida)+'</td>'
        + '<td>'+fmtHM(f.capacitacion)+'</td><td>'+fmtHM(f.personal)+'</td><td>'+fmtHM(f.feedback)+'</td></tr>';
    }).join('');
    document.getElementById('histTbody').innerHTML = html;
  }

  function renderRT() {
    var busq   = document.getElementById('rtBusq').value;
    var fProy  = document.getElementById('rtFiltProy').value;
    var fEst   = document.getElementById('rtFiltEst').value;
    var hayFiltro = !!(busq || fProy || fEst || filtroLinea);

    var lista = agentes.filter(function(a) {
      if (busq && !(a.nombre||'').toLowerCase().includes(busq.toLowerCase()) && !(a.email||'').toLowerCase().includes(busq.toLowerCase())) return false;
      if (fProy && a.proyecto !== fProy) return false;
      if (fEst  && (a.estadoActual||'Fuera') !== fEst) return false;
      if (filtroLinea === 'online'  && !a.enLinea) return false;
      if (filtroLinea === 'offline' &&  a.enLinea) return false;
      return true;
    });

    var supervisores = agentes.filter(function(a) { return a.rol === 'supervisor'; });
    supervisores.sort(function(a,b) { return (a.nombre||'').localeCompare(b.nombre||'','es'); });
    var soloAgentes = lista.filter(function(a) { return a.rol !== 'supervisor'; });
    soloAgentes.sort(function(a,b) {
      if (a.enLinea && !b.enLinea) return -1;
      if (!a.enLinea && b.enLinea) return 1;
      return (a.nombre||'').localeCompare(b.nombre||'','es');
    });

    // Stats
    var enLineaTotal = agentes.filter(function(a){ return !!a.enLinea && a.rol !== 'supervisor'; }).length;
    var totalAgentes = agentes.filter(function(a){ return a.rol !== 'supervisor'; }).length;
    function statChip(cls, val, label, fv, key){
      var sel = fv && filtroLinea === fv;
      return '<div class="stat-chip '+cls+(sel?' selected':'')+'" onclick="handleStatClick(\''+key+'\',\''+fv+'\')">'
        +'<div class="stat-chip-val">'+val+'</div><div class="stat-chip-label">'+label+'</div></div>';
    }

    var agentesRol = agentes.filter(function(a){ return a.rol !== 'supervisor'; });
    var listas = {
      'sup-total':   { titulo: 'Total supervisores',    items: supervisores },
      'sup-online':  { titulo: 'Supervisores en línea', items: supervisores.filter(function(a){ return !!a.enLinea; }) },
      'sup-offline': { titulo: 'Supervisores fuera',    items: supervisores.filter(function(a){ return !a.enLinea; }) },
      'ag-total':    { titulo: 'Total agentes',         items: agentesRol },
      'ag-online':   { titulo: 'Agentes en línea',      items: agentesRol.filter(function(a){ return !!a.enLinea; }) },
      'ag-offline':  { titulo: 'Agentes fuera',         items: agentesRol.filter(function(a){ return !a.enLinea; }) }
    };
    window._rtListas = listas;

    var supStatsEl = document.getElementById('rtStatsSup');
    if (miRol !== 'supervisor') {
      var supEnLinea = supervisores.filter(function(a){ return !!a.enLinea; }).length;
      var supTotal   = supervisores.length;
      supStatsEl.style.display = 'flex';
      supStatsEl.innerHTML =
          '<div class="stat-chip" onclick="mostrarListaRT(\'sup-total\')"><div class="stat-chip-val" style="color:#1A3DAA">'+supTotal+'</div><div class="stat-chip-label">Total supervisores</div></div>'
        + '<div class="stat-chip activos" onclick="mostrarListaRT(\'sup-online\')"><div class="stat-chip-val">'+supEnLinea+'</div><div class="stat-chip-label">Supervisores en línea</div></div>'
        + '<div class="stat-chip inactivos" onclick="mostrarListaRT(\'sup-offline\')"><div class="stat-chip-val">'+(supTotal-supEnLinea)+'</div><div class="stat-chip-label">Supervisores fuera</div></div>';
    } else {
      supStatsEl.style.display = 'none';
      supStatsEl.innerHTML = '';
    }
    document.getElementById('rtStatsAgentes').innerHTML =
        statChip('',          totalAgentes,               'Total agentes', '',        'ag-total')
      + statChip('activos',   enLineaTotal,               'En línea',      'online',  'ag-online')
      + statChip('inactivos', (totalAgentes-enLineaTotal), 'Fuera',         'offline', 'ag-offline');

    document.getElementById('totalLabel').textContent = soloAgentes.length + ' de ' + totalAgentes + ' agentes';
    document.getElementById('rtCount').textContent    = soloAgentes.length + ' de ' + totalAgentes + ' agentes';

    // Resumen de auxiliares (equipo completo, sin filtros)
    var soloAgentesTodos = agentes.filter(function(a){ return a.rol !== 'supervisor'; });
    var enLineaTodos = soloAgentesTodos.filter(function(a){ return !!a.enLinea; });
    var porEstado = {};
    enLineaTodos.forEach(function(a){ var e = a.estadoActual || 'Fuera'; porEstado[e] = (porEstado[e]||0)+1; });
    function auxCard(val, color, label, sub) {
      return '<div class="rt-aux-card"><div class="rt-aux-label">'+label+'</div><div class="rt-aux-val" style="color:'+color+'">'+val+'</div>'
        + (sub ? '<div class="rt-aux-sub">'+sub+'</div>' : '') + '</div>';
    }
    document.getElementById('rtAuxGrid').innerHTML =
        auxCard(enLineaTodos.length, '#16A34A', 'Agentes disponibles', 'de ' + totalAgentes + ' activos')
      + auxCard(porEstado['Pausa administrativa']||0,RT_ESTADOS['Pausa administrativa'].text,'En pausa administrativa')
      + auxCard(porEstado['Inbound']||0,              RT_ESTADOS['Inbound'].text,             'En Inbound')
      + auxCard(porEstado['Outbound']||0,             RT_ESTADOS['Outbound'].text,            'En Outbound')
      + auxCard(porEstado['Break']||0,               RT_ESTADOS['Break'].text,               'En break')
      + auxCard(porEstado['Baño']||0,               RT_ESTADOS['Baño'].text,               'En baño')
      + auxCard(porEstado['Comida']||0,              RT_ESTADOS['Comida'].text,              'En comida')
      + auxCard(porEstado['Capacitación']||0,        RT_ESTADOS['Capacitación'].text,        'En capacitación')
      + auxCard(porEstado['Feedback']||0,             RT_ESTADOS['Feedback'].text,            'En retroalimentación');

    // Actualizar filtro de estados
    var filtEl  = document.getElementById('rtFiltEst');
    var prevVal = filtEl.value;
    var estados = {};
    agentes.forEach(function(a) { var e = a.estadoActual||'Fuera'; estados[e] = (estados[e]||0)+1; });
    filtEl.innerHTML = '<option value="">Todos los estados</option>';
    Object.keys(estados).sort().forEach(function(e) {
      filtEl.innerHTML += '<option value="'+e+'">'+e+' ('+estados[e]+')</option>';
    });
    filtEl.value = prevVal;

    // Limpiar timers anteriores
    Object.keys(timers).forEach(function(k) { clearInterval(timers[k]); });
    timers = {};

    // Agrupar por supervisor
    var grupos = {};
    soloAgentes.forEach(function(a) {
      var key = a.emailSupervisor || '__sin__';
      if (!grupos[key]) grupos[key] = [];
      grupos[key].push(a);
    });

    function cardHtml(a) {
      var online  = !!a.enLinea;
      var estado  = a.estadoActual || 'Fuera';
      var cfg     = RT_ESTADOS[estado] || RT_ESTADOS['Fuera'];
      var pLabel  = LABELS_PROY[a.proyecto] || '';
      var esPoder     = ['supervisor','jefe','superadmin'].indexOf(miRol) >= 0;
      var puedeReset  = esPoder && a.estadoActual === 'Jornada finalizada';
      var puedeForzar = esPoder && online;
      var offBtn = puedeForzar
        ? '<button onclick="forzarSalida(\''+a.id+'\')" title="Marcar salida de emergencia" style="margin-left:auto;flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1px solid #FECACA;background:#FEF2F2;color:#DC2626;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">'
            +'<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>'
            +'</button>'
        : '';
      return '<div class="ac-card'+(online?'':' offline')+'">'
        +'<div class="ac-card-top">'
        +'<div class="ac-indicator '+(online?'on':'off')+'"></div>'
        +'<div class="ac-av '+(online?'online':'offline')+'">'+escHtml(iniciales(a.nombre||a.email))+'</div>'
        +'<div style="min-width:0;flex:1">'
        +'<div class="ac-nombre">'+escHtml(a.nombre||a.email||'?')+'</div>'
        +(pLabel?'<div class="ac-proyecto">'+pLabel+'</div>':'')
        +'</div>'
        + offBtn
        +'</div>'
        +(online
          ?'<div class="ac-estado-badge" style="background:'+cfg.bg+';color:'+cfg.text+'">'+escHtml(estado)+'</div>'
           +'<div style="display:flex;gap:6px;align-items:center;margin-top:2px">'
           +'<div style="flex:1;text-align:center">'
           +'<div style="font-size:0.6rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px">Jornada</div>'
           +'<div class="ac-rt-timer" style="color:#1E293B;font-size:0.78rem" id="jrt-'+a.id+'">--:--:--</div>'
           +'</div>'
           +'<div style="width:1px;background:#E2E8F0;height:28px"></div>'
           +'<div style="flex:1;text-align:center">'
           +'<div style="font-size:0.6rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px">Estado</div>'
           +'<div class="ac-rt-timer" style="color:'+cfg.text+';font-size:0.78rem" id="ert-'+a.id+'">00:00:00</div>'
           +'</div>'
           +'</div>'
          :'<div class="ac-sin-marcaje">Sin entrada hoy</div>')
        +(puedeReset
          ? '<button onclick="resetTurno(\''+a.id+'\')" style="margin-top:8px;width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:6px;background:white;color:#1A3DAA;font-size:0.68rem;font-weight:700;cursor:pointer;font-family:inherit">↺ Reanudar turno</button>'
          : '')
        +'</div>';
    }

    var html = '';

    supervisores.forEach(function(sup) {
      var grp = grupos[sup.email] || [];
      if (hayFiltro && grp.length === 0) return;
      var supOnline = !!sup.enLinea;
      var enLinGrp  = grp.filter(function(a){ return !!a.enLinea; }).length;
      var sEstado   = sup.estadoActual || 'Fuera';
      var scfg      = RT_ESTADOS[sEstado] || RT_ESTADOS['Fuera'];
      html += '<div class="rt-group">'
        +'<div class="rt-group-hdr">'
        +'<div class="ac-indicator '+(supOnline?'on':'off')+'" style="width:10px;height:10px"></div>'
        +'<div class="ac-av '+(supOnline?'online':'offline')+'" style="width:28px;height:28px;font-size:0.62rem">'+iniciales(sup.nombre||sup.email)+'</div>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:0.82rem;font-weight:700;color:#1E293B">'+escHtml(sup.nombre||sup.email||'?')+'</div>'
        +'<div style="font-size:0.68rem;color:#94A3B8">Supervisor · '+(supOnline?'<span style="color:#16A34A;font-weight:700">En línea</span>':'Fuera')+'</div>'
        +'</div>'
        +(supOnline
          ? '<div class="ac-estado-badge" style="background:'+scfg.bg+';color:'+scfg.text+';margin-right:12px;flex-shrink:0">'+escHtml(sEstado)+'</div>'
            +'<div style="text-align:center;margin-right:14px;flex-shrink:0"><div style="font-size:0.55rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px">Jornada</div><div class="ac-rt-timer" style="color:#1E293B;font-size:0.74rem" id="jrt-'+sup.id+'">--:--:--</div></div>'
            +'<div style="text-align:center;margin-right:14px;flex-shrink:0"><div style="font-size:0.55rem;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px">Estado</div><div class="ac-rt-timer" style="color:'+scfg.text+';font-size:0.74rem" id="ert-'+sup.id+'">00:00:00</div></div>'
          : '')
        +'<div style="font-size:0.72rem;font-weight:700;color:#1A3DAA;background:#EEF2FF;padding:3px 10px;border-radius:20px;flex-shrink:0">'+enLinGrp+' / '+grp.length+'</div>'
        +((['supervisor','jefe','superadmin'].indexOf(miRol) >= 0 && supOnline)
          ? '<button onclick="forzarSalida(\''+sup.id+'\')" title="Marcar salida de emergencia" style="margin-left:8px;width:24px;height:24px;border-radius:50%;border:1px solid #FECACA;background:#FEF2F2;color:#DC2626;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0">'
             +'<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 11-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>'
             +'</button>'
          : '')
        +'</div>';

      if (grp.length > 0) {
        html += '<div class="rt-grid" style="padding-left:12px">';
        grp.forEach(function(a) { html += cardHtml(a); });
        html += '</div>';
      } else {
        html += '<div style="font-size:0.78rem;color:#94A3B8;padding:8px 16px">Sin agentes asignados.</div>';
      }
      html += '</div>';
    });

    // Grupos cuyo supervisor no está en la lista cargada (p.ej. un supervisor
    // viendo solo a su equipo: no aparece su propio doc con rol 'supervisor').
    var supEmails = {};
    supervisores.forEach(function(s){ supEmails[s.email] = true; });
    Object.keys(grupos).forEach(function(key) {
      if (key === '__sin__' || supEmails[key]) return;
      var grp = grupos[key];
      if (hayFiltro && grp.length === 0) return;
      var enLinOrf = grp.filter(function(a){ return !!a.enLinea; }).length;
      var hdr = (key === miEmail) ? 'Mi equipo' : escHtml(key);
      html += '<div class="rt-group">'
        +'<div class="rt-group-hdr">'
        +'<div style="flex:1;font-size:0.82rem;font-weight:700;color:#1E293B">'+hdr+'</div>'
        +'<div style="font-size:0.72rem;font-weight:700;color:#1A3DAA;background:#EEF2FF;padding:3px 10px;border-radius:20px">'+enLinOrf+' / '+grp.length+'</div>'
        +'</div>'
        +'<div class="rt-grid" style="padding-left:12px">';
      grp.forEach(function(a) { html += cardHtml(a); });
      html += '</div></div>';
    });

    var sinSup = grupos['__sin__'] || [];
    if (sinSup.length > 0) {
      var enLinSin = sinSup.filter(function(a){ return !!a.enLinea; }).length;
      html += '<div class="rt-group">'
        +'<div class="rt-group-hdr">'
        +'<div style="flex:1;font-size:0.82rem;font-weight:700;color:#94A3B8">Sin supervisor asignado</div>'
        +'<div style="font-size:0.72rem;font-weight:700;color:#94A3B8;background:#F1F5F9;padding:3px 10px;border-radius:20px">'+enLinSin+' / '+sinSup.length+'</div>'
        +'</div>'
        +'<div class="rt-grid" style="padding-left:12px">';
      sinSup.forEach(function(a) { html += cardHtml(a); });
      html += '</div></div>';
    }

    document.getElementById('rtGrid').innerHTML = html ||
      '<div class="empty-state">Sin agentes para los filtros seleccionados.</div>';

    // Timers en vivo — jornada + estado (agentes y supervisores en línea)
    soloAgentes.concat(supervisores).filter(function(a){ return !!a.enLinea; }).forEach(function(a) {
      var jEl = document.getElementById('jrt-'+a.id);
      var eEl = document.getElementById('ert-'+a.id);
      if (!jEl && !eEl) return;

      var jDesde = a.entradaDesde ? (a.entradaDesde.toDate ? a.entradaDesde.toDate() : new Date(a.entradaDesde)) : null;
      var eDesde = a.estadoDesde  ? (a.estadoDesde.toDate  ? a.estadoDesde.toDate()  : new Date(a.estadoDesde))  : null;

      timers[a.id] = setInterval(function() {
        var now = new Date();
        if (jEl && jDesde) {
          var seg = Math.floor((now - jDesde) / 1000);
          jEl.textContent = pad(Math.floor(seg/3600))+':'+pad(Math.floor((seg%3600)/60))+':'+pad(seg%60);
        }
        if (eEl && eDesde) {
          var seg2 = Math.floor((now - eDesde) / 1000);
          eEl.textContent = pad(Math.floor(seg2/3600))+':'+pad(Math.floor((seg2%3600)/60))+':'+pad(seg2%60);
        }
      }, 1000);
    });
  }

  // ── Reanudar turno (supervisor/jefe): deshace una salida marcada por error ──────
  window.resetTurno = function(uid) {
    var a = agentes.find(function(x){ return x.id === uid; });
    var nombre = a ? (a.nombre || a.email || 'el agente') : 'el agente';
    if (!window.confirm('¿Reanudar el turno de ' + nombre + '?\n\nSe eliminará la salida de hoy y su turno volverá a estar activo (conserva la hora de entrada y el registro del día). El agente deberá recargar su página.')) return;
    var hoyFecha = new Date().toLocaleDateString('es-SV');
    db.collection('marcajes')
      .where('uid', '==', uid)
      .where('fecha', '==', hoyFecha)
      .get()
      .then(function(snap) {
        var salidas = [], entradaTs = null;
        snap.forEach(function(d) {
          var data = d.data();
          if (data.tipo === 'salida') salidas.push(d.ref);
          if (data.tipo === 'entrada' && !entradaTs) entradaTs = data.timestamp || null;
        });
        if (salidas.length === 0) { showToast(nombre + ' no tiene un turno finalizado hoy.'); return; }
        var batch = db.batch();
        salidas.forEach(function(ref) { batch.delete(ref); });
        var upd = { estadoActual: 'Pausa administrativa', estadoDesde: firebase.firestore.FieldValue.serverTimestamp() };
        if (entradaTs) upd.entradaDesde = entradaTs;
        batch.update(db.collection('usuarios').doc(uid), upd);
        return batch.commit().then(function() {
          showToast('Turno de ' + nombre + ' reanudado. Debe recargar su página.');
        });
      })
      .catch(function(e) { console.error(e); showToast('No se pudo reanudar el turno.'); });
  };

  // ── Marcar salida de emergencia (supervisor/jefe) ───────────────────────────────
  var _fsUid = null;

  function crearModalForzarSalida() {
    var ov = document.createElement('div');
    ov.id = 'fsModal';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.4);z-index:9999;display:none;align-items:center;justify-content:center;';
    ov.innerHTML =
      '<div style="background:white;border-radius:12px;width:410px;max-width:92vw;padding:24px;box-shadow:0 24px 48px rgba(0,0,0,0.18)">'
      +'<div style="font-size:0.98rem;font-weight:700;color:#1E293B;margin-bottom:8px">Marcar salida de emergencia</div>'
      +'<div style="font-size:0.85rem;color:#475569;line-height:1.6">¿Estás seguro de marcar la salida a <strong id="fsNombre"></strong>? Se finalizará su jornada de hoy y quedará fuera de línea.</div>'
      +'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">'
      +'<button id="fsCancel" style="padding:9px 16px;border:1.5px solid #E2E8F0;border-radius:7px;background:white;font-size:0.82rem;font-weight:600;color:#374151;cursor:pointer;font-family:inherit">Cancelar</button>'
      +'<button id="fsOk" style="padding:9px 16px;border:none;border-radius:7px;background:#DC2626;color:white;font-size:0.82rem;font-weight:700;cursor:pointer;font-family:inherit">Marcar salida</button>'
      +'</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if (e.target === ov) cerrarModalFS(); });
    document.getElementById('fsCancel').addEventListener('click', cerrarModalFS);
    document.getElementById('fsOk').addEventListener('click', confirmarForzarSalida);
    return ov;
  }

  function cerrarModalFS() {
    var m = document.getElementById('fsModal');
    if (m) m.style.display = 'none';
    _fsUid = null;
  }

  window.forzarSalida = function(uid) {
    _fsUid = uid;
    var a = agentes.find(function(x){ return x.id === uid; });
    var nombre = a ? (a.nombre || a.email || 'este usuario') : 'este usuario';
    var m = document.getElementById('fsModal') || crearModalForzarSalida();
    document.getElementById('fsNombre').textContent = nombre;
    m.style.display = 'flex';
  };

  function confirmarForzarSalida() {
    var uid = _fsUid;
    cerrarModalFS();
    if (!uid) return;
    var a = agentes.find(function(x){ return x.id === uid; });
    var nombre = a ? (a.nombre || a.email || 'el usuario') : 'el usuario';
    var now = new Date();
    var batch = db.batch();
    batch.set(db.collection('marcajes').doc(), {
      uid: uid,
      email: a ? (a.email || '') : '',
      tipo: 'salida',
      hora: now.toLocaleTimeString('es-SV'),
      fecha: now.toLocaleDateString('es-SV'),
      foto: null,
      forzadoPor: miEmail || '',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(db.collection('usuarios').doc(uid), {
      estadoActual: 'Jornada finalizada',
      estadoDesde:  firebase.firestore.FieldValue.serverTimestamp(),
      entradaDesde: null,
      enLinea:      false
    });
    batch.commit()
      .then(function(){ showToast('Salida marcada para ' + nombre + '.'); })
      .catch(function(e){ console.error(e); showToast('No se pudo marcar la salida.'); });
  }

  // ── Toast ─────────────────────────────────────────────────────────────────────
  var _toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
</script>
<script src="notif.js"></script>
<script src="sidebar.js"></script>
<script>
  initSidebar();
  initNotif(db, auth);
</script>
